<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Top-up stok</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
:root {
  --ground: #f6f3ee; --card: #ffffff; --ink: #1b1d22; --muted: #5d6270; --line: #e4e0d8;
  --brand: #1f3561; --brand-2: #2c4a82; --on-brand: #ffffff;
  --low: #b3261e; --low-bg: #fdecea; --warn: #8a5a00; --warn-bg: #fff4d6;
  --ok: #1d6b3a; --ok-bg: #e5f4ea; --pick: #1f3561; --pick-bg: #e8eef9;
  --r: 14px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font: 17px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding-bottom: 96px; }
button { font: inherit; color: inherit; }
.wrap { max-width: 640px; margin: 0 auto; padding: 0 16px; }
.head { background: linear-gradient(160deg, var(--brand), var(--brand-2)); color: var(--on-brand); border-radius: 0 0 20px 20px; padding: 18px 16px 16px; }
.head .wrap { padding: 0; }
.eyebrow { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.head h1 { margin: 2px 0 10px; font-size: 24px; line-height: 1.15; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: rgba(255,255,255,.12); border-radius: 12px; padding: 8px 10px; }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; opacity: .9; }
.note { font-size: 14px; color: var(--muted); margin: 12px 0 4px; }
.how { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 12px 0; font-size: 15px; }
.how ol { margin: 4px 0 0; padding-left: 20px; }
.tabs { display: flex; gap: 6px; margin: 12px 0 8px; }
.tab { flex: 1; min-height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; font-weight: 600; font-size: 15px; }
.tab[aria-selected="true"] { background: var(--brand); color: #fff; border-color: var(--brand); }
.tools { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
.search { flex: 1; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; font: inherit; font-size: 16px; background: var(--card); }
.chip { min-height: 44px; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 0 12px; font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--low-bg); border-color: var(--low); color: var(--low); font-weight: 600; }
.grp { margin: 18px 2px 6px; font-size: 13px; font-weight: 700; letter-spacing: .05em; color: var(--muted); text-transform: uppercase; }
.art { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 8px; overflow: hidden; }
.art.picked { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand) inset; }
.ah { width: 100%; text-align: left; background: none; border: 0; padding: 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; cursor: pointer; min-height: 56px; }
.ah .code { font-weight: 700; font-size: 17px; }
.ah .name { grid-column: 1; font-size: 13px; color: var(--muted); }
.ah .side { grid-row: 1 / span 2; grid-column: 2; text-align: right; font-size: 13px; color: var(--muted); align-self: center; }
.ah .side b { color: var(--ink); font-size: 15px; }
.tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.tag { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.tag.low { background: var(--low-bg); color: var(--low); }
.tag.pk { background: var(--pick-bg); color: var(--pick); }
.body { display: none; padding: 0 12px 12px; }
.art.open .body { display: block; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font-size: 12px; color: var(--muted); font-weight: 600; text-align: center; padding: 6px 2px; border-bottom: 1px solid var(--line); }
th:first-child, td:first-child { text-align: left; }
td { text-align: center; padding: 6px 2px; border-bottom: 1px solid #f0ede7; font-size: 16px; }
td.s { font-weight: 700; }
td.low { color: var(--low); font-weight: 800; }
td.dim { color: #b5b1a8; }
tr.over td { background: var(--warn-bg); }
.step { display: inline-flex; align-items: center; gap: 2px; }
.step button { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: #faf8f4; font-size: 20px; line-height: 1; }
.step button:disabled { opacity: .35; }
.step .n { min-width: 26px; text-align: center; font-weight: 800; }
.step .n.on { color: var(--pick); }
.sugg { margin-top: 10px; display: flex; gap: 8px; }
.sugg button { flex: 1; min-height: 44px; border-radius: 12px; border: 1px solid var(--brand); background: var(--pick-bg); color: var(--brand); font-weight: 600; font-size: 15px; }
.sugg button.clear { border-color: var(--line); background: #faf8f4; color: var(--muted); flex: 0 0 auto; padding: 0 14px; }
.legend { font-size: 13px; color: var(--muted); margin-top: 8px; }
.warnline { font-size: 13px; color: var(--warn); margin-top: 6px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(0,0,0,.06); }
.bar .wrap { display: flex; align-items: center; gap: 12px; padding: 0; }
.bar .sum { flex: 1; font-size: 14px; color: var(--muted); }
.bar .sum b { color: var(--ink); font-size: 18px; }
.primary { min-height: 48px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font-weight: 700; padding: 0 18px; font-size: 16px; }
.primary:disabled { background: #b9c1d3; }
.sheet { position: fixed; inset: 0; background: rgba(20,22,28,.45); display: none; align-items: flex-end; z-index: 10; }
.sheet.show { display: flex; }
.panel { background: var(--ground); width: 100%; max-height: 88vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.panel .wrap { padding: 0; }
.panel h2 { margin: 0 0 8px; font-size: 20px; }
.rev { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin-bottom: 8px; font-size: 15px; }
.rev .t { font-weight: 700; }
.rev .l { color: var(--muted); }
.totals { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; margin: 8px 0; font-size: 15px; }
.totals div { display: flex; justify-content: space-between; padding: 2px 0; }
.totals b { font-variant-numeric: tabular-nums; }
.actions { display: grid; gap: 8px; margin-top: 10px; }
.actions button { min-height: 50px; border-radius: 12px; font-size: 16px; font-weight: 700; }
.wa { background: #1f8f4e; color: #fff; border: 0; }
.sec { background: var(--card); border: 1px solid var(--line); }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; min-height: 44px; }
.msg { text-align: center; padding: 60px 20px; }
.msg h1 { font-size: 22px; }
.toast { position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%); background: #1b1d22; color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; }
</style>
</head>
<body>
<div id="app"><div class="msg"><h1>Sedang buka…</h1></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function () {
  'use strict';
  var app = document.getElementById('app');
  var DOC = null, PICK = {}, VIEW = { tab: 'mine', q: '', lowOnly: false, open: {} }, rendered = false;
  var STORE = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(n) { return Number(n || 0).toLocaleString('en-MY'); }
  function key(a) { return a.a + '-' + a.c; }
  function pk(a, s) { return a.a + '|' + a.c + '|' + s; }
  function toast(t) { var el = document.getElementById('toast'); el.textContent = t; el.classList.add('show'); setTimeout(function () { el.classList.remove('show'); }, 1800); }
  function when(s) { if (!s) return '-'; var d = new Date(s.replace(' ', 'T') + ':00+08:00'); if (isNaN(d)) return s; return d.toLocaleDateString('ms-MY', { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString('ms-MY', { hour: '2-digit', minute: '2-digit', hour12: false }); }

  function save() { try { localStorage.setItem(STORE, JSON.stringify(PICK)); } catch (e) {} }
  function load() {
    try { var p = JSON.parse(localStorage.getItem(STORE) || '{}'); if (p && typeof p === 'object') PICK = p; } catch (e) { PICK = {}; }
    // drop anything the warehouse no longer has
    var ok = {};
    DOC.arts.forEach(function (a) { a.sz.forEach(function (l) { var k = pk(a, l.s); if (PICK[k] > 0) ok[k] = Math.min(PICK[k], l.wh); }); });
    PICK = ok;
  }
  function picked(a) { var t = 0; a.sz.forEach(function (l) { t += PICK[pk(a, l.s)] || 0; }); return t; }
  function lowSizes(a) { return a.sz.filter(function (l) { return l.oh + l.so <= 1 && l.sold > 0 && l.wh > 0; }).length; }
  function sugTotal(a) { var t = 0; a.sz.forEach(function (l) { t += l.sug; }); return t; }
  function limit(l) { return Math.max(DOC.maxPerSize, l.sold); }
  function over(a, l) { return (l.oh + l.so + (PICK[pk(a, l.s)] || 0)) > limit(l); }
  function totals() {
    var pcs = 0, arts = 0, overN = 0;
    DOC.arts.forEach(function (a) { var p = picked(a); if (p) { pcs += p; arts++; } a.sz.forEach(function (l) { if ((PICK[pk(a, l.s)] || 0) > 0 && over(a, l)) overN++; }); });
    return { pcs: pcs, arts: arts, over: overN };
  }

  function artCard(a) {
    var p = picked(a), low = lowSizes(a), open = !!VIEW.open[key(a)];
    var h = '<div class="art' + (open ? ' open' : '') + (p ? ' picked' : '') + '" data-k="' + esc(key(a)) + '">';
    h += '<button class="ah" data-act="toggle" aria-expanded="' + open + '"><span class="code">' + esc(a.a) + '-' + esc(a.c) + (a.cn ? ' · ' + esc(a.cn) : '') + '</span>';
    h += '<span class="side">Outlet <b>' + fmt(a.oh + a.so) + '</b><br>Jual 3 bln <b>' + fmt(a.sold) + '</b></span>';
    h += '<span class="name">' + esc(a.n) + '</span><span class="tags">';
    if (low) h += '<span class="tag low">' + low + ' saiz tinggal 1 atau habis</span>';
    if (p) h += '<span class="tag pk">Pilih ' + p + ' pcs</span>';
    h += '</span></button>';
    if (open) {
      h += '<div class="body"><table><thead><tr><th>Saiz</th><th>WH</th><th>Outlet</th><th>Jual<br>3 bln</th><th>Ambil</th></tr></thead><tbody>';
      a.sz.forEach(function (l) {
        var n = PICK[pk(a, l.s)] || 0, stock = l.oh + l.so;
        h += '<tr class="' + (n && over(a, l) ? 'over' : '') + '"><td class="s">' + esc(l.s) + '</td>';
        h += '<td class="' + (l.wh ? '' : 'dim') + '">' + fmt(l.wh) + '</td>';
        h += '<td class="' + (stock <= 1 && l.sold > 0 ? 'low' : '') + '">' + fmt(stock) + (l.so ? '<br><small>(' + l.so + ' SO)</small>' : '') + '</td>';
        h += '<td class="' + (l.sold ? '' : 'dim') + '">' + fmt(l.sold) + '</td>';
        h += '<td><span class="step"><button data-act="minus" data-s="' + esc(l.s) + '" aria-label="Kurang saiz ' + esc(l.s) + '"' + (n ? '' : ' disabled') + '>−</button>';
        h += '<span class="n' + (n ? ' on' : '') + '">' + n + '</span>';
        h += '<button data-act="plus" data-s="' + esc(l.s) + '" aria-label="Tambah saiz ' + esc(l.s) + '"' + (n < l.wh ? '' : ' disabled') + '>+</button></span></td></tr>';
      });
      h += '</tbody></table>';
      var ov = a.sz.filter(function (l) { return (PICK[pk(a, l.s)] || 0) > 0 && over(a, l); });
      if (ov.length) h += '<div class="warnline">⚠ Saiz ' + ov.map(function (l) { return esc(l.s); }).join(', ') + ': stok outlet akan lebih dari ' + DOC.maxPerSize + ' pcs dan lebih dari jualan 3 bulan. Pastikan betul-betul perlu.</div>';
      var sg = sugTotal(a);
      h += '<div class="sugg">' + (sg ? '<button data-act="suggest">Isi cadangan (+' + sg + ' pcs)</button>' : '') + (p ? '<button class="clear" data-act="clear">Kosongkan</button>' : '') + '</div>';
      h += '<div class="legend">WH = stok Ecomm WH boleh ambil. Outlet = stok kaunter + barang dalam perjalanan.' + (sg ? ' Cadangan = cukup untuk jualan 3 bulan, maks ' + DOC.maxPerSize + ' pcs sesaiz.' : '') + '</div>';
      h += '</div>';
    }
    return h + '</div>';
  }

  function filtered() {
    var q = VIEW.q.trim().toLowerCase();
    return DOC.arts.filter(function (a) {
      if (VIEW.tab === 'mine' ? !a.mine : a.mine) return false;
      if (VIEW.lowOnly && !lowSizes(a)) return false;
      if (q && (a.a + '-' + a.c + ' ' + a.cn + ' ' + a.n + ' ' + a.g).toLowerCase().indexOf(q) < 0) return false;
      return true;
    });
  }

  function renderList() {
    var list = filtered(), h = '', g = null;
    if (VIEW.tab === 'other') list = list.slice().sort(function (x, y) { return x.g < y.g ? -1 : x.g > y.g ? 1 : (x.a + x.c < y.a + y.c ? -1 : 1); });
    list.forEach(function (a) {
      if (VIEW.tab === 'other' && a.g !== g) { g = a.g; h += '<div class="grp">' + esc(g) + '</div>'; }
      h += artCard(a);
    });
    if (!list.length) h = '<div class="empty">Tiada barang untuk carian ini.</div>';
    document.getElementById('list').innerHTML = h;
    renderBar();
  }

  function renderBar() {
    var t = totals();
    document.getElementById('sum').innerHTML = '<b>' + fmt(t.pcs) + ' pcs</b> dipilih · ' + t.arts + ' item<br>Outlet ' + fmt(DOC.counter.brand) + ' → <b style="font-size:15px">' + fmt(DOC.counter.brand + t.pcs) + '</b> pcs';
    document.getElementById('go').disabled = !t.pcs;
    document.getElementById('st-pick').textContent = fmt(t.pcs);
  }

  function renderAll() {
    STORE = 'topup:' + DOC.outlet;
    load();
    var mine = DOC.arts.filter(function (a) { return a.mine; }).length, other = DOC.arts.length - mine;
    var h = '<header class="head"><div class="wrap"><div class="eyebrow">Top-up stok dari Ecomm WH (' + esc(DOC.origin) + ')</div>';
    h += '<h1>' + esc(DOC.outlet) + '</h1><div class="stats">';
    h += '<div class="stat"><b>' + fmt(DOC.counter.brand) + '</b><span>Stok kaunter sekarang (pcs)</span></div>';
    h += '<div class="stat"><b id="st-pick">0</b><span>Dipilih untuk top-up (pcs)</span></div></div></div></header>';
    h += '<main class="wrap">';
    h += '<div class="how"><b>Cara guna</b><ol><li>Buka item, tekan <b>+</b> pada saiz yang perlu ditambah.</li><li>Tengok lajur <b>Outlet</b> dulu — jangan ambil saiz yang masih banyak.</li><li>Tekan <b>Semak &amp; hantar</b>. Senarai keluar untuk WhatsApp dan untuk buat SO.</li></ol></div>';
    h += '<div class="tabs" role="tablist"><button class="tab" role="tab" data-tab="mine" aria-selected="' + (VIEW.tab === 'mine') + '">Barang outlet (' + mine + ')</button><button class="tab" role="tab" data-tab="other" aria-selected="' + (VIEW.tab === 'other') + '">Barang lain di WH (' + other + ')</button></div>';
    h += '<div class="tools"><input class="search" id="q" type="search" placeholder="Cari kod / nama / warna" value="' + esc(VIEW.q) + '" aria-label="Cari"><button class="chip" id="low" aria-pressed="' + VIEW.lowOnly + '">Stok rendah</button></div>';
    h += '<div id="list"></div>';
    h += '<p class="note">Data: stok WH ' + esc(when(DOC.asOf.wh)) + ' · stok outlet ' + esc(when(DOC.asOf.outlet)) + ' · jualan ' + esc(DOC.salesMonths.join('–')) + '. Stok WH berubah setiap hari.</p>';
    h += '</main>';
    h += '<div class="bar"><div class="wrap"><div class="sum" id="sum"></div><button class="primary" id="go">Semak &amp; hantar</button></div></div>';
    h += '<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="rv-h"><div class="panel"><div class="wrap" id="rv"></div></div></div>';
    app.innerHTML = h;
    rendered = true;
    renderList();
  }

  function waText() {
    var t = totals(), lines = [];
    lines.push('*TOP-UP ' + DOC.outlet + '* dari ' + DOC.origin);
    DOC.arts.forEach(function (a) {
      var parts = [];
      a.sz.forEach(function (l) { var n = PICK[pk(a, l.s)] || 0; if (n) parts.push(l.s + ' x' + n); });
      if (parts.length) lines.push(a.a + '-' + a.c + (a.cn ? ' ' + a.cn : '') + ': ' + parts.join(', '));
    });
    lines.push('Jumlah: ' + t.pcs + ' pcs (' + t.arts + ' item)');
    lines.push('Stok outlet: ' + DOC.counter.brand + ' -> ' + (DOC.counter.brand + t.pcs) + ' pcs');
    return lines.join('\n');
  }

  function openReview() {
    var t = totals(), h = '<h2 id="rv-h">Semak top-up</h2>';
    DOC.arts.forEach(function (a) {
      var parts = [];
      a.sz.forEach(function (l) { var n = PICK[pk(a, l.s)] || 0; if (n) parts.push('<span' + (over(a, l) ? ' style="color:var(--warn);font-weight:700"' : '') + '>' + esc(l.s) + ' ×' + n + '</span>'); });
      if (parts.length) h += '<div class="rev"><div class="t">' + esc(a.a) + '-' + esc(a.c) + (a.cn ? ' · ' + esc(a.cn) : '') + ' <span class="l">(' + picked(a) + ' pcs)</span></div><div>' + parts.join(', ') + '</div></div>';
    });
    h += '<div class="totals"><div><span>Jumlah dipilih</span><b>' + fmt(t.pcs) + ' pcs</b></div><div><span>Stok kaunter sekarang</span><b>' + fmt(DOC.counter.brand) + ' pcs</b></div><div><span>Selepas top-up</span><b>' + fmt(DOC.counter.brand + t.pcs) + ' pcs</b></div></div>';
    if (t.over) h += '<div class="warnline">⚠ ' + t.over + ' saiz akan jadi lebih dari ' + DOC.maxPerSize + ' pcs dan lebih dari jualan 3 bulan (warna kuning). Kurangkan kalau tak perlu.</div>';
    h += '<div class="actions"><button class="wa" data-act="wa">Hantar ke WhatsApp</button><button class="sec" data-act="copy">Salin senarai</button><button class="link" data-act="close">Tutup, sambung pilih</button><button class="link" data-act="reset">Kosongkan semua</button></div>';
    document.getElementById('rv').innerHTML = h;
    document.getElementById('sheet').classList.add('show');
  }
  function closeReview() { document.getElementById('sheet').classList.remove('show'); }

  function findArt(k) { for (var i = 0; i < DOC.arts.length; i++) if (key(DOC.arts[i]) === k) return DOC.arts[i]; return null; }
  function rerenderCard(a) {
    var el = document.querySelector('.art[data-k="' + CSS.escape(key(a)) + '"]');
    if (el) el.outerHTML = artCard(a);
    renderBar();
  }

  app.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.tab) { VIEW.tab = b.dataset.tab; document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', t.dataset.tab === VIEW.tab); }); renderList(); window.scrollTo({ top: document.getElementById('list').offsetTop - 120 }); return; }
    if (b.id === 'low') { VIEW.lowOnly = !VIEW.lowOnly; b.setAttribute('aria-pressed', VIEW.lowOnly); renderList(); return; }
    if (b.id === 'go') { openReview(); return; }
    var act = b.dataset.act;
    if (act === 'wa') { window.location.href = 'https://wa.me/?text=' + encodeURIComponent(waText()); return; }
    if (act === 'copy') {
      var txt = waText();
      (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(function () { toast('Senarai disalin'); }, function () {
        var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Senarai disalin'); } catch (x) {} ta.remove();
      });
      return;
    }
    if (act === 'close') { closeReview(); return; }
    if (act === 'reset') { if (confirm('Kosongkan semua pilihan?')) { PICK = {}; save(); closeReview(); renderList(); } return; }
    var card = b.closest('.art'); if (!card) return;
    var a = findArt(card.dataset.k); if (!a) return;
    if (act === 'toggle') { VIEW.open[key(a)] = !VIEW.open[key(a)]; rerenderCard(a); return; }
    if (act === 'plus' || act === 'minus') {
      var l = a.sz.filter(function (x) { return x.s === b.dataset.s; })[0], k = pk(a, l.s), n = PICK[k] || 0;
      n = act === 'plus' ? Math.min(l.wh, n + 1) : Math.max(0, n - 1);
      if (n) PICK[k] = n; else delete PICK[k];
      save(); rerenderCard(a); return;
    }
    if (act === 'suggest') { a.sz.forEach(function (l) { if (l.sug > 0) PICK[pk(a, l.s)] = Math.min(l.wh, l.sug); }); save(); rerenderCard(a); toast('Cadangan diisi — semak dulu'); return; }
    if (act === 'clear') { a.sz.forEach(function (l) { delete PICK[pk(a, l.s)]; }); save(); rerenderCard(a); return; }
  });
  document.addEventListener('click', function (e) { if (e.target.id === 'sheet') closeReview(); });
  app.addEventListener('input', function (e) { if (e.target.id === 'q') { VIEW.q = e.target.value; renderList(); } });

  function showInvalid() { rendered = true; app.innerHTML = '<div class="msg"><h1>Link tidak sah.</h1><p>Minta link baru dari HQ.</p></div>'; }
  function showOffline() { rendered = true; app.innerHTML = '<div class="msg"><h1>Tak dapat buka.</h1><p>Semak internet, kemudian buka semula link.</p></div>'; }

  /* ---------- Crypto (same contract as push_board.py / index.html / so.html) ---------- */
  function readKey() { var h = (location.hash || '').replace(/^#/, '').trim(); if (!h) return null; if (/^[0-9a-fA-F]{64}$/.test(h)) return h.toLowerCase(); return false; }
  function hexToBytes(hex) { var out = new Uint8Array(hex.length / 2); for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16); return out; }
  function b64ToBytes(b64) { var bin = atob(String(b64).replace(/-/g, '+').replace(/_/g, '/')); var out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  function docIdFor(keyHex) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(keyHex)).then(function (buf) {
      var b = new Uint8Array(buf), s = ''; for (var i = 0; i < 8; i++) s += (b[i] < 16 ? '0' : '') + b[i].toString(16); return s;
    });
  }
  function importKey(keyHex) { return crypto.subtle.importKey('raw', hexToBytes(keyHex), { name: 'AES-GCM' }, false, ['decrypt']); }
  function decryptDoc(cryptoKey, doc) {
    if (!doc || typeof doc.iv !== 'string' || typeof doc.ct !== 'string') return Promise.reject(new Error('bad doc'));
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(doc.iv), tagLength: 128 }, cryptoKey, b64ToBytes(doc.ct)).then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function boot() {
    if (!window.crypto || !crypto.subtle) { showOffline(); return; }
    var k = readKey();
    if (k === null || k === false) { showInvalid(); return; }
    Promise.all([docIdFor(k), importKey(k)]).then(function (r) {
      return fetch('t/' + r[0] + '.json', { cache: 'no-store' }).then(function (res) {
        if (res.status === 404) { showInvalid(); return; }
        if (!res.ok) throw new Error('http ' + res.status);
        return res.json().then(function (doc) { return decryptDoc(r[1], doc).then(function (d) { DOC = d; renderAll(); }, showInvalid); });
      });
    }).catch(function () { if (!rendered) showOffline(); });
  }
  window.addEventListener('hashchange', function () { location.reload(); });
  boot();
})();
</script>
