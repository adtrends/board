<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Conso Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#f5f7f8;--card:#fff;--soft:#eef2f4;--line:#e0e6ea;--ink:#16202b;--muted:#66737f;
 --accent:#0f6d7d;--accent-s:#dcecef;--good:#1c7a4c;--good-s:#e2f2e9;--warn:#8f6200;--warn-s:#fbf1da;
 --bad:#ad2e22;--bad-s:#fae4e1;--on:#fff;--shadow:0 1px 2px rgba(17,28,39,.06),0 8px 24px rgba(17,28,39,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1317;--card:#151e25;
 --soft:#1b262e;--line:#27343d;--ink:#e4eaee;--muted:#93a1ac;--accent:#57c3d2;--accent-s:#12333b;
 --good:#5cc38d;--good-s:#12301f;--warn:#e2b45c;--warn-s:#332715;--bad:#f0897c;--bad-s:#38201d;--on:#0d1317;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0d1317;--card:#151e25;--soft:#1b262e;--line:#27343d;--ink:#e4eaee;
 --muted:#93a1ac;--accent:#57c3d2;--accent-s:#12333b;--good:#5cc38d;--good-s:#12301f;--warn:#e2b45c;
 --warn-s:#332715;--bad:#f0897c;--bad-s:#38201d;--on:#0d1317;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:none;margin:0 auto;padding:18px 20px 24px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.mono{font-family:"IBM Plex Mono",monospace}
.tabs{display:flex;gap:6px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:9px 12px;
 border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font-size:11px;background:var(--soft);border-radius:999px;padding:1px 7px;margin-left:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600}
.fact span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.seg{display:flex;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
 padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input[type=search],input[type=month],select{border:1px solid var(--line);background:var(--card);color:var(--ink);
 border-radius:10px;padding:7px 10px;font:inherit;font-size:13px}
input[type=search]{flex:1;min-width:180px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 10px;
 background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.filters label{display:flex;flex-direction:column;gap:3px}
.filters .row2{display:flex;gap:6px}
.filters .row2 input{flex:1;min-width:0}
.filters[hidden]{display:none!important}   /* nothing above the table: the header drives these */
.filters .hdrf{display:none}
.filters .hdrf label{display:flex;flex-direction:column;gap:3px}
.filters .moref{grid-column:1/-1}
.filters .moref>summary{cursor:pointer;font-size:13px;font-weight:600;padding:4px 0}
.filters .mf{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 10px;margin-top:6px}
.filters .mf label{display:flex;flex-direction:column;gap:3px}
.filters .fhint{grid-column:1/-1;margin:0;font-size:12px;color:var(--muted)}
.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:6px;font-size:13px}
button.act{border:1px solid var(--accent);background:var(--accent);color:var(--on);font:inherit;font-weight:600;
 font-size:13px;padding:7px 14px;border-radius:9px;cursor:pointer}
button.themesw{float:right;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;margin:4px 0 0 10px;cursor:pointer}
a.langsw{float:right;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:14px;padding:6px 14px;border-radius:999px;text-decoration:none;margin:4px 0 0 10px}
button.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12.5px;
 font-weight:600;padding:6px 11px;border-radius:9px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:is(button,input,select,summary):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{overflow:auto;border-radius:12px;border:1px solid var(--line);background:var(--card)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:right;white-space:nowrap}
th{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;
 position:sticky;top:0;background:var(--card);z-index:1;user-select:none}
th.s{cursor:pointer}
th.sorted{color:var(--accent)}
.l{text-align:left}
td.o b{font-family:"IBM Plex Mono",monospace}
td.o span{display:block;color:var(--muted);font-size:10.5px;white-space:normal;max-width:300px}
tr:last-child td{border-bottom:none}
tr.on{background:var(--accent-s)}
tr.alloc>td{background:var(--bg);padding:6px 0 14px!important;white-space:normal;border-bottom:2px solid var(--accent)}
tr.alloc>td{text-align:left}
tr.alloc .panel{padding:0 4px;position:sticky;left:0;max-width:min(calc(100vw - 40px),1200px);box-sizing:border-box}
button.opn{border:1px solid var(--accent);background:var(--card);color:var(--accent);font:inherit;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;cursor:pointer;margin-top:6px}
.chip{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--soft);
 color:var(--muted);margin:3px 4px 0 0}
.kind{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.k-move{background:var(--good-s);color:var(--good)}
.k-conc{background:var(--warn-s);color:var(--warn)}
.k-clear{background:var(--bad-s);color:var(--bad)}
.k-new{background:var(--accent-s);color:var(--accent)}
.disc{color:var(--bad);font-weight:600}
.muted{color:var(--muted)}
.tick{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.more{margin:10px 0;text-align:center}
.dock{position:static;margin:14px 0 0;
 background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:12px;
 align-items:center;justify-content:space-between;box-shadow:var(--shadow);z-index:5}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.legend{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12.5px;
 line-height:1.6;margin-bottom:12px}
/* desk */
details.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.item>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;justify-content:space-between;
 gap:10px;align-items:center;flex-wrap:wrap}
details.item>summary::-webkit-details-marker{display:none}
.code{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px}
.nm{color:var(--muted);font-size:12px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:4px}
.tag.rec{background:var(--good-s);color:var(--good)}
.panel{padding:0 14px 14px}
.colhead{font-weight:600;margin:12px 0 6px;font-size:13px}
.colhead span{font-weight:400;color:var(--muted);font-size:12px}
td.sz{min-width:34px;text-align:center}
td.sz.gap{color:var(--muted)}
td.sz.fill{background:var(--good-s);color:var(--good);font-weight:700}
td.sz.take{color:var(--bad);font-weight:600}
th.sz{text-align:center}
th.dead{opacity:.5}
tr.get{background:var(--good-s)}
tr.give{background:var(--warn-s)}
.pick{display:flex;gap:4px;justify-content:flex-end}
.pick button{border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:11px;
 font-weight:700;padding:4px 8px;border-radius:7px;cursor:pointer}
.pick button[data-role="r"][aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--on)}
.pick button[data-role="g"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--on)}
.pick button[data-role="x"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--on)}
td.left.chg{font-weight:700}
td.left.zero{color:var(--bad);font-weight:700}
.warn{background:var(--bad-s);color:var(--bad);border-radius:8px;padding:6px 10px;font-size:12px;margin:0 0 6px}
.plan{margin-top:10px}
.fresh{font-size:12px;color:var(--muted);margin:-8px 0 12px}
.fresh.warn{margin-top:-6px}
.colcap{margin:4px 0 8px}
.colcap .seg button{min-width:38px}
.plan h4{margin:6px 0;font-size:13px}
.empty{color:var(--muted);padding:14px}
.status{font-size:12px;color:var(--muted)}
.olist h2{font-size:18px;margin:18px 0 2px}
table.grid th,table.grid td{padding:4px 5px;font-size:11.5px;text-align:center}
table.grid th{font-size:9px;line-height:1.2;text-transform:none;letter-spacing:0}
table.grid td.l,table.grid th.l{text-align:left}
table.grid tr.sub td{background:var(--soft);font-weight:600}
table.grid tr.gt td{border-top:2px solid var(--ink);font-weight:700}
table.grid .tk{width:22px}
td.pt b,td.yr b{font-size:14px}
.pgy{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}
.pgy span{display:inline-block!important;font-size:13px!important;font-weight:700;padding:2px 9px;border-radius:6px;color:var(--ink)!important}
.pgy .pg{background:var(--accent-s)}.pgy .yr{background:var(--warn-s)}
div.artbar{margin:6px 0 4px}
/* Tze, 20 Oct 2026: "freeze the top column and compact the width ... the left columns took up too much space".
   No scroll box around the table, so the titles + filter row stick to the top of the screen while the page scrolls;
   tight padding, small filters, and the product type column carries only its filter (the table heading names it). */
table.work th,table.work td{padding:2px 4px;font-size:11.5px;white-space:nowrap}
#grid .gscroll{max-height:none;overflow:visible}
table.work thead{position:sticky;top:0;z-index:3;box-shadow:0 2px 0 var(--line)}
table.work thead th{position:static;background:var(--card)}
table.work td.meta{max-width:74px;overflow:hidden;text-overflow:ellipsis;font-size:10px;color:var(--muted)}
table.work td.grp{font-size:0;padding:0;max-width:0}
table.work input.hq{font:inherit;font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);width:66px;min-width:0}
:root[data-layout="phone"] table.work input.hq{font-size:16px;padding:5px 6px;width:84px}
/* phone: product type is already the table's own heading - keep its filter, drop the repeated name, slim the left columns */
:root[data-layout="phone"] table.work td.grp{font-size:0;max-width:0;padding:0}
:root[data-layout="phone"] table.work tr.flt>:nth-child(1) select{max-width:86px}
:root[data-layout="phone"] table.work tr.flt>:nth-child(2) select{max-width:66px}
table.work thead tr.hbar th{text-align:left;padding:5px 6px;background:var(--soft);border-bottom:1px solid var(--line)}
table.work .hb{position:sticky;left:6px;display:inline-flex;flex-wrap:wrap;gap:6px 12px;align-items:center;max-width:calc(100vw - 48px)}
table.work .hb label{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;font-weight:600}
table.work thead tr.flt th{padding:2px 4px;border-bottom:2px solid var(--line)}
table.work select.hf{font:inherit;font-size:11px;text-transform:none;letter-spacing:0;padding:2px 4px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:84px}
table.work td.io{text-align:center;font-size:12px}
table.work td.al{white-space:normal;min-width:90px;max-width:170px;font-size:11px;line-height:1.25}
table.work tr.flt>:nth-child(1) select{max-width:64px}table.work tr.flt>:nth-child(2) select{max-width:52px}
table.work tr.flt>:nth-child(4) select{max-width:54px}table.work tr.flt>:nth-child(6) select{max-width:96px}table.work .inq{color:var(--good)}table.work .outq{color:var(--bad)}
table.work td.dsc{max-width:170px;overflow:hidden;text-overflow:ellipsis;font-size:11px;color:var(--muted)}
table.work td.o{font-family:ui-monospace,Consolas,monospace;font-size:11.5px}
table.work td.o.get{background:var(--good-s);color:var(--good);font-weight:700}
table.work td.o.give{background:var(--warn-s);color:var(--warn);font-weight:700}
table.work tr.ctot td{border-top:2px solid var(--line)}table.work tr.ctot.afirst td{border-top:3px solid var(--ink)}
table.work tr.on td.yr,table.work tr.on td.mono b{color:var(--accent)}
table.work tr.ctot td{background:var(--soft);font-weight:700}
table.work tr.sgrow td{font-size:11px;color:var(--muted)}
table.work td.sz.fill{color:var(--good);font-weight:700}table.work td.sz.take{color:var(--bad);font-weight:700}
table.work td.pk button{font:inherit;font-size:10px;font-weight:700;padding:2px 3px;margin-right:1px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:6px;cursor:pointer}
table.work td.pk button[data-role="r"][aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--on)}
table.work td.pk button[data-role="g"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:var(--on)}
table.work td.pk button[data-role="x"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:var(--on)}
table.work td.pk button[data-role="o"][aria-pressed="true"]{background:#7a4fb5;border-color:#7a4fb5;color:#fff}
table.work td.al select.dst{display:block;width:100%;font:inherit;font-size:10.5px;padding:1px 3px;margin:0 0 2px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:150px}
table.work td.al select.dst.need{border-color:var(--bad);color:var(--bad)}
details.mdd{display:inline-block;margin:0 2px 2px;vertical-align:middle}
details.mdd>summary{list-style:none;cursor:pointer;font-size:10.5px;padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.mdd>summary::-webkit-details-marker{display:none}
details.mdd.need>summary{border-color:var(--bad);color:var(--bad)}
details.mdd .mddp{position:fixed;z-index:60;width:320px;max-height:320px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;box-shadow:0 6px 24px rgba(0,0,0,.35);text-align:left;white-space:normal}
details.mdd .mddp label{display:block;font-size:12px;padding:3px 0;cursor:pointer;white-space:nowrap}
details.mdd .mddg{font-size:11px;color:var(--muted);margin:6px 0 2px;font-weight:600}
details.mdd .mddf{position:sticky;bottom:-6px;background:var(--card);padding:6px 0 2px;text-align:right}
details.mdd .mddf span{display:inline-block;padding:3px 12px;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer;font-size:12px}
table.work small.even{display:inline-block;font-size:10.5px;color:var(--muted);margin:0 4px}
table.work td.pk button[data-role="w"][aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
table.work td.pk button[data-role="s"][aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on)}
table.work td.pk button[data-role="d"][aria-pressed="true"]{background:#0f8b8d;border-color:#0f8b8d;color:#fff}
table.work button.rem{border:0;background:none;color:var(--muted);font-size:11px;padding:0 3px;margin-left:4px;cursor:pointer;min-height:0;min-width:0}
table.work button.rem.on{background:#ffe08a;color:#5a3d00;border-radius:4px;font-weight:700}
table.work tr.remrow td{background:#fff6d6;color:#5a3d00;font-size:12px;text-align:left;white-space:normal;padding:3px 8px}
table.work tr.remrow span{margin-right:14px}
table.work td.pk{white-space:nowrap}
table.work td.pk select.dst{font:inherit;font-size:10.5px;padding:1px 3px;margin-left:2px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:150px}
table.work td.pk select.dst.need{border-color:var(--bad);color:var(--bad)}
table.work .capc{margin-right:3px;font-weight:600;color:var(--muted)}table.work .capc b{display:inline-block;min-width:14px;text-align:center;color:var(--ink)}
table.work .capc.own b{color:var(--accent)}
table.work .warnt{color:var(--bad);font-weight:700}
tr.sgrow td{background:var(--soft);border-top:2px dashed var(--line)}
table.byart td.o{font-family:ui-monospace,Consolas,monospace;font-size:11px;white-space:nowrap}
table.byart td.o.get{background:var(--good-s);color:var(--good);font-weight:700}
table.byart td.o.give{background:var(--warn-s);color:var(--warn);font-weight:700}
table.byart tr.ctot td{background:var(--soft);font-weight:700}
table.byart tr.cfirst td{border-top:2px solid var(--line)}
table.byart td.al{text-align:left;white-space:nowrap;font-size:11px}
table.byart td.al .to{color:var(--warn)}table.byart td.al .from{color:var(--good)}
.ao{font-size:11px;font-weight:700;color:var(--bad)}
table.bycol tr.bcnow td{border-top:2px solid var(--ink);background:var(--soft)}
table.bycol tr.bcleft td{font-style:italic;color:var(--muted)}
table.bycol tr.bcto td{color:#16202b}
p.bckey span{display:inline-block;padding:2px 8px;margin:2px 4px 2px 0;border:1px solid var(--line);border-radius:4px;font-size:11px}
@media print{table.bycol tr,p.bckey span{-webkit-print-color-adjust:exact;print-color-adjust:exact}table.bycol tr.bcnow td{border-top:1.5px solid #000}}
details.recvd{margin-top:10px}
details.recvd summary{cursor:pointer;font-weight:600;font-size:13px;margin-bottom:6px}
.olist h3{font-size:14px;margin:14px 0 6px}
.olist h3.recv{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
.olist h4{font-size:13px;margin:10px 0 6px}
.olist h4.sgrp{margin:14px 0 4px;font-size:13px}
.sumt tr.ohead td{background:var(--soft);font-size:13px}
.sumt .up{color:var(--good);font-size:10px}
.sumt .down{color:var(--bad);font-size:10px}
.swatch{padding:0 5px;border-radius:4px}
.swatch.bad{background:color-mix(in srgb,var(--bad) 40%,transparent)}
.swatch.acc{background:color-mix(in srgb,var(--accent) 40%,transparent)}
@media print{
  :root,:root[data-theme]{--bg:#fff;--card:#fff;--soft:#eef2f4;--line:#e0e6ea;--ink:#16202b;--muted:#66737f;
   --accent:#0f6d7d;--accent-s:#dcecef;--good:#1c7a4c;--good-s:#e2f2e9;--warn:#8f6200;--warn-s:#fbf1da;
   --bad:#ad2e22;--bad-s:#fae4e1;--on:#fff}  /* transfer lists always print light */
  body{background:#fff;color:#000}
  .noprint,.dock,.facts,.legend,p.sub,h1,#winNote,.bar,.tabs,#choose,#summary{display:none!important}
  .wrap{padding:0;max-width:none}
  .scroll{overflow:visible;border:0}
  .olist{break-after:page}
  .olist:last-child{break-after:auto}
  th{position:static}
  td,th{font-size:11px;padding:4px 6px}
  @page{size:A4 portrait;margin:10mm}

/* ---------- desk: roles, suggestion, allocation ---------- */
function rk(a,c,o){return a+"|"+c+"|"+o;}
function sizesOf(a,c){var set={};c.rows.forEach(function(r){for(var k in r.q)set[k]=1;});

function liveSizes(a,c){return sizesOf(a,c).filter(function(s){return c.rows.some(function(r){return r.q[s];});});}

    if(short&&(cv===null||cv<=MAX_COVER))return "r";}

var AUTO=false, SUGG=new Set();
var SUG_TXT={on:"Suggestions: ON for all articles",off:"Suggestions: OFF - you pick",all:"Suggest for all",clearAll:"Clear all picks",
  one:"Suggest for this article",clearOne:"Clear this article",confAll:"Replace your GET/GIVE picks with suggestions for every ticked article?",
  confClear:"Clear every GET / GIVE / ALL OUT pick on every article?"};

/* Roles: r = GET, g = GIVE (only what receivers need, up to CAP a size), x = ALL OUT (the door
   sends every piece of the art-colour - promoters often want nothing left behind). */
var UNPLACED={};                                 // "art|col" -> pcs an ALL OUT door could not place
/* Tze, 20 Oct 2026: "add 2 more actions for each art col outlet, one is to return to WH, the other is to repeat from SG".
   w = TO WH: the door sends what the GET doors still need first (stock stays in the area), every piece left goes back
       to the warehouse WH_CODE - nothing stays at the door.
   s = FROM SG: the door is a receiver like GET (area stock first), then each size is topped up to the pcs-per-size
       from SG online stock (SG_CODE), best-selling door first, never more than SG holds of that size.
   Codes from iDCP transfers: every AD and BF door returns to ADCEWHTR-O; SG repeats ship from ADECOMM. */
var WH_CODE="ADCEWHTR-O", SG_CODE="ADECOMM";
function allocate(a){
  var moves=[];
  function add(from,to,c,z,q){q=q||1;var m=moves.find(function(x){return x.from===from&&x.to===to&&x.c===c&&x.z===z;});
    if(m)m.q+=q;else moves.push({a:a.a,c:c,from:from,to:to,z:z,q:q});}
  a.cols.forEach(function(c){
    var role={};c.rows.forEach(function(r){role[r.o]=roleOf(a,c,r);});
    var give=c.rows.filter(function(r){return role[r.o]==="g"||role[r.o]==="x"||role[r.o]==="w"||role[r.o]==="o";});
    var allOut=c.rows.filter(function(r){return role[r.o]==="x";}), ret=c.rows.filter(function(r){return role[r.o]==="w";}),
        oth=c.rows.filter(function(r){return role[r.o]==="o";});
    var get=c.rows.filter(function(r){return role[r.o]==="r"||role[r.o]==="s";}).sort(function(x,y){return rowSold(y)-rowSold(x);});
    var sgReq=get.filter(function(r){return role[r.o]==="s";});

    /* Tze, 29 Oct 2026: "distribute best selling outlet first 1 size and move on to next" - filled level by level:

          if(!best)return;

        }
      }
    });
    /* pass 1b - SPREAD. Tze, 29 Oct 2026: "another option to redistribute the stock among the selected outlets" and
       "it has to work together with the other buttons, so if an outlet wants out, it has to take stock from that outlet too".
       Pool = the SPREAD doors' own stock + whatever ALL OUT doors still hold after the GET doors are filled. Dealt size
       by size: 1 to each SPREAD door, best seller first, round after round, until the size runs out - even shares,
       the odd pieces stay where they already are when they can (fewest pieces moved), else go to the best sellers.
       Tze, 29 Oct 2026: "you will try to use the least transfer method right?" - only surplus moves, and a receiver
       takes from a door already sending it another size before a new From -> To pair is opened (fewest ITs).
       Supply = demand, so every ALL OUT door still ends at zero. */
    if(spr.length>1||(spr.length&&allOut.length))sizesOf(a,c).forEach(function(z){
      var src=allOut.map(function(g){return {o:g.o,n:pool[g.o][z]||0,x:1};}).filter(function(s){return s.n>0;});
      var left=spr.reduce(function(t,r){return t+(r.q[z]||0);},0)+src.reduce(function(t,s){return t+s.n;},0),tgt={};if(!left)return;
      var share=Math.floor(left/spr.length), odd=left-share*spr.length;
      spr.forEach(function(r){tgt[r.o]=share;});
      spr.filter(function(r){return (r.q[z]||0)>share;}).concat(spr.filter(function(r){return (r.q[z]||0)<=share;}))
        .slice(0,odd).forEach(function(r){tgt[r.o]++;});
      spr.forEach(function(r){if((r.q[z]||0)>tgt[r.o])src.push({o:r.o,n:(r.q[z]||0)-tgt[r.o],x:0});});
      spr.forEach(function(r){for(var need=tgt[r.o]-(r.q[z]||0);need>0;need--){
        var pair=function(v){return moves.some(function(m){return m.c===c.c&&m.from===v.o&&m.to===r.o;})?1:0;};
        var s=src.filter(function(v){return v.n>0;}).sort(function(p,q){return pair(q)-pair(p)||q.x-p.x||q.n-p.n;})[0];if(!s)return;
        s.n--;if(s.x){pool[s.o][z]--;recv(r,z);}add(s.o,r.o,c.c,z);}});

    // holding the least of that size (best seller first on a tie) - the cap no longer applies

    allOut.forEach(function(g){Object.keys(pool[g.o]).forEach(function(z){
      var tg=get.filter(function(r){return r.o!==g.o;});
      while((pool[g.o][z]||0)>0){
        if(!tg.length){unplaced+=pool[g.o][z];break;}
        var r=tg.slice().sort(function(x,y){return have(x,z)-have(y,z)||rowSold(y)-rowSold(x);})[0];
        take(g.o,r,z);

    });});
    if(unplaced)UNPLACED[key]=unplaced;
    // pass 3: TO WH doors send every piece still left back to the warehouse
    ret.forEach(function(g){Object.keys(pool[g.o]).forEach(function(z){var n=pool[g.o][z]||0;if(n>0){pool[g.o][z]=0;add(g.o,WH_CODE,c.c,z,n);}});});
    // pass 3b: TO OTHER doors send every piece still left to the outlet chosen for that row (outside this board)
    /* Tze, 30 Oct 2026: "allow me to distribute evenly to a few other outlets too" - DEST holds one or more outlets
       ("A,B,C"); each size is dealt 1 piece at a time round the outlets, the turn carrying on to the next size so
       every outlet ends within 1 piece of the others. */
    /* Tze, 30 Oct 2026: "distribute evenly even with the donor outlet" - KEEP "e" puts the giving door in the deal

function shareMap(obj){var t=0,m={};for(var k in obj)t+=obj[k];for(var k2 in obj)m[k2]=t?obj[k2]/t*100:0;return m;}
function gapStyle(g){
  var a=Math.min(Math.abs(g),20)/20*55+8;               // 8%..63% tint by size of the gap
  if(Math.abs(g)<2)return "";
  return ' style="background:color-mix(in srgb,var('+(g>0?"--bad":"--accent")+') '+Math.round(a)+'%,transparent)"';
}
function renderSummary(){
  var moves=allMoves(), T={}, AREA={AD:{},BF:{}}, wk=+W*4.35;
  function cell(o,k){T[o]=T[o]||{};return T[o][k]=T[o][k]||{h:0,out:0,inn:0,s:0};}
  var art={};D.arts.forEach(function(a){art[a.a]=a;});
  D.arts.forEach(function(a){if(HIDE_SEA&&a.sea)return;a.cols.forEach(function(c){c.rows.forEach(function(r){
    var x=cell(r.o,a.k);x.h+=rowHeld(r);x.s+=rowSold(r);
    var b=r.o.slice(0,2);if(AREA[b])AREA[b][a.k]=(AREA[b][a.k]||0)+rowSold(r);});});});
  moves.forEach(function(m){var a=art[m.a];if(!a||(HIDE_SEA&&a.sea))return;cell(m.from,a.k).out+=m.q;cell(m.to,a.k).inn+=m.q;});
  var areaSh={AD:shareMap(AREA.AD),BF:shareMap(AREA.BF)}, natSh={AD:null,BF:null};
  if(D.nat)["AD","BF"].forEach(function(b){var src=(D.nat[b]||{})[W]||{},o={};
    for(var k in src){var v=src[k][0]+(HIDE_SEA?0:src[k][1]);if(v)o[k]=v;}natSh[b]=shareMap(o);});
  function cov(p,sold){return sold?Math.round(p/(sold/wk)):null;}
  function pct(v){return v==null?"–":(v<1&&v>0?"<1":Math.round(v))+"%";}
  function vsNat(mine,nat){if(nat==null)return "";var d=mine-nat;if(Math.abs(d)<3)return "";
    return ' <span class="'+(d>0?"up":"down")+'">'+(d>0?"▲":"▼")+"</span>";}
  var rows=D.outlets.map(function(x){return x.o;}).filter(function(o){return T[o];}).map(function(o){
    var b=o.slice(0,2), ks=Object.keys(T[o]).filter(function(k){var v=T[o][k];return v.h||v.inn||v.s;});
    var tot=ks.reduce(function(t,k){var v=T[o][k];t.h+=v.h;t.out+=v.out;t.inn+=v.inn;t.s+=v.s;return t;},{h:0,out:0,inn:0,s:0});
    tot.after=tot.h-tot.out+tot.inn;
    var body=ks.sort(function(x,y){return CAT_ORDER.indexOf(x)-CAT_ORDER.indexOf(y);}).map(function(k){
      var v=T[o][k], after=v.h-v.out+v.inn, stockSh=tot.after?after/tot.after*100:0, saleSh=tot.s?v.s/tot.s*100:0,
          gap=stockSh-saleSh, ar=(areaSh[b]||{})[k]||0, na=natSh[b]?(natSh[b][k]||0):null, flag="";
      if(after&&!v.s)flag='<span class="kind k-clear">No sales</span>';
      else if(gap>=5)flag='<span class="kind k-conc">Too much</span>';
      else if(gap<=-5)flag='<span class="kind k-move">Too little</span>';
      return '<tr><td class="l"><b>'+esc(catLabel(b,k))+"</b></td><td>"+v.h+"</td><td>"+(v.out?"−"+v.out:"–")+"</td><td>"+(v.inn?"+"+v.inn:"–")+
        '</td><td class="left'+(after!==v.h?" chg":"")+'">'+after+"</td><td>"+v.s+"</td><td>"+pct(stockSh)+"</td><td>"+pct(saleSh)+vsNat(saleSh,na)+
        "</td><td"+gapStyle(gap)+"><b>"+(gap>0?"+":"")+Math.round(gap)+"</b></td><td>"+pct(ar)+"</td><td>"+pct(na)+"</td><td>"+
        (cov(v.h,v.s)==null?"–":cov(v.h,v.s)+"w")+"</td><td>"+(cov(after,v.s)==null?"–":cov(after,v.s)+"w")+'</td><td class="l">'+flag+"</td></tr>";
    }).join("");
    return '<tbody><tr class="ohead"><td class="l" colspan="14"><b class="mono">'+esc(o)+"</b> "+esc(outletName(o))+
      ' <span class="muted">· now '+tot.h+" pcs · after "+tot.after+" · sold "+tot.s+" in "+W+"m</span></td></tr>"+body+"</tbody>";
  }).join("");
  $("#summary").innerHTML='<div class="bar"><label class="chk"><input type="checkbox" id="hideSea"'+(HIDE_SEA?" checked":"")+
    '> Leave out seasonal lines (Baju Melayu, BM accessories, Samfu)</label></div>'+
    '<p class="note">Every article at each outlet (ticked or not), by product type in article-code order. <b>Sends / Gets</b> come from the current plan. '+
    '<b>Stock %</b> = the type\u2019s share of the outlet\u2019s pieces after the plan. <b>Sold %</b> = its share of the outlet\u2019s sales in the last '+W+' months '+
    '(▲ / ▼ = 3 points or more above / below national). <b>Gap</b> = Stock % minus Sold %: <span class="swatch bad">red</span> = holding more of it than it sells (too much), '+
    '<span class="swatch acc">blue</span> = holding less than it sells (too little); the darker, the bigger the gap. <b>'+esc(D.title)+' %</b> and <b>National %</b> = the same type\u2019s share of sales '+
    'across all '+esc(D.title)+' outlets and across every counter in Malaysia (same brand)'+(D.nat?"":" \u2014 national figures not loaded")+'.</p>'+
    '<div class="scroll"><table class="sumt"><thead><tr><th class="l">Product type</th><th>Now</th><th>Sends</th><th>Gets</th><th>After</th><th>Sold '+W+'m</th>'+
    '<th>Stock %</th><th>Sold %</th><th>Gap</th><th>'+esc(D.title)+' %</th><th>National %</th><th>Cover now</th><th>Cover after</th><th class="l">Mix</th></tr></thead>'+rows+"</table></div>";
}

/* ---------- 5 By article (Tze, 19 Oct 2026: "can i go by the product group, art col ? something like this format") ----------
   His old Excel conso: product group > article > colour, one row per outlet with its stock by size, a total row
   per colour, and an ALLOCATION column saying where the pieces go. Green outlet = GET, amber = GIVE / ALL OUT. */
var BA_TXT={ticked:"Ticked articles",all:"All articles",grp:"All product groups",csv:"Download for Excel (CSV)",print:"Print / save PDF",
  outlet:"Outlet",art:"Art no",desc:"Description",col:"Col",tot:"Total",sold:"Sold",alloc:"Allocation",colTot:"total",
  arts:"articles",pcs:"pcs",more:"Show more",group:"Product group",name:"Outlet name",role:"Pick",
  none:"Nothing to show. Tick articles on 1 Choose & allocate, or switch to All articles.",
  note:"Stock now, by size. Green outlet = GET (receives), amber = GIVE or ALL OUT (sends). Allocation = where that outlet's pieces go (→) or where it gets them from (←) under the current plan; only ticked articles have a plan."};
var BA_ALL=null, BA_GRP="", BA_LIMIT=80;
function baGroups(){
  var arts=D.arts.filter(function(a){return BA_ALL||TICK.has(a.a);}), g={};
  arts.forEach(function(a){var k=a.b+"|"+a.k;(g[k]=g[k]||[]).push(a);});
  var keys=Object.keys(g).sort(function(x,y){var p=x.split("|"),q=y.split("|");
    return (p[0]<q[0]?-1:p[0]>q[0]?1:0)||CAT_ORDER.indexOf(p[1])-CAT_ORDER.indexOf(q[1]);});
  keys.forEach(function(k){g[k].sort(function(x,y){return x.a<y.a?-1:x.a>y.a?1:0;});});
  return {g:g,keys:keys};
}
function baSizes(arts){var set={};arts.forEach(function(a){a.cols.forEach(function(c){sizesOf(a,c).forEach(function(z){set[z]=1;});});});
  return Object.keys(set).sort(groupSizeCmp);}
/* one entry per outlet row of an art-colour: stock by size, role, allocation */
function baRows(a,c,moves){
  var planned=TICK.has(a.a);
  return c.rows.slice().sort(function(x,y){return rowHeld(y)-rowHeld(x)||rowSold(y)-rowSold(x);}).map(function(r){
    var role=planned?roleOf(a,c,r):"", to={}, from={};
    moves.forEach(function(m){if(m.a!==a.a||m.c!==c.c)return;
      if(m.from===r.o)to[m.to]=(to[m.to]||0)+m.q;if(m.to===r.o)from[m.from]=(from[m.from]||0)+m.q;});
    return {r:r,role:role,to:to,from:from};});
}
function baAllocTxt(x,html){
  var t=Object.keys(x.to).map(function(o){return (html?'<span class="to">→ ':"→ ")+o+" "+x.to[o]+(html?"</span>":"");}),
      f=Object.keys(x.from).map(function(o){return (html?'<span class="from">← ':"← ")+o+" "+x.from[o]+(html?"</span>":"");});
  return t.concat(f).join(html?"<br>":"; ");}
function baRoleTxt(role){return role==="r"?"GET":role==="g"?"GIVE":role==="x"?"ALL OUT":role==="w"?XR_TXT.wh:role==="s"?XR_TXT.sg:role==="o"?OT_TXT.ot:role==="d"?SP_TXT.sp:"";}

      if(!rows.length)return;
      blocks++;
      var tot=sizes.map(function(){return 0;}), tq=0, ts=0, price=priceNow(a);
      rows.forEach(function(x,i){

        body+='<tr'+(i?"":' class="cfirst"')+'><td class="l mono">'+(i?"":esc(a.a))+'</td><td class="l">'+(i?"":esc(a.n))+'</td><td class="l mono">'+(i?"":esc(c.c))+
          "</td><td>"+(i||!price?"":Math.round(price))+'</td><td class="o'+(x.role==="r"?" get":x.role==="g"||x.role==="x"?" give":"")+'" title="'+esc(outletName(r.o))+'">'+esc(r.o)+"</td>"+
          sizes.map(function(z,j){var q=r.q[z]||0;tot[j]+=q;return "<td>"+(q||"")+"</td>";}).join("")+
          "<td><b>"+n+"</b></td><td>"+rowSold(r)+'</td><td class="l">'+baRoleTxt(x.role)+'</td><td class="al">'+baAllocTxt(x,true)+"</td></tr>";
      });

      '<div class="scroll"><table class="grid byart"><thead><tr><th class="l">'+BA_TXT.art+'</th><th class="l">'+BA_TXT.desc+'</th><th class="l">'+BA_TXT.col+

      "<th>"+BA_TXT.tot+"</th><th>"+BA_TXT.sold+" "+W+"m</th><th class=\"l\">"+BA_TXT.role+'</th><th class="l">'+BA_TXT.alloc+"</th></tr></thead><tbody>"+body+"</tbody></table></div>";
  });

  $("#byart").innerHTML='<div class="bar noprint"><div class="seg"><button id="baTicked" aria-pressed="'+(!BA_ALL)+'">'+BA_TXT.ticked+" ("+TICK.size+")</button>"+
    '<button id="baAll" aria-pressed="'+BA_ALL+'">'+BA_TXT.all+"</button></div>"+
    '<select id="baGrp">'+opts([["",BA_TXT.grp]].concat(G.keys.map(function(k){var p=k.split("|");return [k,catLabel(p[0],p[1])+" ("+p[0]+")"];})),BA_GRP)+"</select>"+
    '<button class="act" id="baPrint">'+BA_TXT.print+'</button><button class="ghost" id="baCsv">'+BA_TXT.csv+"</button></div>"+
    '<p class="note noprint">'+BA_TXT.note+"</p>"+(html||'<p class="empty">'+BA_TXT.none+"</p>")+more;
}
function baCsv(){
  var moves=allMoves(), G=baGroups(), keys=G.keys.filter(function(k){return !BA_GRP||k===BA_GRP;});
  var all=[];keys.forEach(function(k){all=all.concat(G.g[k]);});
  var sizes=baSizes(all).sort(function(x,y){var gx=SIZE_GROUPS.findIndex(function(g){return g[0]===sizeGroup(x);}),gy=SIZE_GROUPS.findIndex(function(g){return g[0]===sizeGroup(y);});
    return gx-gy||groupSizeCmp(x,y);});
  var out=[[BA_TXT.group,"Brand",BA_TXT.art,BA_TXT.desc,BA_TXT.col,"RM",BA_TXT.outlet,BA_TXT.name].concat(sizes).concat([BA_TXT.tot,BA_TXT.sold+" "+W+"m",BA_TXT.role,BA_TXT.alloc,MDL_TXT.rem])];
  keys.forEach(function(k){var p=k.split("|");G.g[k].forEach(function(a){a.cols.forEach(function(c){
    var rows=baRows(a,c,moves).filter(function(x){return rowHeld(x.r)||rowSold(x.r)||Object.keys(x.from).length;});
    var tot=sizes.map(function(){return 0;}),tq=0,ts=0;
    rows.forEach(function(x){var r=x.r;tq+=rowHeld(r);ts+=rowSold(r);
      out.push([catLabel(p[0],p[1]),p[0],a.a,a.n,c.c,Math.round(priceNow(a)||0),r.o,outletName(r.o)].concat(sizes.map(function(z,j){var q=r.q[z]||0;tot[j]+=q;return q||"";}))
        .concat([rowHeld(r),rowSold(r),baRoleTxt(x.role),baAllocTxt(x,false),moveNote(r.o,a.a,c.c,moves)]));});
    if(rows.length)out.push([catLabel(p[0],p[1]),p[0],a.a,a.n,c.c,"",c.c+" "+BA_TXT.colTot,""].concat(tot.map(function(v){return v||"";})).concat([tq,ts,"","",""]));
  });});});
  var csv="﻿"+out.map(function(r){return r.map(function(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",");}).join("\r\n");
  var aEl=document.createElement("a");aEl.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));
  aEl.download=D.title.replace(/\W+/g,"_")+"_conso_by_article_"+D.built+".csv";aEl.click();
}

function toast(el,t){var n=$(el);if(n){n.textContent=t;setTimeout(function(){n.textContent="";},4000);}}
function copy(text,where){

  function(){var t=document.createElement("textarea");t.value=text;document.body.appendChild(t);t.select();try{document.execCommand("copy");toast(where,"Copied.");}catch(e){toast(where,"Copy failed");}t.remove();});
}
function waText(){
  var m=allMoves();if(!m.length)return "No moves planned.";
  var pairs={};m.forEach(function(x){var k=x.from+" → "+x.to;(pairs[k]=pairs[k]||[]).push(x);});
  var out=["*"+D.title+" conso plan* ("+W+"-month sales, default up to "+CAP+" pcs per size)",""];
  Object.keys(pairs).sort().forEach(function(k){var ms=pairs[k];out.push("*"+k+"* : "+ms.reduce(function(n,x){return n+x.q;},0)+" pcs");
    var by={};ms.forEach(function(x){var kk=x.a+" col "+x.c;(by[kk]=by[kk]||[]).push(x);});
    Object.keys(by).forEach(function(kk){var x0=by[kk][0],a=D.arts.find(function(y){return y.a===x0.a;}),c=a.cols.find(function(y){return y.c===x0.c;}),
        r=c.rows.find(function(y){return y.o===x0.from;}),cleared=r&&leftAfter(r,c,m.filter(function(y){return y.a===x0.a;}))===0;
      out.push("  "+kk+": "+by[kk].sort(function(a,b){return sizeCmp(a.z,b.z);}).map(function(x){return x.z+"×"+x.q;}).join(", ")+(cleared?"  _(all out, 0 left)_":""));});

/* Every tap re-renders the grid, which threw the phone back to the top and reset the side-scroll of the table.

function snapView(t){

function readKey(){var h=(location.hash||"").replace(/^#/,"").split("&")[0].trim();return /^[0-9a-fA-F]{64}$/.test(h)?h.toLowerCase():null;}
function hexToBytes(h){var o=new Uint8Array(h.length/2);for(var i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o;}
function b64(s){var b=atob(s),o=new Uint8Array(b.length);for(var i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;}

  return Promise.all([fetch("k/"+id+".json",{cache:"no-store"}),crypto.subtle.importKey("raw",hexToBytes(KEYHEX),{name:"AES-GCM"},false,["decrypt"])]);
}).then(function(r){if(!r[0].ok)throw new Error("missing");return r[0].json().then(function(doc){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(doc.iv),tagLength:128},r[1],b64(doc.ct));});
