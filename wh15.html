<style>

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}

.chip span{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.chip.pr b{color:var(--rack-edge)} .chip.bs b{color:var(--carton)} .chip.cap{background:var(--navy-soft);border-color:transparent} .chip.cap b{color:var(--navy)}

.tab[aria-selected="true"]{background:var(--ground);border-color:var(--line);color:var(--ink);position:relative;top:1px}
.tab .sub{display:block;font-family:var(--f-body);font-size:12.5px;font-weight:400;letter-spacing:.02em}
main{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:18px;padding:18px 24px 40px;align-items:start}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px 12px;overflow:hidden}
.plan header{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;margin-bottom:8px}
.plan h2{font-size:26px;font-weight:700}
.plan .meta{font-size:13.5px;color:var(--muted)}

.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:13.5px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:10px;border:1px solid var(--line-strong);vertical-align:-1px;margin-right:5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;position:sticky;top:12px;box-shadow:var(--shadow)}
.panel h2{font-size:28px;font-weight:700;line-height:1.05}
.panel .zone{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;margin-bottom:8px;font-weight:600}
.zone.pr{background:var(--rack-soft);color:var(--rack-edge)} .zone.bs{background:var(--carton-soft);color:var(--carton)} .zone.so{background:var(--navy-soft);color:var(--navy)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin:10px 0 12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums}
.elev{display:flex;flex-direction:column;gap:4px;margin:8px 0 14px}
.elev .lv{display:grid;grid-template-columns:54px 1fr 1fr;gap:4px;align-items:stretch}
.elev .lv.one{grid-template-columns:54px 1fr}
.elev .tag{font-family:var(--f-display);font-size:15px;font-weight:600;color:#fff;border-radius:var(--r-sm);padding:4px 6px;line-height:1.05;display:flex;flex-direction:column;justify-content:center}
.elev .tag small{font-family:var(--f-body);font-size:11px;font-weight:400;opacity:.9}

.elev .cell:hover{border-color:var(--hit);background:var(--hit-soft)}
.elev .cell.on{border-color:var(--hit);box-shadow:inset 0 0 0 1px var(--hit)}
.elev .cell small{display:block;font-family:var(--f-body);font-size:12px;color:var(--muted)}
.floorline{border-top:3px solid var(--line-strong);margin-top:2px;font-size:12.5px;color:var(--muted);padding-top:3px}
.labelwrap{margin-top:6px}
.labelwrap h3{font-size:18px;font-weight:600;margin-bottom:8px}
.labelwrap .note{font-size:13px;color:var(--muted);margin-top:8px}
.lbl{position:relative;background:#FFF;color:#111;border:1px solid #333;border-radius:2mm;overflow:hidden;font-family:var(--f-body);transform-origin:top left}
.lbl .band{position:absolute;left:0;right:0;top:0;color:#fff;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:0 3mm}
.lbl .code{position:absolute;left:4mm;font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1}
.lbl .bc{position:absolute;left:4mm;bottom:4mm}
.lbl .bc svg{display:block}
.lbl .info{position:absolute;right:3mm;bottom:3.5mm;text-align:right;line-height:1.35}
.lbl.pallet{width:100mm;height:50mm;background:#FBEC8C}
.lbl.pallet .band{height:9mm;font-size:9pt}
.lbl.pallet .code{top:11mm;font-size:30pt}
.lbl.pallet .info{font-size:8pt}

.lbl.carton .band{height:6mm;font-size:7pt;background:#0D4AA0}
.lbl.carton .code{top:7mm;font-size:17pt;left:2.5mm}

.filelist{font-family:var(--f-mono);font-size:13.5px;line-height:1.8}
.codeguide code{font-family:var(--f-mono);background:var(--ground);padding:2px 7px;border-radius:6px;font-size:14px}
svg text{font-family:var(--f-display);fill:var(--ink)}
svg .bay{cursor:pointer}
svg .bay rect{transition:fill .12s}
svg .bay:hover rect.body, svg .bay.on rect.body{fill:var(--hit-soft);stroke:var(--hit);stroke-width:60}

svg .lbl-bay{font-size:470px;font-weight:600}
svg .lbl-small{font-size:340px;font-weight:500;fill:var(--ink)}
svg .lbl-note{font-family:var(--f-body);font-size:290px;fill:var(--muted)}

.viewport{position:relative;height:clamp(380px,64vh,860px);border-radius:var(--r-sm);background:var(--ground);overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}

.panel .handle{display:none}
.lblfit{overflow:hidden}
.lblfit .lbl{transform-origin:top left}
main{grid-template-columns:minmax(0,1fr) 390px}

}

/* ---------- map-style viewport: wheel / pinch zoom, drag pan, buttons ---------- */
const vpState = { dragged: false };
function wrapPlan(html) {
  const i = html.indexOf("<svg"), j = html.indexOf("</svg>") + 6;
  return html.slice(0, i) + `<div class="viewport"><div class="zoomctl"><button type="button" data-z="in" aria-label="Zoom in">+</button><button type="button" data-z="out" aria-label="Zoom out">&minus;</button><button type="button" class="fit" data-z="fit" aria-label="Fit to view">FIT</button></div>${html.slice(i, j)}<div class="viewhint">drag to pan &middot; scroll or pinch to zoom &middot; tap a bay</div></div>` + html.slice(j);
}
function initViewport(vp) {
  if (!vp) return;
  const svg = vp.querySelector("svg");
  const base = svg.getAttribute("viewBox").split(/\s+/).map(Number);
  let vb = base.slice();
  const apply = () => svg.setAttribute("viewBox", vb.join(" "));
  const rect = () => vp.getBoundingClientRect();
  const toSvg = (cx, cy) => { const r = rect(); const s = Math.max(vb[2] / r.width, vb[3] / r.height); const ox = (r.width - vb[2] / s) / 2, oy = (r.height - vb[3] / s) / 2;
    return [vb[0] + (cx - r.left - ox) * s, vb[1] + (cy - r.top - oy) * s, s]; };
  const zoomAt = (cx, cy, f) => { const [px, py] = toSvg(cx, cy); const nw = Math.min(base[2] * 2.5, Math.max(base[2] / 14, vb[2] * f)); const k = nw / vb[2];
    vb = [px - (px - vb[0]) * k, py - (py - vb[1]) * k, nw, vb[3] * k]; apply(); };
  vp.querySelector(".zoomctl").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; const r = rect();
    if (b.dataset.z === "fit") { vb = base.slice(); apply(); } else zoomAt(r.left + r.width / 2, r.top + r.height / 2, b.dataset.z === "in" ? 0.7 : 1 / 0.7); });
  vp.addEventListener("wheel", e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY > 0 ? 1.15 : 1 / 1.15); }, { passive: false });
  const pts = new Map(); let last = null, moved = 0, pinch = null;
  vp.addEventListener("pointerdown", e => { if (e.target.closest(".zoomctl")) return; vp.setPointerCapture(e.pointerId); pts.set(e.pointerId, [e.clientX, e.clientY]); moved = 0; vpState.dragged = false;
    if (pts.size === 1) last = [e.clientX, e.clientY]; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]), w: vb[2] }; } vp.classList.add("dragging"); });
  vp.addEventListener("pointermove", e => { if (!pts.has(e.pointerId)) return; pts.set(e.pointerId, [e.clientX, e.clientY]);
    if (pts.size === 2 && pinch) { const [a, b] = [...pts.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]); const cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2;
      const target = Math.min(base[2] * 2.5, Math.max(base[2] / 14, pinch.w * pinch.d / Math.max(d, 1))); zoomAt(cx, cy, target / vb[2]); moved = 99; return; }
    if (pts.size === 1 && last) { const [, , s] = toSvg(e.clientX, e.clientY); const dx = e.clientX - last[0], dy = e.clientY - last[1]; moved += Math.abs(dx) + Math.abs(dy);
      vb[0] -= dx * s; vb[1] -= dy * s; last = [e.clientX, e.clientY]; apply(); } });
  const up = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (pts.size === 0) { vp.classList.remove("dragging"); last = null; vpState.dragged = moved > 6; setTimeout(() => { vpState.dragged = false; }, 50); } };
  vp.addEventListener("pointerup", up); vp.addEventListener("pointercancel", up);
  vp.addEventListener("dblclick", e => { if (!e.target.closest(".zoomctl")) { vb = base.slice(); apply(); } });
}
/* labels that never overflow the panel */
function fitLabels(root) {
  root.querySelectorAll(".lblfit").forEach(box => { const l = box.querySelector(".lbl"); if (!l) return; l.style.transform = ""; box.style.height = "";
    const sc = Math.min(1, (box.clientWidth - 2) / l.offsetWidth); if (sc < 1) { l.style.transform = `scale(${sc})`; box.style.height = l.offsetHeight * sc + "px"; } });
}
window.addEventListener("resize", () => fitLabels(document));

/* ---------- selection + panel ---------- */
function selectBay(kind, id, binCode) {
  selected = { kind, id, bin: binCode || null };
  document.querySelectorAll("svg .bay").forEach(g => g.classList.toggle("on", g.dataset.id === id));
  renderPanel();
}
function panelHandle(txt) { return `<div class="handle"><span class="bar"></span><span class="txt">${txt}</span><button type="button" id="closePanel" aria-label="Close">&times;</button></div>`; }
function renderPanel() {
  const el = document.getElementById("panel"); if (!el) return;
  el.classList.toggle("open", !!selected);
  const finish = () => { const c = el.querySelector("#closePanel"); if (c) c.addEventListener("click", () => { selected = null; document.querySelectorAll("svg .bay.on").forEach(g => g.classList.remove("on")); renderPanel(); });
    const h = el.querySelector(".handle"); if (h && !selected) h.addEventListener("click", e => { if (!e.target.closest("button")) el.classList.toggle("open"); }); fitLabels(el); };
  if (!selected) { el.innerHTML = panelHandle("Tap a bay to see its bins and label") + `<h2>Pick a location</h2><p class="empty">Click any bay on the plan to see its bins and the label that goes on each one. Or type a code in the search box.</p>${cartonTable(current === "GF" ? "pallet" : "shelf")}`; finish(); return; }
  const { kind, id } = selected;
  if (kind === "PR") {
    const [row, bay] = id.split("-"); const bins = palletBins.filter(b => b.row === row && b.bay === +bay);
    let lv = "";
    for (let l = P.levels; l >= 1; l--) {
      const a = bins.find(b => b.level === l && b.slot === "A"), bb = bins.find(b => b.level === l && b.slot === "B");
      lv += `<div class="lv"><div class="tag" style="background:${P.colour[l]}">L${l}<small>${l === 1 ? "floor" : "beam " + fmt(P.beam[l])}</small></div>
        ${[a, bb].map(x => `<button class="cell ${selected.bin === x.code ? "on" : ""}" data-code="${x.code}">${x.code}<small>slot ${x.slot}</small></button>`).join("")}</div>`;
    }
    const bin = bins.find(b => b.code === selected.bin) || bins.find(b => b.level === 2 && b.slot === "A");
    el.innerHTML = panelHandle(`Bay ${id} &middot; pallet racking`) + `<span class="zone pr">Pallet racking</span><h2>Bay ${id}</h2>
      <dl class="kv"><dt>Aisle</dt><dd>${P.aisle_of[row]} &middot; 3,600 clear</dd><dt>Bay</dt><dd>2,790 pitch &middot; 900 deep &middot; 2 pallets 1,200 x 1,000</dd><dt>Levels</dt><dd>floor + 4 beam levels, 1,500 kg per level</dd><dt>Bins</dt><dd>10 (5 levels x 2 slots)</dd><dt>Holds</dt><dd>${DATA.cartons[0].pallet * 10}&ndash;${DATA.cartons[3].pallet * 10} cartons &middot; ${fmt(DATA.cartons[0].pallet * 10 * DATA.cartons[0].pcs)}&ndash;${fmt(DATA.cartons[3].pallet * 10 * DATA.cartons[3].pcs)} pieces when full</dd></dl>
      <div class="elev">${lv}<div class="floorline">floor &middot; slot A is left, B is right, facing the rack from aisle ${P.aisle_of[row]}</div></div>
      <div class="labelwrap"><h3>Label for ${bin.code}</h3><div class="lblfit">${palletLabel(bin)}</div><div class="note">Yellow 100 x 50 mm, level colour band, Code128. Levels 2 to 5 go on the beam face, level 1 on the upright at floor.</div></div>`;
    el.querySelectorAll(".cell").forEach(c => c.addEventListener("click", () => selectBay("PR", id, c.dataset.code)));
    drawBarcode(el, bin.code); finish();
  } else if (kind === "BS") {
    const [deck, row, bay] = id.split("-"); const bins = cartonBins.filter(b => b.deck === deck && b.row === row && b.bay === +bay);
    const d = B.decks.find(x => x.deck === deck);
    let sh = "";
    for (let l = B.shelves[deck]; l >= 1; l--) { const x = bins.find(b => b.shelf === l);
      sh += `<div class="lv one"><div class="tag" style="background:var(--carton)">S${l}<small>${l === 1 ? "bottom" : "shelf"}</small></div><button class="cell ${selected.bin === x.code ? "on" : ""}" data-code="${x.code}">${x.code}</button></div>`; }
    const bin = bins.find(b => b.code === selected.bin) || bins.find(b => b.shelf === 2);
    el.innerHTML = panelHandle(`Deck ${deck} &middot; bay ${row}-${pad2(bay)}`) + `<span class="zone bs">Carton shelving &middot; deck ${deck}</span><h2>Bay ${row}-${pad2(bay)}</h2>
      <dl class="kv"><dt>Deck</dt><dd>${deck} at +${fmt(d.height)} mm</dd><dt>Bay</dt><dd>1,800 wide x ${fmt(bins[0].depth)} deep</dd><dt>Position</dt><dd>bay ${pad2(bay)} counted from the rear wall</dd><dt>Shelves</dt><dd>${B.shelves[deck]} (assumed, not on the PDF)</dd><dt>Per shelf</dt><dd>4 woven / 10 pants / 8 polo / 12 dense polo</dd><dt>Holds</dt><dd>${DATA.cartons[0].shelf600 * B.shelves[deck]}&ndash;${DATA.cartons[3].shelf600 * B.shelves[deck]} cartons &middot; ${fmt(DATA.cartons[0].shelf600 * B.shelves[deck] * DATA.cartons[0].pcs)}&ndash;${fmt(DATA.cartons[3].shelf600 * B.shelves[deck] * DATA.cartons[3].pcs)} pieces when full</dd></dl>
      ${bins[0].doubt ? `<p style="margin:0 0 8px;padding:8px 10px;border-radius:var(--r-sm);background:var(--hit-soft);color:var(--hit);font-size:13.5px"><b>Unconfirmed bay.</b> On the MySteel 1F sheet this block straddles the platform column line into bay P-1, where the L1 top view shows no deck, and one column is drawn about 1,150 deep, so it may not exist at this level. Ask MySteel before printing its labels.</p>` : ""}<div class="elev">${sh}<div class="floorline">deck ${deck} &middot; shelf 1 is the bottom shelf</div></div>
      <div class="labelwrap"><h3>Label for ${bin.code}</h3><div class="lblfit">${cartonLabel(bin)}</div><div class="note">White 70 x 30 mm with blue band, Code128. One on the front edge of every shelf.</div></div>`;
    el.querySelectorAll(".cell").forEach(c => c.addEventListener("click", () => selectBay("BS", id, c.dataset.code)));
    drawBarcode(el, bin.code); finish();
  } else {
    const info = {
      "IN-1": ["Sorter induction", "Conveyor belt feeding the wheel sorter. PP-1 (3-phase 380 V 32 A, 2 x 16 A, LAN) sits 867 mm from the column line beside it."],
      "SC-1": ["Scanning gantry", "2.0 to 2.2 m high. The emergency light beside the existing stair sits on this line and has to move (Adams, 3 Sep, unanswered)."],
      "C1": ["Conveyor 1", "77 x 85 cm x 2.65 m, under platform bay P-1."], "C2": ["Conveyor 2", "77 x 78 cm x 2.75 m, under platform bay P-1. Conveyor 3 (77 x 68 x 2.6 m) is not placed on the DWG."],
    }[id] || [`Sorter chute ${id}`, `${+id.slice(2) <= 18 ? "Left" : "Right"} side, position ${+id.slice(2) <= 18 ? +id.slice(2) : +id.slice(2) - 18} of 18 from the induction end. One destination outlet per chute, mapped in the WMS before the 1 to 2 Oct integration test.`];
    el.innerHTML = panelHandle(info[0]) + `<span class="zone so">Sorter &amp; conveyors</span><h2>${info[0]}</h2><p>${info[1]}</p><p class="empty">Chute labels are 100 x 50 mm, CH01 to CH36, printed separately.</p>`; finish();
  }
}
function cartonTable(mode) {
  const col = mode === "pallet" ? ["Per pallet slot", c => c.pallet] : ["Per 1,800 x 600 shelf", c => c.shelf600];
  return `<h3 style="margin-top:14px;font-size:15px">Cartons that fit &middot; ${col[0]}</h3><table class="cartons"><tr><th>Carton</th><th>Size</th><th>Pcs</th><th>Ctn</th><th>Pcs</th></tr>
    ${DATA.cartons.map(c => `<tr><td>${c.name}</td><td>${c.dims}</td><td>${c.pcs}</td><td>${col[1](c)}</td><td>${col[1](c) * c.pcs}</td></tr>`).join("")}</table>
    <p style="font-size:14px;margin:8px 0 0"><b>Whole warehouse when full:</b> ${fmt(CAP.ctnLo)}&ndash;${fmt(CAP.ctnHi)} cartons, ${fmt(CAP.pcsLo)}&ndash;${fmt(CAP.pcsHi)} pieces (woven to dense polo).</p><p class="note" style="font-size:13px;color:var(--muted)">${mode === "pallet" ? "1,200 x 1,000 pallet, stack up to 130 cm. Levels 4 and 5 need a reach truck with 7 m lift." : "Single layer, best orientation. Standing pants and polo cartons need a 650 mm shelf opening."}</p>`;
}

/* ---------- labels ---------- */
function palletLabel(b) {
  return `<div class="lbl pallet"><div class="band" style="background:${P.colour[b.level]}"><span>PALLET RACK &nbsp; LEVEL ${b.level} &nbsp;${P.colour_name[b.level]}</span><span style="font-weight:400">WH15</span></div>
    <div class="code">${b.code}</div><div class="bc"><svg data-code="${b.code}"></svg></div>
    <div class="info">Row ${b.row} &nbsp;Bay ${pad2(b.bay)}<br>Level ${b.level} &nbsp;Slot ${b.slot}<br>Aisle ${b.aisle} &nbsp;beam ${fmt(b.beam)}</div></div>`;
}
function cartonLabel(b) {
  return `<div class="lbl carton"><div class="band"><span>CARTON SHELF &nbsp; DECK ${b.deck}</span><span>WH15</span></div>
    <div class="code">${b.code}</div><div class="bc"><svg data-code="${b.code}"></svg></div>
    <div class="info">Row ${b.row} &nbsp;Bay ${pad2(b.bay)}<br>Shelf ${b.shelf} (1 = bottom)</div></div>`;
}
function drawBarcode(root, code) {
  root.querySelectorAll("svg[data-code]").forEach(svg => {
    const carton = svg.closest(".carton");
    try { JsBarcode(svg, svg.dataset.code, { format: "CODE128", displayValue: false, width: carton ? 1.2 : 1.6, height: carton ? 22 : 36, margin: 0, background: "transparent", lineColor: "#111" }); }
    catch (e) { svg.outerHTML = `<span style="font:10px monospace">${svg.dataset.code}</span>`; }
  });
}

/* ---------- labels page ---------- */
function labelsPage() {
  const pb = palletBins.find(b => b.code === "B-02-3-A"), cb = cartonBins.find(b => b.deck === "2F" && b.bay === 5 && b.shelf === 2);
  return `<div class="gallery" style="grid-column:1/-1">
    <div class="card"><h2>Two storage systems, two labels</h2><p>A pallet label is yellow and lands on a beam; a carton label is white with a blue band and lands on a shelf edge. A pallet code always starts with a single row letter (A to F), a carton code always starts with the deck (1F, 2F, 3F), so a scanned code can never be filed in the wrong zone.</p>
      <div class="two">
        <div><h3 style="font-size:17px;margin-bottom:8px">Pallet rack label &middot; 100 x 50 mm &middot; ${palletBins.length} to print</h3><div class="lblfit">${palletLabel(pb)}</div>
          <dl class="anat"><dt>Band</dt><dd>colour of the level, readable from the aisle</dd><dt>B</dt><dd>row (A to F)</dd><dt>02</dt><dd>bay, 01 at the platform end (right), 03 at the left wall</dd><dt>3</dt><dd>level, 1 = floor, 2 to 5 = beams</dd><dt>A</dt><dd>slot, left pallet facing the rack</dd></dl>
          <div class="swatches">${[1, 2, 3, 4, 5].map(l => `<span class="sw"><i style="background:${P.colour[l]}"></i>L${l} ${P.colour_name[l].toLowerCase()} &middot; ${l === 1 ? "floor" : fmt(P.beam[l]) + " mm"}</span>`).join("")}</div></div>
        <div><h3 style="font-size:17px;margin-bottom:8px">Carton shelf label &middot; 70 x 30 mm &middot; ${cartonBins.length} to print</h3><div class="lblfit">${cartonLabel(cb)}</div>
          <dl class="anat"><dt>2F</dt><dd>deck (1F, 2F or 3F)</dd><dt>${cb.row}</dt><dd>row, lettered A from the left (racking side) on every deck, no I or O</dd><dt>05</dt><dd>bay = position from the rear wall (01) to the front-hall end (09)</dd><dt>2</dt><dd>shelf, 1 = bottom</dd></dl>
          <p style="font-size:12.5px;color:var(--muted)">Shelves per bay are assumed (5 on 1F and 2F, 4 on 3F) until MySteel confirms the frame. Hold printing until then.</p></div>
      </div></div>
    <div class="card"><h2>Print files</h2><p>Both sets are A4 sticker sheets at 100% scale, in the project folder:</p>
      <div class="filelist">WH15_Labels_PALLET_RACK.pdf &nbsp;&middot;&nbsp; 18 pages, 10 labels each<br>WH15_Labels_CARTON_SHELF.pdf &nbsp;&middot;&nbsp; 41 pages, 18 labels each<br>WH15_Bin_Locations.xlsx &nbsp;&middot;&nbsp; every code, for the iDCP bin import</div>
      <p>Other signage: 18 pallet bay labels, 12 row-end boards, 3 aisle boards, 18 load notices (1,500 kg per level), 36 chute labels, 3 deck signs.</p></div>
  </div>`;
}
function drawGalleryBarcodes() { drawBarcode(document.getElementById("main")); fitLabels(document.getElementById("main")); }

/* ---------- code guide ---------- */
function guidePage() {
  const cb = cartonBins.find(b => b.deck === "2F" && b.bay === 5 && b.shelf === 2);
  return `<div class="gallery codeguide" style="grid-column:1/-1">
    <div class="card"><h2>Reading a location code</h2>
      <p><code>B-02-3-A</code> &rarr; ground floor, pallet row <b>B</b>, bay <b>02</b>, level <b>3</b> (beam at 3,450 mm), slot <b>A</b>. Ten bins per bay, 180 in total.</p>
      <p><code>2F-${cb.row}-05-2</code> &rarr; deck <b>2F</b> (+5,958 mm), carton row <b>${cb.row}</b> (rows run A from the left, racking side), bay position <b>05</b> counted from the rear wall, shelf <b>2</b>. Bay numbers are grid positions along the deck, so bay 05 is the same spot in every row and rows with a gap simply skip a number.</p>
      <p><code>CH21</code> &rarr; sorter chute 21, right side, third from the induction end.</p>
      <p>Compact forms without dashes (<code>B023A</code>, <code>2F${cb.row}052</code>) are in the spreadsheet in case iDCP rejects the dash.</p></div>
    <div class="card"><h2>What is still assumed</h2>
      <p><b>Ground floor orientation.</b> Racking left and platform right is as MySteel drew it (confirmed 9 Sep). Which end is the front hall is still assumed.</p>
      <p><b>Shelves per bay.</b> The MySteel carton drawing is a plan with no elevation. Five shelves on 1F and 2F, four on 3F are placeholders.</p>
      <p><b>1F block A/B.</b> Drawn on the PDF with one column about 1,150 deep and partly outside the platform column line. Ask MySteel whether it is a deeper bay or a drafting slip.</p></div>
    <div class="card"><h2>Capacity at a glance</h2>
      <table class="cartons"><tr><th>Zone</th><th>Bays</th><th>Bins</th><th>Woven ctn</th><th>Woven pcs</th><th>Dense polo ctn</th><th>Dense polo pcs</th></tr>
        <tr><td>Pallet racking (180 slots)</td><td>${P.rows.length * P.bays}</td><td>${palletBins.length}</td><td>${fmt(palletBins.length * 18)}</td><td>${fmt(palletBins.length * 18 * 24)}</td><td>${fmt(palletBins.length * 30)}</td><td>${fmt(palletBins.length * 30 * 28)}</td></tr>
        ${B.decks.map(d => `<tr><td>Deck ${d.deck} shelving</td><td>${d.bays}</td><td>${d.bays * B.shelves[d.deck]}</td><td>${fmt(d.bays * B.shelves[d.deck] * 4)}</td><td>${fmt(d.bays * B.shelves[d.deck] * 4 * 24)}</td><td>${fmt(d.bays * B.shelves[d.deck] * 12)}</td><td>${fmt(d.bays * B.shelves[d.deck] * 12 * 28)}</td></tr>`).join("")}
        <tr><td><b>Whole warehouse</b></td><td>${P.rows.length * P.bays + bayCount}</td><td>${palletBins.length + cartonBins.length}</td><td><b>${fmt(CAP.ctnLo)}</b></td><td><b>${fmt(CAP.pcsLo)}</b></td><td><b>${fmt(CAP.ctnHi)}</b></td><td><b>${fmt(CAP.pcsHi)}</b></td></tr></table>
      <p style="font-size:12px;color:var(--muted)">Woven = 18 cartons of 24 pcs per pallet, 4 per shelf. Dense polo = 30 cartons of 28 pcs per pallet, 12 per shelf. Every bin full, which never happens in practice; plan on 75 to 85 percent of these figures.</p></div>
  </div>`;
}

/* ---------- search ---------- */
document.getElementById("q").addEventListener("input", e => {
  const q = e.target.value.trim().toUpperCase().replace(/\s+/g, ""); if (q.length < 3) return;
  let m;
  if ((m = q.match(/^([A-F])-?(\d{2})(?:-?([1-5])-?([AB])?)?$/))) { show("GF", true); selectBay("PR", `${m[1]}-${m[2]}`, m[3] && m[4] ? `${m[1]}-${m[2]}-${m[3]}-${m[4]}` : null); return; }
  if ((m = q.match(/^([123]F)-?([A-Z])-?(\d{2})(?:-?(\d))?$/))) { const b = cartonBins.find(x => x.deck === m[1] && x.row === m[2] && x.bay === +m[3]); if (!b) return;
    show(m[1], true); selectBay("BS", `${m[1]}-${m[2]}-${m[3]}`, m[4] ? `${m[1]}-${m[2]}-${m[3]}-${m[4]}` : null); return; }
  if ((m = q.match(/^CH(\d{2})$/))) { show("GF", true); selectBay("SO", `CH${m[1]}`); }
});
show("GF");
</script>
