<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BM 2025 Allocation</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202c;--mut:#5d6b7a;--line:#dde2e8;--acc:#1f3864;--accs:#e7ecf5;--warn:#b54708;--warns:#fdf0e3;--ok:#067647;--oks:#e5f4ec;--bad:#b42318;--bads:#fbeaea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--card:#18202a;--ink:#e6ebf1;--mut:#97a3b0;--line:#2a3542;--acc:#8fb0e8;--accs:#1f2b3d;--warn:#f3a35c;--warns:#3a2817;--ok:#5fd39a;--oks:#14301f;--bad:#f28b82;--bads:#3a1c1c}}
:root[data-theme="dark"]{--bg:#0f141a;--card:#18202a;--ink:#e6ebf1;--mut:#97a3b0;--line:#2a3542;--acc:#8fb0e8;--accs:#1f2b3d;--warn:#f3a35c;--warns:#3a2817;--ok:#5fd39a;--oks:#14301f;--bad:#f28b82;--bads:#3a1c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:8px 16px 40px}
h1{font-size:17px;margin:2px 0 0}h2{font-size:14px;margin:0}
.muted{color:var(--mut)}.small{font-size:12px}
.stats{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.stat b{font-size:13px}.stat.warn{background:var(--warns);border-color:var(--warn)}.stat.ok{background:var(--oks);border-color:var(--ok)}
.ak{display:block;font-size:11px;color:var(--mut);font-weight:400;white-space:nowrap}
.ctl{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:6px}
select,input,button{font:inherit;font-size:12px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
button{cursor:pointer;background:var(--accs);border-color:var(--acc);color:var(--acc);font-weight:600}
button.pri{background:var(--acc);color:var(--card)}button.on{background:var(--acc);color:var(--card)}
input[type=search]{min-width:150px;flex:1}
.tabs{display:flex;gap:4px}.tabs button{font-size:14px;padding:5px 16px}
.steps{margin:8px 0 0;padding:8px 12px;background:var(--card);border:1px solid var(--line);border-radius:8px;font-size:12.5px;line-height:1.55}
.steps ol{margin:0;padding-left:18px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:8px;overflow:hidden}
.ph{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
table.ct{border-collapse:collapse;width:100%;font-size:12.5px}
.ct th,.ct td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
.ct th{color:var(--mut);font-weight:600;font-size:11.5px;background:var(--accs)}.ct .l{text-align:left}
.cols{display:flex;flex-wrap:wrap;gap:2px}.cl{font-size:10.5px;border:1px solid var(--line);border-radius:3px;padding:0 3px;font-variant-numeric:tabular-nums}
.cl.out{border-style:dashed;opacity:.45}
.left0{color:var(--warn);font-weight:700}
.orow{display:grid;gap:6px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.orow:hover{background:var(--accs)}
.orow.head{position:sticky;top:0;z-index:3;font-size:11px;color:var(--mut);font-weight:600;background:var(--accs);cursor:default;align-items:end}
.orow.sub{background:var(--bg);font-weight:700;cursor:default}
.orow.chg{background:var(--warns)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.code{font-weight:700}.nm{color:var(--mut);margin-left:5px}
.ak2{display:block;font-size:10px;color:var(--mut);font-weight:400}
.pk{display:flex;align-items:center;justify-content:center;gap:2px}
.pk button{width:24px;height:24px;padding:0;font-size:15px;line-height:1}
.pk b{min-width:18px;text-align:center;font-size:14px}.pk b.z{color:var(--mut);font-weight:400}.pk.chg b{color:var(--warn)}
.hd2{text-align:center;line-height:1.2}
.srt{cursor:pointer;user-select:none}.srt:hover{color:var(--acc)}.srt.on{color:var(--acc)}
.rch{display:flex;flex-wrap:wrap;gap:2px}.rc{display:inline-block;font-size:9.5px;font-weight:700;border-radius:3px;padding:1px 3px;border:1px solid var(--line);color:var(--mut)}
.rc.has{background:var(--ink);color:var(--card);border-color:var(--ink)}.rc.add{background:var(--ok);color:var(--card);border-color:var(--ok)}
.rc.gap{border-color:var(--warn);color:var(--warn);background:var(--warns)}.rc.no{border-style:dashed;opacity:.55}
.det{padding:10px 12px 12px 36px;background:var(--bg);border-bottom:1px solid var(--line);cursor:default}
.dg{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:14px;align-items:start}.dg>*{min-width:0}
table.rt{border-collapse:collapse;font-size:12px;width:100%;background:var(--card)}.rt th,.rt td{padding:3px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.rt th{color:var(--mut);font-weight:600}.rt .l{text-align:left}.rt tr.gap td{background:var(--warns)}.rt tr.add td{background:var(--oks)}.rt tr.no td{color:var(--mut)}.rt tr.tt td{font-weight:700;border-top:2px solid var(--line)}
.gets{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 9px;margin-bottom:6px}
.gets .t{font-weight:700}.gets .w{color:var(--warn);font-size:12px}
.adv{font-size:12.5px;margin:0 0 8px;line-height:1.5}.okc{color:var(--ok);font-weight:600}.short{color:var(--warn)}
.msg{padding:40px 16px;text-align:center}
svg.sh{flex:none;color:var(--ink)}
textarea{width:100%;font:12px/1.35 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);padding:6px}
@media (max-width:820px){
 .orow{display:grid!important;grid-template-columns:20px repeat(4,1fr)!important;grid-template-areas:"i o o o o" ". n d h x" ". q q q q" ". p p p p" ". g g r r";gap:3px 6px;padding:7px 10px}
 .orow>*{display:none}
 .orow>.c-i{display:block;grid-area:i}.orow>.c-o{display:block;grid-area:o}.orow>.c-n{display:block;grid-area:n}.orow>.c-d{display:block;grid-area:d}.orow>.c-h{display:block;grid-area:h}
 .orow>.c-x{display:block;grid-area:x}.orow>.c-q{display:block;grid-area:q}.orow>.c-p{display:flex!important;grid-area:p;gap:10px;flex-wrap:wrap}.orow>.c-g{display:block;grid-area:g}.orow>.c-r{display:block;grid-area:r}
 .orow .num:before{content:attr(data-l);display:block;font-size:10px;color:var(--mut);font-weight:400}
 .orow .pk:before{content:attr(data-l);font-size:10px;color:var(--mut);margin-right:3px}
 .orow.head{display:none!important}
 .orow.sub>.c-i{display:none}
 .nm{display:block;margin-left:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .det{padding:8px 10px 12px}.dg{grid-template-columns:1fr}
 .ct .hm{display:none}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg muted">Opening…</div></div>
<script>
(function(){
"use strict";
var SK={k:"lane",d:1},D,KEYHEX,STORE,BR="AD",U={},OPEN={},F={q:"",r:"",s:"",g:false},O=[],BY={},C=[],DEST={},GOT={},NG={},RB={},PJ={},CODES=[],AV={};
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(n){return n?(Math.round(n)||0).toLocaleString("en-US"):"–";}
function x1(v){return v==null?"–":v.toFixed(1);}
function sm(m){var t=0;Object.keys(m).forEach(function(k){t+=m[k];});return t;}
function pm(s){var m={};(s||"").split(";").forEach(function(p){if(!p)return;var e=p.split(":");m[e[0]]=+e[1];});return m;}
function shape(r,s){s=s||15;var h='<svg class="sh" width="'+s+'" height="'+s+'" viewBox="0 0 20 20" aria-label="'+r+'">';
  if(r==="CE")h+='<circle cx="10" cy="10" r="9.5" fill="currentColor"/>';
  else if(r==="NO")h+='<polygon points="10,0.5 19.5,19.5 0.5,19.5" fill="currentColor"/>';
  else if(r==="SO")h+='<rect x="1.4" y="1.4" width="17.2" height="17.2" fill="none" stroke="currentColor" stroke-width="2.4"/>';
  else if(r==="EC")h+='<polygon points="10,0.3 19.7,10 10,19.7 0.3,10" fill="currentColor"/>';
  else if(r==="EM")h+='<circle cx="10" cy="10" r="8.4" fill="none" stroke="currentColor" stroke-width="2.6"/>';
  return h+'</svg>';}
function boot(){
  O=D.o.map(function(r){return {code:r[0],name:r[1],sup:r[2],rg:r[3],brand:r[4],lane:r[5],sold:r[6],sA:r[7],sK:r[8],nA:r[9],nK:r[10],oA:r[11],oK:r[12],octn:r[13],fA:r[14],fK:r[15],
    sent:r[18],st:r[19],r27:pm(r[20]),rOld:pm(r[21]),r25o:pm(r[23])};});
  O.forEach(function(o){o.nw=o.nA+o.nK;o.old=o.oA+o.oK;o.o26=sm(o.rOld);o.o25=sm(o.r25o);o.fl=o.fA+o.fK;o.have=o.nw+o.old+o.fl;o.tg=D.target[o.code]||0;BY[o.code]=o;PJ[o.code]=pm(D.packs[o.code]);});
  C=D.c.map(function(r){return {id:r[0],brand:r[1],type:r[2],pcs:r[3],kids:r[4],wave:r[5],acs:r[6],code:r[7],col:r[8]};});
  CODES=Object.keys(D.codes).sort(function(a,b){var x=D.codes[a],y=D.codes[b];return x.brand<y.brand?-1:x.brand>y.brand?1:D.ranges.indexOf(x.rng)-D.ranges.indexOf(y.rng);});
  CODES.forEach(function(d){AV[D.codes[d].brand+D.codes[d].rng]=1;});
  STORE="bm25alloc2:"+D.ver;
  try{var s=JSON.parse(localStorage.getItem(STORE)||"{}");U=s.u||{};if(s.b)BR=s.b;}catch(e){}
  render();
}
function save(){try{localStorage.setItem(STORE,JSON.stringify({u:U,b:BR}));}catch(e){}}
function pk(c,d){return (U[c]&&d in U[c])?U[c][d]:(PJ[c][d]||0);}
function setpk(c,d,n){n=Math.max(0,Math.min(4,n));U[c]=U[c]||{};if(n===(PJ[c][d]||0))delete U[c][d];else U[c][d]=n;if(!Object.keys(U[c]).length)delete U[c];save();render();}
/* packs -> cartons, same steps as bm25_proj.assign(): bigger outlets first; exactly one carton of every colour per pack
   (kids-carrying family carton for an outlet that sells kids). Cartons not in a pack stay in WH. */
function alloc(){
  DEST={};GOT={};NG={};RB={};O.forEach(function(o){GOT[o.code]=0;NG[o.code]=0;RB[o.code]={};});
  var by={};C.slice().sort(function(a,b){return (b.kids-a.kids)||(a.id<b.id?-1:1);}).forEach(function(x){((by[x.code]=by[x.code]||{})[x.col]=by[x.code][x.col]||[]).push(x);});
  function put(x,c){DEST[x.id]=c;GOT[c]+=x.pcs;NG[c]++;RB[c][x.code]=(RB[c][x.code]||0)+x.pcs;}
  var order=O.filter(function(o){return CODES.some(function(d){return pk(o.code,d)>0;});}).sort(function(a,b){return (b.sold-a.sold)||(a.code<b.code?-1:1);});
  Object.keys(by).sort().forEach(function(d){var mx=0;order.forEach(function(o){mx=Math.max(mx,pk(o.code,d));});
    for(var r=1;r<=mx;r++)order.forEach(function(o){if(pk(o.code,d)<r)return;var kd=!!o.sK;
      Object.keys(by[d]).sort().forEach(function(col){var L=by[d][col];if(!L.length)return;var i=0;for(var j=0;j<L.length;j++)if(!!L[j].kids===kd){i=j;break;}
        put(L.splice(i,1)[0],o.code);});});});
  Object.keys(by).forEach(function(d){Object.keys(by[d]).forEach(function(col){by[d][col].forEach(function(x){DEST[x.id]="";});});});   /* not in a pack = stays in WH */
}
function hr(o,r){return (o.r27[r]||0)+(o.rOld[r]||0)+(o.r25o[r]||0);}
function rb(o,r){var t=0;CODES.forEach(function(d){if(D.codes[d].rng===r)t+=RB[o.code][d]||0;});return t;}
function gaps(o){return D.ranges.filter(function(r){return hr(o,r)+rb(o,r)<D.miss&&AV[o.brand+r];});}
function chips(o){return '<div class="rch">'+D.ranges.map(function(r){var h=hr(o,r),b=rb(o,r),cl,t;
    if(h>=D.miss){cl="has";t="has "+h+" pcs in BM 2027 / 2026"+(b?" + BM 2025 "+b:"");}
    else if(h+b>=D.miss){cl="add";t="BM 2025 brings it ("+b+" pcs)";}
    else if(AV[o.brand+r]){cl="gap";t="missing - a BM 2025 code has it";}
    else{cl="no";t="missing - not in BM 2025 "+o.brand;}
    return '<span class="rc '+cl+'" title="'+esc(D.rname[r]+": "+t)+'">'+r+'</span>';}).join("")+'</div>';}
function bcodes(){return CODES.filter(function(d){return D.codes[d].brand===BR;});}
function tot(list){var t={n:list.length,sold:0,nw:0,old:0,o26:0,fl:0,have:0,g:0,ng:0,gp:0};
  list.forEach(function(o){t.o26+=o.o26;t.sold+=o.sold;t.nw+=o.nw;t.old+=o.old;t.fl+=o.fl;t.have+=o.have;t.g+=GOT[o.code];t.ng+=NG[o.code];if(o.sold&&gaps(o).length)t.gp++;});return t;}
function shown(){var q=F.q.trim().toUpperCase();return O.filter(function(o){if(o.brand!==BR)return false;if(F.r&&o.rg!==F.r)return false;if(F.s&&o.sup!==F.s)return false;
  if(F.g&&!(o.sold&&gaps(o).length))return false;if(q&&(o.code+" "+o.name+" "+o.sup+" "+o.lane).toUpperCase().indexOf(q)<0)return false;return true;});}
function grid(){return "20px 40px minmax(170px,1.8fr) repeat(5,minmax(48px,.45fr)) 92px "+bcodes().map(function(){return "74px";}).join(" ")+" repeat(3,minmax(52px,.45fr))";}
function th(k,lab,cls,tip){var on=SK.k===k;return '<div class="srt '+(cls||"")+(on?" on":"")+'" data-sort="'+k+'" title="'+esc(tip||"Sort")+'">'+lab+(on?(SK.d>0?" ▲":" ▼"):"")+'</div>';}
function head(){return '<div class="orow head" style="grid-template-columns:'+grid()+'"><div class="c-i"></div>'+th("lane","Lane","","Sort by lane (region blocks)")+th("code","Outlet","c-o")+
  th("sold","Sold 2026","num","BM sold in 2026")+th("nw","BM 2027","num","BM 2027 new arrival sets")+th("o26","BM 2026","num","BM 2026 stock allocated (old stock)")+
  th("have","Total now","num","BM 2027 + BM 2026 + BM on the counter")+th("cov","Cover now","num","Total now / 2026 sold")+'<div>Ranges</div>'+
  bcodes().map(function(d){var k=D.codes[d];return '<div class="hd2">'+esc(k.rng)+'<span class="ak2">'+esc(d)+'</span></div>';}).join("")+
  th("b25","BM 2025","num","BM 2025 you are allocating now")+th("raya","Raya total","num")+th("cova","Cover after","num")+'</div>';}
function skey(o){var g=GOT[o.code];return {lane:o.lane||"zz",code:o.code,sold:o.sold,nw:o.nw,o26:o.o26,have:o.have,cov:o.sold?o.have/o.sold:1e9,b25:g,raya:o.have+g,cova:o.sold?(o.have+g)/o.sold:1e9}[SK.k];}
function row(o){var g=GOT[o.code],chg=!!U[o.code];
  return '<div class="orow'+(chg?" chg":"")+'" data-o="'+o.code+'" style="grid-template-columns:'+grid()+'"><div class="c-i">'+shape(o.rg)+'</div><div class="c-l">'+esc(o.lane||"–")+'</div>'+
   '<div class="c-o"><span class="code">'+esc(o.code)+'</span><span class="nm">'+esc(o.name)+'</span><span class="ak2">'+esc(o.sup)+'</span></div>'+
   '<div class="c-s num" data-l="Sold 2026">'+fmt(o.sold)+'<span class="ak2">'+(o.st?Math.round(o.st*100)+"% sold":"")+'</span></div>'+
   '<div class="c-n num" data-l="BM 2027">'+fmt(o.nw)+'</div><div class="c-d num" data-l="BM 2026">'+fmt(o.o26)+'</div>'+
   '<div class="c-h num" data-l="Total now" title="BM 2027 '+fmt(o.nw)+' + BM 2026 '+fmt(o.o26)+(o.o25?' + BM 2025 already '+fmt(o.o25):"")+' + counter '+fmt(o.fl)+'">'+fmt(o.have)+'</div><div class="c-x num" data-l="Cover now">'+x1(o.sold?o.have/o.sold:null)+'</div><div class="c-q">'+chips(o)+'</div>'+
   '<div class="c-p" style="display:contents">'+bcodes().map(function(d){var n=pk(o.code,d),ch=U[o.code]&&d in U[o.code];
     return '<div class="pk'+(ch?" chg":"")+'" data-l="'+esc(D.codes[d].rng)+'"><button data-dn="'+o.code+'|'+d+'" aria-label="less">−</button><b class="'+(n?"":"z")+'">'+n+'</b><button data-up="'+o.code+'|'+d+'" aria-label="more">+</button></div>';}).join("")+'</div>'+
   '<div class="c-g num" data-l="BM 2025"><b>'+fmt(g)+'</b><span class="ak2">'+(NG[o.code]?NG[o.code]+" ctn":"")+(o.o25?(NG[o.code]?" · ":"")+"+"+fmt(o.o25)+" before":"")+'</span></div>'+
   '<div class="c-r num" data-l="Raya total">'+fmt(o.have+g)+'</div><div class="c-x2 num" data-l="Cover after">'+x1(o.sold?(o.have+g)/o.sold:null)+'</div></div>'+(OPEN[o.code]?detail(o):"");}
function subrow(lab,t,ic){return '<div class="orow sub" style="grid-template-columns:'+grid()+'"><div class="c-i">'+(ic?shape(ic):"")+'</div><div></div><div class="c-o">'+lab+' <span class="nm">'+t.n+' outlets</span></div>'+
  '<div class="c-s num" data-l="Sold 2026">'+fmt(t.sold)+'</div><div class="c-n num" data-l="BM 2027">'+fmt(t.nw)+'</div><div class="c-d num" data-l="BM 2026">'+fmt(t.o26)+'</div><div class="c-h num" data-l="Total now">'+fmt(t.have)+'</div>'+
  '<div class="c-x num" data-l="Cover now">'+x1(t.sold?t.have/t.sold:null)+'</div><div class="c-q small muted">'+(t.gp?t.gp+" missing a range":"")+'</div>'+bcodes().map(function(){return "<div></div>";}).join("")+
  '<div class="c-g num" data-l="BM 2025">'+fmt(t.g)+'<span class="ak2">'+t.ng+' ctn</span></div><div class="c-r num" data-l="Raya total">'+fmt(t.have+t.g)+'</div><div class="c-x2 num">'+x1(t.sold?(t.have+t.g)/t.sold:null)+'</div></div>';}
function gets(o){var L=bcodes().filter(function(d){return RB[o.code][d];});if(!L.length)return '<div class="muted small">No BM 2025 for this outlet. Press + on a code to give it one colour pack.</div>';
  return L.map(function(d){var k=D.codes[d],cs=C.filter(function(x){return DEST[x.id]===o.code&&x.code===d;}),cc={};cs.forEach(function(x){cc[x.col]=(cc[x.col]||0)+1;});
    var miss=k.cols.filter(function(c){return !cc[c];}),n=pk(o.code,d);
    return '<div class="gets"><div class="t">'+esc(d)+' '+esc(D.rname[k.rng])+' · '+n+' pack'+(n===1?"":"s")+' · '+cs.length+' ctn · '+fmt(RB[o.code][d])+' pcs</div>'+
      '<div class="cols" style="margin-top:3px">'+k.cols.map(function(c){return '<span class="cl'+(cc[c]?"":" out")+'">'+esc(c)+(cc[c]>1?" ×"+cc[c]:"")+'</span>';}).join("")+'</div>'+
      (miss.length?'<div class="w">Colour '+miss.join(", ")+' has run out for this outlet</div>':'<div class="small muted">all '+k.cols.length+' colours</div>')+'</div>';}).join("");}
function rtable(o){var A=0,B=0,Cc=0,h='<table class="rt"><tr><th class="l">Range</th><th>BM 2027</th><th>BM 2026</th><th>BM 2025</th><th>Total</th></tr>';
  D.ranges.forEach(function(r){var a=o.r27[r]||0,b=o.rOld[r]||0,c=rb(o,r)+(o.r25o[r]||0),t=a+b+c;A+=a;B+=b;Cc+=c;
    h+='<tr class="'+(t<D.miss?(AV[o.brand+r]?"gap":"no"):(hr(o,r)<D.miss?"add":""))+'"><td class="l">'+r+' '+esc(D.rname[r])+'</td><td>'+fmt(a)+'</td><td>'+fmt(b)+'</td><td>'+fmt(c)+'</td><td><b>'+fmt(t)+'</b></td></tr>';});

function readKey(){var h=(location.hash||"").replace(/^#/,"").split("&")[0].trim();return /^[0-9a-fA-F]{64}$/.test(h)?h.toLowerCase():null;}
function hexToBytes(h){var o=new Uint8Array(h.length/2);for(var i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o;}
function b64(s){var b=atob(s),o=new Uint8Array(b.length);for(var i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;}

crypto.subtle.digest("SHA-256",new TextEncoder().encode(KEYHEX)).then(function(buf){
  var b=new Uint8Array(buf),id="";for(var i=0;i<8;i++)id+=(b[i]<16?"0":"")+b[i].toString(16);
  return Promise.all([fetch("k/"+id+".json",{cache:"no-store"}),crypto.subtle.importKey("raw",hexToBytes(KEYHEX),{name:"AES-GCM"},false,["decrypt"])]);
}).then(function(r){if(!r[0].ok)throw new Error("missing");return r[0].json().then(function(doc){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(doc.iv),tagLength:128},r[1],b64(doc.ct));});
}).then(function(buf){D=JSON.parse(new TextDecoder().decode(buf));boot();},function(){fail("Couldn't open this page.");});
