<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>BM 2025 Allocation</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202c;--mut:#5d6b7a;--line:#dde2e8;--acc:#1f3864;--accs:#e7ecf5;--warn:#b54708;--warns:#fdf0e3;--ok:#067647;--oks:#e5f4ec;--bad:#b42318;--bads:#fbeaea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--card:#18202a;--ink:#e6ebf1;--mut:#97a3b0;--line:#2a3542;--acc:#8fb0e8;--accs:#1f2b3d;--warn:#f3a35c;--warns:#3a2817;--ok:#5fd39a;--oks:#14301f;--bad:#f28b82;--bads:#3a1c1c}}
:root[data-theme="dark"]{--bg:#0f141a;--card:#18202a;--ink:#e6ebf1;--mut:#97a3b0;--line:#2a3542;--acc:#8fb0e8;--accs:#1f2b3d;--warn:#f3a35c;--warns:#3a2817;--ok:#5fd39a;--oks:#14301f;--bad:#f28b82;--bads:#3a1c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:8px 16px 40px}
h1{font-size:16px;margin:2px 0 0}h2{font-size:14px;margin:0}
.muted{color:var(--mut)}.small{font-size:12px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:5px 0;border-bottom:1px solid var(--line)}
.stats{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.stat b{font-size:13px}.stat.warn{background:var(--warns);border-color:var(--warn)}.stat.ok{background:var(--oks);border-color:var(--ok)}
.ak{display:block;font-size:11px;color:var(--mut);font-weight:400;white-space:nowrap}
.ctl{display:flex;flex-wrap:wrap;gap:4px;align-items:center;margin-top:4px}
select,input,button{font:inherit;font-size:12px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
button{cursor:pointer;background:var(--accs);border-color:var(--acc);color:var(--acc);font-weight:600}
button.pri{background:var(--acc);color:var(--card)}button.on{background:var(--acc);color:var(--card)}
input[type=search]{min-width:150px;flex:1}
.tabs{display:flex;gap:4px}.tabs button{font-size:13px;padding:4px 12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden}
.ph{padding:8px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.orow{display:grid;grid-template-columns:20px 44px minmax(190px,2fr) 50px repeat(6,minmax(48px,.5fr)) 84px repeat(3,minmax(52px,.5fr));gap:5px;align-items:center;padding:4px 10px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.orow:hover{background:var(--accs)}
.orow.head{position:sticky;top:0;z-index:3;font-size:11px;color:var(--mut);font-weight:600;background:var(--accs);cursor:default;align-items:end}
.orow.sub{background:var(--bg);font-weight:700;cursor:default}
.orow.chg{background:var(--warns)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.code{font-weight:700}.nm{color:var(--mut);margin-left:5px}
.b25{font-weight:700}
.tg input{width:100%;text-align:right;font-weight:700}
.tg input.set{border-color:var(--warn);background:var(--warns)}
.short{color:var(--warn)}
.ak2{display:block;font-size:10px;color:var(--mut);font-weight:400}
.det{padding:8px 12px 12px 36px;background:var(--bg);border-bottom:1px solid var(--line);cursor:default}
.g25{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:5px}
.ct{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 7px}.ct.pin{background:var(--warns);border-color:var(--warn)}
.ct .small{overflow-wrap:anywhere;margin:2px 0 4px}.ct select{width:100%}
.wv{margin:8px 0 2px;font-weight:700}
.msg{padding:40px 16px;text-align:center}
svg.sh{flex:none;color:var(--ink)}
textarea{width:100%;font:12px/1.35 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);padding:6px}
.help{font-size:12px;color:var(--mut);margin:4px 0 0;line-height:1.45}
@media (min-width:821px) and (max-width:1180px){
 .orow{grid-template-columns:20px 44px minmax(170px,2fr) repeat(4,minmax(46px,.5fr)) 80px repeat(2,minmax(50px,.5fr))}
 .orow>.c-u,.orow>.c-f,.orow>.c-h,.orow>.c-x2{display:none}
}
@media (max-width:820px){
 .bar{position:static}
 .orow{grid-template-columns:20px repeat(4,1fr);grid-template-areas:"i o o o o" ". s h x t" ". g b r r";gap:3px 6px;padding:6px 10px}
 .orow>*{display:none}
 .orow>.c-i{display:block;grid-area:i}.orow>.c-o{display:block;grid-area:o}.orow>.c-s{display:block;grid-area:s}.orow>.c-h{display:block;grid-area:h}
 .orow>.c-x{display:block;grid-area:x}.orow>.tg{display:block;grid-area:t}.orow>.c-g{display:block;grid-area:g}.orow>.c-b{display:block;grid-area:b}.orow>.c-r{display:block;grid-area:r}
 .orow .num:before{content:attr(data-l);display:block;font-size:10px;color:var(--mut);font-weight:400}
 .orow.head{display:none}
 .orow.sub{grid-template-areas:"o o o o o" ". s h x x" ". g b r r"}.orow.sub>.c-i{display:none}
 .nm{display:block;margin-left:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .det{padding:8px 10px 12px}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg muted">Opening…</div></div>
<script>
(function(){
"use strict";
var D,KEYHEX,STORE,BR="AD",VIEW="o",T={},PIN={},OPEN={},F={q:"",r:"",s:"",w:""},O=[],BY={},C=[],DEST={},GOT={},NG={};
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(n){return n?(Math.round(n)||0).toLocaleString("en-US"):"–";}
function x1(v){return v==null?"–":v.toFixed(1);}
function isKid(a){return (a.indexOf("1902")===0&&a.charAt(5)==="5")||(a.indexOf("392")===0&&a.charAt(4)==="5");}
function shape(r,s){s=s||15;var h='<svg class="sh" width="'+s+'" height="'+s+'" viewBox="0 0 20 20" aria-label="'+r+'">';
  if(r==="CE")h+='<circle cx="10" cy="10" r="9.5" fill="currentColor"/>';
  else if(r==="NO")h+='<polygon points="10,0.5 19.5,19.5 0.5,19.5" fill="currentColor"/>';
  else if(r==="SO")h+='<rect x="1.4" y="1.4" width="17.2" height="17.2" fill="none" stroke="currentColor" stroke-width="2.4"/>';
  else if(r==="EC")h+='<polygon points="10,0.3 19.7,10 10,19.7 0.3,10" fill="currentColor"/>';
  else if(r==="EM")h+='<circle cx="10" cy="10" r="8.4" fill="none" stroke="currentColor" stroke-width="2.6"/>';
  return h+'</svg>';}
function boot(){
  O=D.o.map(function(r){return {code:r[0],name:r[1],sup:r[2],rg:r[3],brand:r[4],lane:r[5],sold:r[6],sA:r[7],sK:r[8],nA:r[9],nK:r[10],oA:r[11],oK:r[12],octn:r[13],fA:r[14],fK:r[15],seen:r[17]?r[17].split(";"):[]};});
  O.forEach(function(o){o.nw=o.nA+o.nK;o.old=o.oA+o.oK;o.fl=o.fA+o.fK;o.have=o.nw+o.old+o.fl;o.sset={};o.seen.forEach(function(a){o.sset[a]=1;});o.proj=0;BY[o.code]=o;});
  C=D.c.map(function(r){return {id:r[0],brand:r[1],type:r[2],pcs:r[3],kids:r[4],wave:r[5],acs:r[6].split(";").map(function(p){var e=p.split(":");return {ac:e[0],q:+e[1]};}),orig:r[7]};});
  C.forEach(function(x){if(BY[x.orig])BY[x.orig].proj+=x.pcs;});   /* start = the projection's placed pcs */
  STORE="bm25alloc:"+D.ver;
  try{var s=JSON.parse(localStorage.getItem(STORE)||"{}");T=s.t||{};PIN=s.p||{};if(s.b)BR=s.b;}catch(e){}
  render();
}
function save(){try{localStorage.setItem(STORE,JSON.stringify({t:T,p:PIN,b:BR}));}catch(e){}}
function tgt(o){return o.code in T?T[o.code]:o.proj;}
/* spread cartons over the targets: pinned first, then kids-heavy cartons first, each to the same-brand outlet with the
   biggest gap that still fits at least half the carton; art-cols the outlet already has and kids to non-kids outlets cost points */
function alloc(){
  DEST={};GOT={};NG={};var seen={};O.forEach(function(o){GOT[o.code]=0;NG[o.code]=0;seen[o.code]=Object.assign({},o.sset);});
  function put(x,c){DEST[x.id]=c;if(!c)return;GOT[c]+=x.pcs;NG[c]++;x.acs.forEach(function(a){seen[c][a.ac]=1;});}
  C.forEach(function(x){if(x.id in PIN)put(x,PIN[x.id]);});
  var rest=C.filter(function(x){return !(x.id in PIN);}).sort(function(a,b){return (b.kids-a.kids)||(a.id<b.id?-1:1);});
  ["AD","BF"].forEach(function(br){var cs=O.filter(function(o){return o.brand===br;});
    rest.filter(function(x){return x.brand===br;}).forEach(function(x){var best=null,bs=-1e9;
      cs.forEach(function(o){var gap=tgt(o)-GOT[o.code];if(gap<x.pcs/2)return;
        var rep=x.acs.reduce(function(s,a){return s+(seen[o.code][a.ac]?a.q:0);},0)/x.pcs,sc=gap-60*rep-((x.kids&&!o.sK)?40:0);
        if(sc>bs){bs=sc;best=o.code;}});
      put(x,best||"");});});
}
function tot(list){var t={n:list.length,sold:0,nw:0,old:0,fl:0,have:0,t:0,g:0,ng:0};
  list.forEach(function(o){t.sold+=o.sold;t.nw+=o.nw;t.old+=o.old;t.fl+=o.fl;t.have+=o.have;t.t+=tgt(o);t.g+=GOT[o.code];t.ng+=NG[o.code];});return t;}
function shown(){var q=F.q.trim().toUpperCase();return O.filter(function(o){if(o.brand!==BR)return false;if(F.r&&o.rg!==F.r)return false;if(F.s&&o.sup!==F.s)return false;
  if(q&&(o.code+" "+o.name+" "+o.sup+" "+o.lane).toUpperCase().indexOf(q)<0)return false;return true;});}
var HEAD=[["c-i",""],["c-l","Lane"],["c-o","Outlet"],["c-u","Sup"],["c-s num","Sold 26"],["c-n num","New 27"],["c-d num","Old v16"],["c-f num","Counter"],["c-h num","Has now"],["c-x num","Cover now"],["tg num","BM25 target"],["c-g num","BM25 placed"],["c-r num","Raya total"],["c-x2 num","Cover after"]];
function row(o){var t=tgt(o),g=GOT[o.code],cv=o.sold?o.have/o.sold:null,ca=o.sold?(o.have+g)/o.sold:null,short=t-g;
  return '<div class="orow'+(o.code in T?" chg":"")+'" data-o="'+o.code+'"><div class="c-i">'+shape(o.rg)+'</div><div class="c-l">'+esc(o.lane||"–")+'</div>'+
   '<div class="c-o"><span class="code">'+esc(o.code)+'</span><span class="nm">'+esc(o.name)+'</span></div><div class="c-u">'+esc(o.sup)+'</div>'+
   '<div class="c-s num" data-l="Sold 26">'+fmt(o.sold)+(o.sK?'<span class="ak2">kids '+fmt(o.sK)+'</span>':"")+'</div>'+
   '<div class="c-n num" data-l="New 27">'+fmt(o.nw)+'</div><div class="c-d num" data-l="Old v16">'+fmt(o.old)+'</div><div class="c-f num" data-l="Counter">'+fmt(o.fl)+'</div>'+
   '<div class="c-h num" data-l="Has now">'+fmt(o.have)+'</div><div class="c-x num" data-l="Cover now">'+x1(cv)+'</div>'+
   '<div class="tg num" data-l="BM25 target"><input type="number" min="0" step="30" inputmode="numeric" data-tg="'+o.code+'" class="'+(o.code in T?"set":"")+'" value="'+t+'" title="projection '+o.proj+'"></div>'+
   '<div class="c-g num b25" data-l="BM25 placed">'+fmt(g)+'<span class="ak2'+(short>=15?" short":"")+'">'+NG[o.code]+' ctn'+(short>=15?' · '+fmt(short)+' short':"")+'</span></div>'+
   '<div class="c-r num" data-l="Raya total">'+fmt(o.have+g)+'</div><div class="c-x2 num" data-l="Cover after">'+x1(ca)+'</div></div>'+(OPEN[o.code]?detail(o):"");}
function subrow(lab,t,ic){return '<div class="orow sub"><div class="c-i">'+(ic?shape(ic):"")+'</div><div class="c-l"></div><div class="c-o">'+lab+' <span class="nm">'+t.n+' outlets</span></div><div class="c-u"></div>'+
  '<div class="c-s num" data-l="Sold 26">'+fmt(t.sold)+'</div><div class="c-n num" data-l="New 27">'+fmt(t.nw)+'</div><div class="c-d num" data-l="Old v16">'+fmt(t.old)+'</div><div class="c-f num" data-l="Counter">'+fmt(t.fl)+'</div>'+
  '<div class="c-h num" data-l="Has now">'+fmt(t.have)+'</div><div class="c-x num" data-l="Cover now">'+x1(t.sold?t.have/t.sold:null)+'</div><div class="tg num" data-l="BM25 target">'+fmt(t.t)+'</div>'+
  '<div class="c-g num" data-l="BM25 placed">'+fmt(t.g)+'<span class="ak2">'+t.ng+' ctn</span></div><div class="c-r num" data-l="Raya total">'+fmt(t.have+t.g)+'</div><div class="c-x2 num" data-l="Cover after">'+x1(t.sold?(t.have+t.g)/t.sold:null)+'</div></div>';}
function arts(x){return x.acs.map(function(a){var i=a.ac.lastIndexOf("-");return esc(a.ac)+(isKid(a.ac.slice(0,i))?" kids":"")+" "+a.q;}).join(" · ");}
function sel(x){var h='<select data-mv="'+x.id+'"><option value="">— not placed —</option>';
  O.forEach(function(p){if(p.brand===x.brand)h+='<option value="'+p.code+'"'+(p.code===DEST[x.id]?" selected":"")+'>'+p.code+(p.lane?" "+p.lane:"")+'</option>';});return h+'</select>';}
function card(x){var pn=x.id in PIN,o=BY[DEST[x.id]],rep=o?x.acs.filter(function(a){return o.sset[a.ac];}).length:0;
  return '<div class="ct'+(pn?" pin":"")+'"><b>'+esc(x.id)+'</b> <span class="muted small">'+esc(x.type.toLowerCase())+' · '+x.pcs+' pcs'+(x.kids?' ('+x.kids+' kids)':"")+(pn?' · pinned':"")+(rep?' · <span class="short">already has '+rep+' art-col</span>':"")+'</span>'+
    '<div class="small">'+arts(x)+'</div>'+sel(x)+(pn?'<button data-unpin="'+x.id+'" style="margin-top:4px">Unpin</button>':"")+'</div>';}
function detail(o){var cs=C.filter(function(x){return DEST[x.id]===o.code;});
  return '<div class="det"><div class="muted small" style="margin-bottom:6px">'+esc(o.code)+' '+esc(o.name)+' · sold 2026 adult '+fmt(o.sA)+' / kids '+fmt(o.sK)+
    ' · new 2027 adult '+fmt(o.nA)+' / kids '+fmt(o.nK)+' · old v16 adult '+fmt(o.oA)+' / kids '+fmt(o.oK)+' ('+o.octn+' ctn) · counter '+fmt(o.fl)+
    ' · projection '+fmt(o.proj)+' BM25 pcs</div>'+(cs.length?'<div class="g25">'+cs.map(card).join("")+'</div>':'<div class="muted small">No BM 2025 cartons. Type a target above to give it some.</div>')+'</div>';}
function render(){
  alloc();
  var BO=O.filter(function(o){return o.brand===BR;}),BT=tot(BO),BC=C.filter(function(x){return x.brand===BR;}),pool=BC.reduce(function(s,x){return s+x.pcs;},0),
      U=BC.filter(function(x){return !DEST[x.id];}),up=U.reduce(function(s,x){return s+x.pcs;},0),sups={};BO.forEach(function(o){sups[o.sup]=1;});
  var nch=Object.keys(T).length+Object.keys(PIN).length;
  var h='<div class="bar"><h1>BM 2025: allocate to outlets</h1><div class="muted small">BM 2025 cartons on the sorter now · on top of BM 2027 old stock '+esc(D.ver)+' (final) + new 2027 sets + counter · built '+esc(D.built)+'</div>'+
   '<div class="ctl"><div class="tabs"><button data-br="AD" class="'+(BR==="AD"?"on":"")+'">AD</button><button data-br="BF" class="'+(BR==="BF"?"on":"")+'">BF</button></div>'+
   '<span class="muted small">pools are per brand</span></div>'+
   '<div class="stats"><div class="stat">BM 2025 '+BR+' <b>'+fmt(pool)+'</b> pcs<span class="ak">'+BC.length+' cartons</span></div>'+
   '<div class="stat '+(up?"warn":"ok")+'">Placed <b>'+fmt(pool-up)+'</b><span class="ak">not placed '+fmt(up)+' pcs / '+U.length+' ctn</span></div>'+
   '<div class="stat'+(BT.t>pool?" warn":"")+'">Targets <b>'+fmt(BT.t)+'</b><span class="ak">'+(BT.t>pool?"over the pool by "+fmt(BT.t-pool):BT.t<pool?"under the pool by "+fmt(pool-BT.t):"= pool")+'</span></div>'+
   '<div class="stat">Already for Raya <b>'+fmt(BT.have)+'</b><span class="ak">new 27 '+fmt(BT.nw)+' · old v16 '+fmt(BT.old)+' · counter '+fmt(BT.fl)+'</span></div>'+
   '<div class="stat">Raya total <b>'+fmt(BT.have+BT.g)+'</b><span class="ak">cover '+x1(BT.sold?BT.have/BT.sold:null)+' → '+x1(BT.sold?(BT.have+BT.g)/BT.sold:null)+' x 2026 sold</span></div>'+
   '<div class="stat'+(nch?" warn":"")+'">Changes <b>'+nch+'</b><span class="ak">'+Object.keys(T).length+' targets · '+Object.keys(PIN).length+' pinned</span></div></div>'+
   '<div class="ctl"><button data-v="o" class="'+(VIEW==="o"?"on":"")+'">By outlet</button><button data-v="c" class="'+(VIEW==="c"?"on":"")+'">By carton</button>'+
   '<input type="search" id="fq" placeholder="'+(VIEW==="o"?"Search outlet, name, supervisor":"Search carton, art, outlet")+'" value="'+esc(F.q)+'">'+
   '<select id="fr"><option value="">All regions</option>'+D.regions.map(function(r){return '<option value="'+r+'"'+(F.r===r?" selected":"")+'>'+r+' '+esc(D.words[r][0])+'</option>';}).join("")+'</select>'+
   (VIEW==="o"?'<select id="fs"><option value="">All supervisors</option>'+Object.keys(sups).sort().map(function(s){return '<option'+(F.s===s?" selected":"")+'>'+esc(s)+'</option>';}).join("")+'</select>':"")+
   '<label class="small">Fill to cover <input type="number" id="cov" step="0.1" min="0" style="width:58px" placeholder="x"></label><button id="fill">Set targets</button><button id="fit" title="find the one cover that uses up the whole BM 2025 pool">Fit to pool</button>'+
   '<button class="pri" id="copy">Copy for group</button><button id="csv">CSV</button><button id="proj">Back to projection</button></div>'+
   '<div class="help">Type a <b>BM25 target</b> (pcs) for an outlet: cartons are moved in at once, whole cartons only (~30 pcs). 0 = no BM 2025. '+
   '<b>Fit to pool</b> finds the one cover that uses the whole pool. <b>Fill to cover</b> sets every '+BR+' target so has-now + BM25 = that many times 2026 sold. Tap an outlet to see or pin its cartons.</div></div>';
  if(VIEW==="o"){var list=shown();
    h+='<div class="panel"><div class="orow head">'+HEAD.map(function(c){return '<div class="'+c[0]+'">'+c[1]+'</div>';}).join("")+'</div>';
    if(!list.length)h+='<div class="msg muted">No outlet matches.</div>';
    D.regions.forEach(function(r){var g=list.filter(function(o){return o.rg===r;});if(!g.length)return;g.forEach(function(o){h+=row(o);});h+=subrow(r+" "+esc(D.words[r][0]),tot(g),r);});
    if(list.length)h+=subrow("TOTAL "+BR+" shown",tot(list),"");h+='</div>';
    if(U.length)h+='<div class="panel"><div class="ph"><h2>Not placed ('+U.length+' ctn, '+fmt(up)+' pcs)</h2><span class="muted small">raise some targets, or pick an outlet for a carton</span></div><div class="g25" style="padding:8px 12px">'+U.map(card).join("")+'</div></div>';}
  else{var q=F.q.trim().toUpperCase(),cs=BC.filter(function(x){var o=BY[DEST[x.id]];if(F.r&&(!o||o.rg!==F.r))return false;
      return !q||(x.id+" "+(DEST[x.id]||"not placed")+" "+x.acs.map(function(a){return a.ac;}).join(" ")).toUpperCase().indexOf(q)>=0;}),wv={};
    cs.forEach(function(x){(wv[x.wave]=wv[x.wave]||[]).push(x);});
    h+='<div class="panel"><div class="ph"><h2>'+cs.length+' cartons</h2><span class="muted small">grouped by sorter wave (pile)</span></div><div style="padding:4px 12px 12px">'+
      Object.keys(wv).map(function(w){return '<div class="wv">'+esc(w)+' <span class="muted small">'+wv[w].length+' ctn</span></div><div class="g25">'+wv[w].map(card).join("")+'</div>';}).join("")+'</div></div>';}
  h+='<div class="panel" id="outp" style="display:none"><div class="ph"><h2>Copy this to the group</h2></div><div style="padding:8px 12px"><textarea id="ta" rows="12" readonly></textarea></div></div>';
  $("#app").innerHTML=h;
}
function copyText(){var L=["BM 2025 allocation (from page "+D.ver+")"];

  if(t.id==="proj"){if(confirm("Drop all your "+Object.keys(T).length+" targets and "+Object.keys(PIN).length+" pins and go back to the projection?")){T={};PIN={};save();render();}return;}
  if(t.id==="fit"){var BO=O.filter(function(o){return o.brand===BR;}),pool=C.filter(function(x){return x.brand===BR;}).reduce(function(s,x){return s+x.pcs;},0),lo=0,hi=50,f=function(k,o){return Math.max(0,Math.round((k*o.sold-o.have)/30)*30);};

    BO.forEach(function(o){T[o.code]=f(lo,o);});$("#cov").value=lo.toFixed(2);save();render();$("#cov").value=lo.toFixed(2);return;}
  if(t.id==="fill"){var k=+$("#cov").value;if(!(k>0))return;O.forEach(function(o){if(o.brand===BR)T[o.code]=Math.max(0,Math.round((k*o.sold-o.have)/30)*30);});save();render();return;}
  if(t.matches("input,select,button,textarea,label,option")||t.closest(".ct")||t.closest(".det"))return;
  var r=t.closest(".orow[data-o]");if(r){var c=r.dataset.o;if(OPEN[c])delete OPEN[c];else OPEN[c]=1;render();}
});

function readKey(){var h=(location.hash||"").replace(/^#/,"").split("&")[0].trim();return /^[0-9a-fA-F]{64}$/.test(h)?h.toLowerCase():null;}
function hexToBytes(h){var o=new Uint8Array(h.length/2);for(var i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o;}
function b64(s){var b=atob(s),o=new Uint8Array(b.length);for(var i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;}
function fail(t){$("#app").innerHTML='<div class="msg"><h1>'+esc(t)+'</h1><p class="muted">Open the link exactly as it was sent. It must include everything after #.</p></div>';}

  var b=new Uint8Array(buf),id="";for(var i=0;i<8;i++)id+=(b[i]<16?"0":"")+b[i].toString(16);
  return Promise.all([fetch("k/"+id+".json",{cache:"no-store"}),crypto.subtle.importKey("raw",hexToBytes(KEYHEX),{name:"AES-GCM"},false,["decrypt"])]);
}).then(function(r){if(!r[0].ok)throw new Error("missing");return r[0].json().then(function(doc){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(doc.iv),tagLength:128},r[1],b64(doc.ct));});
}).then(function(buf){D=JSON.parse(new TextDecoder().decode(buf));boot();},function(){fail("Couldn't open this page.");});
