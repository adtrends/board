<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Samping Raya 2027</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202c;--mut:#5d6b7a;--line:#dde2e8;--acc:#1f3864;--accs:#e7ecf5;--warn:#b54708;--warns:#fdf0e3;--ok:#067647;--oks:#e5f4ec;--bad:#b42318;--bads:#fbeaea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141a;--card:#18202a;--ink:#e6ebf1;--mut:#97a3b0;--line:#2a3542;--acc:#8fb0e8;--accs:#1f2b3d;--warn:#f3a35c;--warns:#3a2817;--ok:#5fd39a;--oks:#14301f;--bad:#f28b82;--bads:#3a1c1c}}
:root[data-theme="dark"]{--bg:#0f141a;--card:#18202a;--ink:#e6ebf1;--mut:#97a3b0;--line:#2a3542;--acc:#8fb0e8;--accs:#1f2b3d;--warn:#f3a35c;--warns:#3a2817;--ok:#5fd39a;--oks:#14301f;--bad:#f28b82;--bads:#3a1c1c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:8px 16px 40px}
h1{font-size:16px;margin:2px 0 0}
.muted{color:var(--mut)}.small{font-size:12px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:5px 0;border-bottom:1px solid var(--line)}
.stats{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:4px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:2px 7px}
.stat b{font-size:13px}.stat.warn{background:var(--warns);border-color:var(--warn)}
.ctl{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
select,input,button{font:inherit;font-size:12px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
button{cursor:pointer;background:var(--accs);border-color:var(--acc);color:var(--acc);font-weight:600}
button.pri{background:var(--acc);color:var(--card)}
input[type=search]{min-width:150px;flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:6px;overflow:hidden}
.panel h2{font-size:15px;margin:0;padding:9px 12px;border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(150px,1.5fr) repeat(6,minmax(60px,.6fr)) minmax(190px,1.3fr);gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.row.head{font-size:12px;color:var(--mut);font-weight:600;background:var(--accs)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.code{font-weight:700}
.tag{display:inline-block;font-size:10px;border-radius:4px;padding:0 4px;margin-left:3px;border:1px solid var(--line);color:var(--mut)}
.tag.nonew{color:var(--ok);border-color:var(--ok)}.tag.missed{color:var(--acc);border-color:var(--acc)}.tag.out{color:var(--bad);border-color:var(--bad)}
.chg{color:var(--warn);font-weight:700}
.row.nobm{background:var(--bads)}.row.out{opacity:.55}
.acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.acts input{width:84px}
.acts button{padding:5px 8px;font-size:12px}
.acts button.on{background:var(--bad);color:var(--card);border-color:var(--bad)}
.ctns{padding:4px 12px 10px 24px;background:var(--bg);border-bottom:1px solid var(--line)}
.ct{display:grid;grid-template-columns:110px 44px 1fr minmax(150px,220px);gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--line);font-size:13px}
.ct .arts{color:var(--mut);font-size:12px;overflow-wrap:anywhere}
.ct.moved{background:var(--warns)}
.ph{display:none}
.ak{display:block;font-size:11px;color:var(--mut);font-weight:400;white-space:nowrap}
.tot{background:var(--accs);border-radius:6px;padding:2px 4px}
.ct.ao{grid-template-columns:120px 50px 1fr}
.msg{padding:40px 16px;text-align:center}
.orow{display:grid;grid-template-columns:minmax(260px,2.4fr) repeat(6,minmax(50px,.45fr)) 24px;gap:6px;align-items:center;padding:3px 10px;border-bottom:1px solid var(--line);font-size:13px;cursor:pointer}
.orow:hover{background:var(--accs)}
.orow.head{cursor:default;font-size:11px;color:var(--mut);font-weight:600;background:var(--accs);position:sticky;top:0}
.colhead{z-index:4;margin-top:0;border:1px solid var(--line);border-radius:8px 8px 0 0;align-items:end;padding:4px 10px;box-shadow:0 2px 3px rgba(0,0,0,.08)}
.colhead+.panel{margin-top:0;border-top:0;border-radius:0 0 8px 8px}
.colhead .c-o{display:flex;align-items:center;gap:4px;overflow:visible}.colhead .c-o input{flex:1;min-width:120px}
.colhead .num{display:flex;flex-direction:column;align-items:stretch;gap:2px}
.colhead .srt{background:none;border:0;padding:0;color:var(--mut);font-size:11px;font-weight:600;text-align:right;white-space:nowrap}
.colhead .srt.on{color:var(--acc)}
.colhead .cf{width:100%;min-width:0;padding:1px 4px;font-size:11px;text-align:right}.colhead .cf.on{border-color:var(--acc);background:var(--accs)}
.colhead #cfx{padding:0 6px}
.orow.open{background:var(--accs);border-bottom-color:transparent}
.orow.nobm{background:var(--bads)}.orow.out{opacity:.55;cursor:default}
.orow .nm{color:var(--mut);font-size:11px;display:inline;margin-left:6px}
.orow .c-o{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .num b{font-weight:700}
.orow .tt{font-weight:700;background:var(--accs);border-radius:5px;padding:1px 4px}
.flag{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;margin-left:3px;vertical-align:1px}
.flag.h{background:var(--warns);color:var(--warn)}.flag.s{background:var(--bads);color:var(--bad)}.flag.c{background:var(--accs);color:var(--acc)}
.chev{color:var(--mut);font-size:12px;text-align:right}
.det{padding:6px 10px 8px;background:var(--accs);border-bottom:1px solid var(--line);font-size:12px}
.det h3{font-size:11px;margin:6px 0 3px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em}
.mt{border-collapse:collapse;font-variant-numeric:tabular-nums;background:var(--card);border-radius:8px;overflow:hidden}
.mt th,.mt td{padding:1px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;line-height:1.35}
.mt th:first-child,.mt td:first-child{text-align:left}
.mt th{font-size:11px;color:var(--mut);font-weight:600}
.mt tr.h td{background:var(--warns)}.mt tr.s td:last-child{color:var(--bad);font-weight:600}
.mt tr.tot td{font-weight:700}
.ft{width:100%}.dsc{display:block;color:var(--mut);font-size:11px}.ft td.w{white-space:normal;color:var(--mut);font-size:12px;text-align:left}
.yr{display:flex;gap:4px;flex-wrap:wrap}
.dacts{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:6px}
.dacts input{width:70px}.dacts input.note{width:100%;max-width:520px}.dacts button{padding:3px 7px;font-size:12px}.dacts button.on{background:var(--bad);color:var(--card);border-color:var(--bad)}
.scroll{overflow-x:auto}
.dgrid{display:grid;grid-template-columns:270px 1fr;gap:12px;align-items:start}
.dr .mt td,.dr .mt th{text-align:right}.dr .gt td:first-child,.dr .gt th:first-child{text-align:left;white-space:normal}
.mt td.hc{background:var(--warns);color:var(--warn)}
.dr .scroll{max-height:420px;overflow:auto}
.dr .mt th{position:sticky;top:0;background:var(--card)}
.mt tr.s td{color:var(--bad)}
.mt tr.fo td{color:var(--mut)}
.gt tr.ga td{background:var(--accs);border-top:2px solid var(--line)}.gt tr.gc td:first-child{padding-left:16px}
.abtns{display:flex;flex-wrap:wrap;gap:4px}.ab{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:4px 6px;min-width:138px;background:var(--card);border:1px dashed var(--line);border-radius:6px}
.ab.got{border-style:solid;border-color:var(--acc)}.ab .ad{font-size:10px;color:var(--mut)}.ab .st{font-size:11px}
.ab.on{background:var(--oks,#e6f4ea);border-color:var(--ok);border-style:solid}.ab.off{background:var(--bads,#fdecea);border-color:var(--bad);border-style:solid}
.ab .will{font-size:10px;font-weight:600}.ab .will.add{color:var(--ok)}.ab .will.rem{color:var(--bad)}
.ab .abb{display:flex;gap:3px;margin-top:2px}.ab .abb button{padding:1px 6px;font-size:11px}
.ab .abb button.on{background:var(--ok);border-color:var(--ok);color:var(--card)}.ab .abb button.rm{background:var(--bad);border-color:var(--bad);color:var(--card)}
.pk{display:inline-block;font-size:10px;font-weight:700;border-radius:4px;padding:0 4px;color:var(--card)}.pk.add{background:var(--ok)}.pk.rem{background:var(--bad)}
.yr button{padding:1px 6px;font-size:11px}
.yt{min-width:220px}.yt tr.yrow{cursor:pointer}.yt tr.yrow:hover td{background:var(--accs)}.yt tr.sel td{background:var(--acc);color:var(--card)}
.ytk{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:6px;font-size:12px;max-width:100%}.ytk .chg{flex-basis:100%}.dgrid>*{min-width:0}.ytk label{display:flex;gap:3px;align-items:center}
@media (max-width:760px){
 .row{grid-template-columns:repeat(5,1fr);grid-template-areas:"o o o o x" "s n d f t" "a a a a a"}
 .row>.c-o{grid-area:o}.row>.c-s{grid-area:s}.row>.c-n{grid-area:n}.row>.c-st{grid-area:d}.row>.c-t{grid-area:t}.row>.c-x{grid-area:x}.row>.acts{grid-area:a;justify-content:flex-start}
 .row>.c-f{grid-area:f}
 .row.head:not([style]){display:none}
 .num>.ph,.num .tot>.ph{display:block;font-size:11px}
 .row.head>.acts{display:none}
 .ct{grid-template-columns:1fr 40px;grid-template-areas:"i p" "r r" "m m"}
 .ct>.i{grid-area:i}.ct>.p{grid-area:p}.ct>.arts{grid-area:r}.ct>select{grid-area:m}
 .ctns{padding-left:12px}.ph{display:inline}
 .bar{position:static}
 .orow{grid-template-columns:repeat(5,1fr) 44px;grid-template-areas:"o o o o o x" "s n d f t c";gap:2px 6px;padding:6px 10px}
 .orow>.c-o{grid-area:o}.orow>.c-s{grid-area:s}.orow>.c-n{grid-area:n}.orow>.c-st{grid-area:d}.orow>.c-f{grid-area:f}.orow>.c-t{grid-area:t}.orow>.c-x{grid-area:x}.orow>.chev{grid-area:c}
 .orow.head:not(.colhead){display:none}
 .colhead{grid-template-areas:"o o o o o o" "s n d f t x";grid-template-columns:repeat(6,1fr);top:0}
 .colhead>div:last-child{display:none}.colhead .srt{font-size:10px}
 .orow .num:before{content:attr(data-l);display:block;font-size:10px;color:var(--mut)}
 .det{padding:8px 10px 12px}
 .dsc{display:none}
 .dgrid{grid-template-columns:1fr}
 .dr .scroll{max-height:none}
 .orow{padding:4px 10px}
 .orow .nm{display:block;margin-left:0;overflow:hidden;text-overflow:ellipsis}.mt th,.mt td{padding:3px 5px}
 .row.art,.row.head[style]{grid-template-columns:1fr 56px 60px!important;grid-template-areas:none}
 .row.art>div:nth-child(2),.row.art>div:nth-child(5),.row.head[style]>div:nth-child(2),.row.head[style]>div:nth-child(5),.row.head[style]>div:nth-child(6){display:none}
 .row.art>div:nth-child(6){grid-column:1/-1}
 .ct.ao{grid-template-columns:1fr 44px;grid-template-areas:none}.ct.ao>.i,.ct.ao>.p{grid-area:auto}.ct.ao>.arts{grid-area:auto;grid-column:1/-1}
}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg muted">Opening…</div></div>
<script>
(function(){
"use strict";
var NOTES={},RESTORED="",D,KEYHEX,STORE,MOVES={},NOBM={},TARGET={},YRS={},ADDS={},AY={},DY={},OPEN={},F={b:"",g:"",q:"",s:"old",y:"",a:"",cf:{}},VIEW="o",YEARS=[];
function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function fmt(n){return (Math.round(n)||0).toLocaleString("en-US");}
var GL={nonew:"no 2027 bundle",missed:"-",topup:"has 2027 bundle",out:"out"};
var O={},C=[],FAC={};
function boot(){
  D.o.forEach(function(r){O[r[0]]={code:r[0],name:r[1],brand:r[2],sup:r[3],sold:r[4],st:r[5],nw:r[6],floor:r[7],grp:r[8],sA:r[9],sK:r[10],nA:r[11],nK:r[12],fA:r[13],fK:r[14]};});
  C=D.c.map(function(r){return {ic:r[0],brand:r[1],pcs:r[2],kids:r[3],orig:r[4],arts:r[5],pair:r[6]||"",wave:r[7]||"",L:r[5].split(";").map(function(x){
    var p=x.split(":"),i=p[0].indexOf("-"),a=p[0].slice(0,i);return {a:a,col:p[0].slice(i+1),q:+p[1],y:yearOf(a),k:isKid(a)};})};});
  var ys={};C.forEach(function(c){c.L.forEach(function(l){ys[l.y]=1;});});YEARS=Object.keys(ys).sort();
  FAC={};Object.keys(D.fac||{}).forEach(function(code){FAC[code]=D.fac[code].split(";").filter(Boolean).map(function(x){
    var p=x.split(":"),i=p[0].lastIndexOf("-"),a=p[0].slice(0,i);return {a:a,col:p[0].slice(i+1),q:+p[1],y:yearOf(a),k:isKid(a)};});});
  STORE="samping2027:"+D.ver;
  try{var raw=localStorage.getItem(STORE),from="",pre=STORE.split(":")[0]+":";
    if(!raw){var ks=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k.indexOf(pre)===0&&k!==STORE)ks.push(k);}
      ks.sort(function(a,b){return (+b.replace(/\D/g,""))-(+a.replace(/\D/g,""));});
      for(var j=0;j<ks.length&&!from;j++){var v=localStorage.getItem(ks[j]),o=JSON.parse(v||"{}");
        if(["m","n","t","y","a","o"].some(function(x){return o[x]&&Object.keys(o[x]).length;})){raw=v;from=ks[j].slice(pre.length);}}}
    var s=JSON.parse(raw||"{}");MOVES=s.m||{};NOBM=s.n||{};TARGET=s.t||{};YRS=s.y||{};ADDS=s.a||{};NOTES=s.o||{};
    if(from){RESTORED=from;save();}}catch(e){}
  render();
}
/* year = the 2 digits in the article code: 19026001 / 3926001A = BM 2026, 3925001A = BM 2025 */
function isKid(a){return a.indexOf("19SP")===0&&a.charAt(6)==="5";}
function yearOf(a){return a.indexOf("19SP")===0?"20"+a.substr(4,2):"?";}
function lineOk(l){return (!F.y||l.y===F.y)&&(!F.a||l.a.indexOf(F.a.toUpperCase())===0);}
function filt(){return !!(F.y||F.a);}
function fq(c){if(!filt())return c.pcs;var n=0;c.L.forEach(function(l){if(lineOk(l))n+=l.q;});return n;}
function save(){try{localStorage.setItem(STORE,JSON.stringify({m:MOVES,n:NOBM,t:TARGET,y:YRS,a:ADDS,o:NOTES}));}catch(e){}}
function dest(c){var d=(c.ic in MOVES)?MOVES[c.ic]:c.orig;return (d&&!NOBM[d]&&O[d]&&O[d].grp!=="out")?d:"";}
function tallies(all){var t={},orig={},k={};C.forEach(function(c){var q=all?c.pcs:fq(c);if(!q)return;var d=dest(c);if(d){t[d]=(t[d]||0)+q;c.L.forEach(function(l){if(l.k&&(all||lineOk(l)))k[d]=(k[d]||0)+l.q;});}if(c.orig)orig[c.orig]=(orig[c.orig]||0)+q;});return {now:t,orig:orig,kid:k};}
function ak(a,k){return '<span class="ak">A '+fmt(a)+" · K "+fmt(k)+"</span>";}
function cover(o,old){return o.sold?((o.nw+o.floor+old)/o.sold):null;}
/* column filter: ">100", "<50", ">=10", "0", "100-300"; anything else = no filter */
function cfPass(v,e){e=(e||"").replace(/\s/g,"");if(!e)return true;if(v==null)return false;var m=e.match(/^(\d*\.?\d+)-(\d*\.?\d+)$/);
  if(m)return v>=+m[1]&&v<=+m[2];m=e.match(/^(>=|<=|>|<|=)?(-?\d*\.?\d+)$/);if(!m)return true;var n=+m[2];
  return m[1]===">"?v>n:m[1]==="<"?v<n:m[1]===">="?v>=n:m[1]==="<="?v<=n:v===n;}
var COLS=[["s","Sold avg"],["n","New 2027"],["st","Old samping"],["f","Floor"],["t","Total 27"],["x","Cover x"]];
function colVal(o,k,T,TA){var oldAll=(o.code in TARGET)?TARGET[o.code]:(TA.now[o.code]||0);
  if(k==="s")return o.sold;if(k==="n")return o.nw;if(k==="st")return (o.code in TARGET)?TARGET[o.code]:(T.now[o.code]||0);if(k==="f")return o.floor;
  if(k==="t")return o.nw+oldAll+o.floor;var x=cover(o,oldAll);return x==null?null:Math.round(x*10)/10;}
function colHead(n){var sc=F.s.indexOf("c:")===0?F.s.split(":"):null;
  return '<div class="colhead orow head"><div class="c-o"><input type="search" id="fq" placeholder="Filter outlet code / name / supervisor" value="'+esc(F.q)+'"><span class="small muted"> '+n+' shown</span></div>'+
    COLS.map(function(c){var on=sc&&sc[1]===c[0],lbl=c[1]==="Floor"?"Floor "+esc(D.fdate):c[1];
      return '<div class="num c-'+c[0]+'"><button class="srt'+(on?" on":"")+'" data-sort="'+c[0]+'" title="Tap to sort">'+lbl+(on?(sc[2]==="a"?" ▲":" ▼"):"")+'</button>'+
        '<input id="cf_'+c[0]+'" class="cf'+((F.cf[c[0]]||"")?" on":"")+'" placeholder="&gt;0" title="&gt;100, &lt;50, 0 or 100-300" value="'+esc(F.cf[c[0]]||"")+'"></div>';}).join("")+
    '<div>'+(Object.keys(F.cf).some(function(k){return F.cf[k];})||F.q?'<button id="cfx" title="Clear column filters">×</button>':"")+'</div></div>';}
function pinHead(){var b=document.querySelector(".bar"),h=document.querySelector(".colhead");if(!b||!h)return;
  h.style.top=(getComputedStyle(b).position==="sticky"?b.offsetHeight:0)+"px";}
window.addEventListener("resize",pinHead);
function changes(){
  var ad=Object.keys(ADDS).filter(function(k){return Object.keys(ADDS[k]).length;}),y=Object.keys(YRS),n=Object.keys(NOBM).filter(function(k){return NOBM[k];}),t=Object.keys(TARGET),m=C.filter(function(c){return (c.ic in MOVES)&&MOVES[c.ic]!==c.orig;});
  var no=Object.keys(NOTES).filter(function(k){return NOTES[k];});
  return {n:n,t:t,m:m,y:y,ad:ad,no:no};
}
function render(){
  var T=tallies(),TA=tallies(true),N27={t:0,a:0,k:0},FL=0,FA=0,FK=0,placedAll=0,kidAll=0;
  Object.keys(O).forEach(function(k){var o=O[k];if(o.grp==='out'&&!o.nw)return;N27.t+=o.nw;N27.a+=o.nA;N27.k+=o.nK;if(o.grp!=='out'&&!NOBM[o.code]){FL+=o.floor;FA+=o.fA||0;FK+=o.fK||0;}});
  Object.keys(TA.now).forEach(function(k){placedAll+=TA.now[k];kidAll+=TA.kid[k]||0;});
  var ch=changes(),pool=0,placed=0,un=[];
  C.forEach(function(c){var q=fq(c);if(!q)return;pool+=q;var d=dest(c);if(d)placed+=q;else un.push(c);});
  var unp=un.reduce(function(a,c){return a+fq(c);},0);
  var nch=ch.n.length+ch.t.length+ch.m.length+ch.y.length+ch.ad.length+ch.no.length;
  var h='<h1>Samping Raya 2027 (old stock): reallocate</h1><div class="muted small">Plan '+esc(D.ver)+' · built '+esc(D.built)+' · '+esc(D.src)+'</div>';

  var d=dest(c),moved=d!==c.orig,arts=c.arts.split(";").slice(0,4).map(function(a){var p=a.split(":");return p[0]+" ×"+p[1];}).join(", ")+(c.arts.split(";").length>4?" …":"");
  return '<div class="ct'+(moved?" moved":"")+'"><span class="i">'+esc(c.ic)+(c.kids?' <span class="tag">kids '+c.kids+'</span>':"")+'</span><span class="p num">'+c.pcs+'</span><span class="arts">'+esc(arts)+(moved&&c.orig?' · <b>was '+esc(c.orig)+'</b>':"")+'</span><select data-mv="'+c.ic+'">'+opts(c.brand,d)+"</select></div>";
}
function text(){
  var ch=changes(),T=tallies(),L=["Samping Raya 2027 changes (from "+D.ver+")"];
  if(ch.n.length)L.push("NO SAMPING: "+ch.n.join(", "));
  ch.t.forEach(function(k){L.push("TARGET: "+k+" "+TARGET[k]+" pcs (plan "+(T.orig[k]||0)+")");});
  ch.y.forEach(function(k){L.push("YEARS: "+k+" SP "+YRS[k].join(" + ")+" only");});
  ch.ad.forEach(function(k){function ls(v){return Object.keys(ADDS[k]).filter(function(a){return ADDS[k][a]===v;}).map(function(a){return a+" (SP "+yearOf(a)+")";}).join(", ");}
    var x=ls(1),r=ls(-1),ac=ls(2);if(x)L.push("ADD: "+k+" "+x);if(ac)L.push("ALL COLOURS: "+k+" "+ac);if(r)L.push("REMOVE: "+k+" "+r);});
  ch.no.forEach(function(k){L.push("NOTE: "+k+" "+NOTES[k].replace(/\s+/g," "));});
  ch.m.forEach(function(c){L.push("MOVE: "+c.ic+" ("+c.pcs+" pcs) "+(c.orig||"WH")+" -> "+(MOVES[c.ic]||"not placed"));});
  var un=C.filter(function(c){return !dest(c);});
  if(un.length)L.push("NOT PLACED: "+un.length+" ctns / "+un.reduce(function(a,c){return a+c.pcs;},0)+" pcs - stay in WH");
  if(L.length===1)L.push("(no changes)");
  return L.join("\n");
}
document.addEventListener("click",function(e){var t=e.target;
  var rw=t.closest&&t.closest("[data-row]");
  if(rw&&!t.closest("button,input,select,label")){OPEN[rw.dataset.row]=!OPEN[rw.dataset.row];render();return;}
  if(t.dataset.sort){var k=t.dataset.sort;F.s=F.s==="c:"+k+":d"?"c:"+k+":a":"c:"+k+":d";render();return;}
  if(t.id==="cfx"){F.cf={};F.q="";render();return;}
  if(t.dataset.nobm){var k=t.dataset.nobm;if(NOBM[k])delete NOBM[k];else NOBM[k]=1;save();render();}
  else if(t.dataset.open){OPEN[t.dataset.open]=!OPEN[t.dataset.open];render();}
  else if(t.id==="copy"){var s=text();(navigator.clipboard?navigator.clipboard.writeText(s):Promise.reject()).then(function(){t.textContent="Copied ✓";setTimeout(render,1500);},function(){window.prompt("Copy this:",s);});}
  else if(t.id==="csvc"){var ch=changes(),T=tallies(),nm=function(k){return O[k]?O[k].name:"";};
    var rows=[["Change","Outlet","Outlet name","Art / carton","Year","Pcs / value","Plan","Detail"]];
    ch.n.forEach(function(k){rows.push(["NO BM",k,nm(k),"","","","",""]);});
    ch.t.forEach(function(k){rows.push(["TARGET",k,nm(k),"","",TARGET[k],T.orig[k]||0,"target old pcs"]);});
    ch.y.forEach(function(k){rows.push(["YEARS",k,nm(k),"",YRS[k].join(" + "),"","","only these years"]);});
    ch.ad.forEach(function(k){Object.keys(ADDS[k]).forEach(function(a){var v=ADDS[k][a];
      rows.push([v===2?"ALL COLOURS":v>0?"ADD":"REMOVE",k,nm(k),a,yearOf(a),"","",D.desc[a]||""]);});});
    ch.no.forEach(function(k){rows.push(["NOTE",k,nm(k),"","","","",NOTES[k]]);});
    ch.m.forEach(function(c){rows.push(["MOVE",MOVES[c.ic]||"",nm(MOVES[c.ic]),c.ic,"",c.pcs,c.orig||"WH","from "+(c.orig||"WH")+" | "+c.arts]);});
    if(rows.length===1){alert("No changes yet.");return;}
    var b=new Blob(["﻿"+rows.map(function(r){return r.map(function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"';}).join(",");}).join("\r\n")],{type:"text/csv"});
    var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=document.title+" changes "+D.ver+" "+new Date().toISOString().slice(0,10)+".csv";a.click();}
  else if(t.id==="csv"){var rows=[["IC","Brand","Pcs","Plan outlet","Now outlet","Arts"]];C.forEach(function(c){rows.push([c.ic,c.brand,c.pcs,c.orig,dest(c),c.arts]);});
    var b=new Blob([rows.map(function(r){return r.map(function(v){return '"'+String(v).replace(/"/g,'""')+'"';}).join(",");}).join("\n")],{type:"text/csv"});
    var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Samping Raya2027 "+D.ver+" reallocated.csv";a.click();}
  else if(t.id==="vo"||t.id==="va"){VIEW=t.id==="va"?"a":"o";render();}
  else if(t.closest&&t.closest("[data-dy]")){var p=t.closest("[data-dy]").dataset.dy.split("|");if(p[1])DY[p[0]]=p[1];else delete DY[p[0]];render();}
  else if(t.closest&&t.closest("[data-add]")){var p=t.closest("[data-add]").dataset.add.split("|"),m=ADDS[p[0]]||(ADDS[p[0]]={}),v=+(p[2]||1);if(m[p[1]]===v)delete m[p[1]];else m[p[1]]=v;if(!Object.keys(m).length)delete ADDS[p[0]];save();render();}
  else if(t.closest&&t.closest("[data-ay]")){var p=t.closest("[data-ay]").dataset.ay.split("|");AY[p[0]]=p[1];render();}
  else if(t.id==="reset"){if(confirm("Clear all your changes on this device?")){MOVES={};NOBM={};TARGET={};YRS={};ADDS={};NOTES={};save();render();}}
});
document.addEventListener("change",function(e){var t=e.target;
  if(t.dataset.mv){var c=C.filter(function(x){return x.ic===t.dataset.mv;})[0];
    var grp=C.filter(function(x){return x===c||(c.pair&&x.ic===c.pair)||x.pair===c.ic;});  // ERR pair cartons move together
    grp.forEach(function(x){if(t.value===x.orig)delete MOVES[x.ic];else MOVES[x.ic]=t.value;});save();render();}
  else if(t.dataset.yr){var p=t.dataset.yr.split("|"),cur=(YRS[p[0]]||YEARS.slice()).slice();
    if(t.checked){if(cur.indexOf(p[1])<0)cur.push(p[1]);}else cur=cur.filter(function(x){return x!==p[1];});cur.sort();
    if(!cur.length||cur.length===YEARS.length)delete YRS[p[0]];else YRS[p[0]]=cur;save();render();}
  else if(t.dataset.note){var k=t.dataset.note,v=t.value.trim();if(v)NOTES[k]=v;else delete NOTES[k];save();render();}
  else if(t.dataset.tg){var k=t.dataset.tg;if(t.value==="")delete TARGET[k];else TARGET[k]=Math.max(0,+t.value);save();render();}
  else if(t.id==="fb"){F.b=t.value;render();}else if(t.id==="fy"){F.y=t.value;render();}else if(t.id==="fg"){F.g=t.value;render();}else if(t.id==="fs"){F.s=t.value;render();}
});

function readKey(){var h=(location.hash||"").replace(/^#/,"").split("&")[0].trim();return /^[0-9a-fA-F]{64}$/.test(h)?h.toLowerCase():null;}
function hexToBytes(h){var o=new Uint8Array(h.length/2);for(var i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o;}
function b64(s){var b=atob(s),o=new Uint8Array(b.length);for(var i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;}
function fail(t){$("#app").innerHTML='<div class="msg"><h1>'+esc(t)+'</h1><p class="muted">Open the link exactly as it was sent. It must include everything after #.</p></div>';}
KEYHEX=readKey();

crypto.subtle.digest("SHA-256",new TextEncoder().encode(KEYHEX)).then(function(buf){
  var b=new Uint8Array(buf),id="";for(var i=0;i<8;i++)id+=(b[i]<16?"0":"")+b[i].toString(16);
  return Promise.all([fetch("k/"+id+".json",{cache:"no-store"}),crypto.subtle.importKey("raw",hexToBytes(KEYHEX),{name:"AES-GCM"},false,["decrypt"])]);
}).then(function(r){if(!r[0].ok)throw new Error("missing");return r[0].json().then(function(doc){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(doc.iv),tagLength:128},r[1],b64(doc.ct));});
}).then(function(buf){D=JSON.parse(new TextDecoder().decode(buf));boot();},function(){fail("Couldn't open this page.");});
