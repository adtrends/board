<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48'/></svg>">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<title>BM27 Label + Sort</title>
<style>
/* BM 2027 old stock: 1 LABEL (kenal IC -> cetak label) -> 2 SORT (scan label -> ZON + LOT outlet) -> LOT (progress).
   Same look as the samping Sort Karton page the WH already used (sortscan_page.html). */
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--mute:#667085;--line:#e3e6ea;--ok:#127a3e;--okbg:#e5f5ec;--warn:#a85a00;--warnbg:#fff1dc;--bad:#b42318;--badbg:#fde8e6;--acc:#1d4ed8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:8px 10px;display:flex;align-items:center;gap:6px}
header h1{font-size:15px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header button{background:#374151;color:#fff;border:0;border-radius:8px;padding:9px 10px;font-size:14px;font-weight:700}
header button.on{background:var(--acc)}
main{max-width:720px;margin:0 auto;padding:10px 12px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h2{font-size:14px;margin:0 0 8px;letter-spacing:.5px}
.mute{color:var(--mute);font-size:13px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 12px;font-size:14px;font-weight:700;color:var(--ink);flex:1 1 auto}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.g{background:var(--ok);color:#fff;border-color:var(--ok)}
.btn:disabled{opacity:.4}
.prog{height:8px;background:#e5e7eb;border-radius:9px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;background:var(--acc)}
.tag{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.t0{background:#eef0f3;color:var(--mute)}.t1{background:var(--warnbg);color:var(--warn)}.t2{background:var(--okbg);color:var(--ok)}
/* LABEL tab */
#disp{font:800 40px ui-monospace,Consolas,monospace;letter-spacing:4px;text-align:center;border:2px solid var(--acc);border-radius:10px;padding:6px;min-height:62px;background:#fff}
#disp small{display:block;font:600 12px Arial,sans-serif;letter-spacing:0;color:var(--mute)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.pad button{font:800 26px Arial,sans-serif;padding:12px 0;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.pad button.x{background:#eef0f3;font-size:18px}
.cand{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;background:#fff}
.cand.one{border-color:var(--ok);background:var(--okbg)}
.cand .i{flex:1;min-width:0}
.cand .i b{font:800 20px ui-monospace,Consolas,monospace}
.cand .i div{font-size:13px;color:var(--ink)}
.cand button{flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:700 15px ui-monospace,Consolas,monospace;background:#111827;color:#fff;border-radius:8px;padding:6px 8px}
.chip i{font-style:normal;opacity:.7;margin-left:6px}
.bt{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line)}
.bt .n{flex:1;min-width:0}.bt .n b{font-family:ui-monospace,Consolas,monospace}
/* SORT tab */
#scanin{width:100%;font-size:20px;padding:12px;border:2px solid var(--acc);border-radius:10px}
#res{border-radius:14px;padding:14px;text-align:center;margin-top:10px;border:3px solid var(--line);background:#fff;min-height:170px}
#res.ok{border-color:var(--ok);background:var(--okbg)}#res.dup{border-color:var(--warn);background:var(--warnbg)}#res.bad{border-color:var(--bad);background:var(--badbg)}
#res .big{display:flex;justify-content:center;gap:10px;margin:6px 0}#res .big>div{background:#111827;color:#fff;border-radius:14px;padding:6px 12px;min-width:104px}
#res .big small{display:block;font-size:13px;letter-spacing:2px;opacity:.8}#res .big b{display:block;font-size:50px;line-height:1.05;white-space:nowrap}
#res .oc{font-size:28px;font-weight:800;margin-top:6px;font-family:ui-monospace,Consolas,monospace}
#res .on{font-size:15px;margin-top:2px}
#res .ct{font-size:15px;margin-top:6px;font-family:ui-monospace,Consolas,monospace}
#res .st{font-size:18px;font-weight:800}
#cam{width:100%;margin-top:8px}
/* LOT tab */
.zh{display:flex;align-items:center;gap:10px;margin:14px 2px 4px;font-weight:800;font-size:17px}.zh .zb{background:#111827;color:#fff;border-radius:8px;padding:4px 10px}
.lotrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.lotn{background:#111827;color:#fff;font-weight:800;border-radius:8px;min-width:62px;text-align:center;padding:8px 4px;font-size:16px}
.lotrow .nm{flex:1;min-width:0}.lotrow .nm b{font-family:ui-monospace,Consolas,monospace}
.miss{font-family:ui-monospace,Consolas,monospace;font-size:13.5px;padding:6px 0 6px 8px;line-height:1.7}
.miss span{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;margin:0 4px 4px 0;background:#fff}
.miss span.l{background:var(--warnbg)}.miss span.s{background:var(--okbg);color:var(--ok)}
/* overlay */
#ov{position:fixed;inset:0;z-index:20;background:rgba(17,24,39,.55);display:none;align-items:flex-end;justify-content:center}
#ov.show{display:flex}
#ov .sheet{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
#ov h3{margin:0 0 8px;font-size:17px}
.pg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pg button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 2px;font:800 16px Arial,sans-serif;color:var(--ink)}
.pg button small{display:block;font:600 11px Arial,sans-serif;color:var(--mute)}
.pg button.done{background:var(--okbg);color:var(--ok)}
.pl{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line)}
.pl input{width:26px;height:26px;flex:none}
.pl .i{flex:1;min-width:0}.pl .i b{font:800 18px ui-monospace,Consolas,monospace}
#ov .sheet .act{position:sticky;bottom:0;background:#fff;padding:8px 0 2px;margin-top:6px;border-top:1px solid var(--line)}
.msg{padding:30px 16px;text-align:center;color:var(--mute)}
.offl{background:#a85a00;color:#fff;font:700 13px Arial,sans-serif;padding:6px 12px;text-align:center}
</style>
<!--DOC-->
<header><h1 id="ttl">BM27 Label + Sort</h1><button id="tLab" class="on">1 LABEL</button><button id="tSort">2 SORT</button><button id="tLot">LOT</button></header>
<main id="app"><div class="msg">Memuatkan...</div></main>
<div id="ov"></div>
<script>
(function(){
  var C128=["212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
  var D=null,KEY='',IDX={},NS={},OUT={},view='lab',open={},scanner=null,last=null,buf='',picked=null;
  var LAB={},BATCH={},SORTED={},hqAt=0;          // shared state read from the HQ sheet
  var app=document.getElementById('app'),ov=document.getElementById('ov');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function hexToBytes(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
  function b64ToBytes(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
  function docIdFor(k){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(k)).then(function(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<8;i++)s+=(b[i]<16?'0':'')+b[i].toString(16);return s;});}
  function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}return null;}
  function lj(k,d){try{var v=JSON.parse(ls(k));return v==null?d:v;}catch(e){return d;}}
  function load(){
    if(window.__DOC){D=window.__DOC;return start();}
    KEY=((location.hash||'').slice(1)||window.__SORTKEY||'').toLowerCase();
    if(!/^[0-9a-f]{64}$/.test(KEY)){app.innerHTML='<div class="msg">Link tidak lengkap. Buka semula link penuh dari WhatsApp.</div>';return;}
    var ck='bm27sort-doc:'+KEY.slice(0,12);
    Promise.all([docIdFor(KEY),crypto.subtle.importKey('raw',hexToBytes(KEY),{name:'AES-GCM'},false,['decrypt'])]).then(function(r){
      return fetch('r/'+r[0]+'.json',{cache:'no-store'}).then(function(res){if(!res.ok)throw 0;return res.json();}).then(function(doc){
        return crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(doc.iv),tagLength:128},r[1],b64ToBytes(doc.ct)).then(function(b){D=JSON.parse(new TextDecoder().decode(b));ls(ck,JSON.stringify(D));start();});
      });
    }).catch(function(){var d=lj(ck,null);if(d){D=d;var b=document.createElement('div');b.className='offl';b.textContent='Tiada internet - guna data simpanan';document.body.insertBefore(b,app);return start();}
      app.innerHTML='<div class="msg">Tidak dapat buka senarai. Semak internet dan cuba lagi.</div>';});
  }
  // ---------------------------------------------------------------- local state (this device)
  function k0(){return 'bm27s:'+D.ver;}
  function dev(){var d=ls('bm27s:dev');if(d)return d;d=(prompt('Nama terminal / nama anda (cth T1, ALI):','')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
    if(!d)d='T'+Math.floor(10+Math.random()*90);ls('bm27s:dev',d);return d;}
  // Tze 17 Nov 2026: "they can't print from the phone, they print from the computer connected to WhatsApp"
  function isPC(){var v=ls('bm27s:pc');if(v==='1')return true;if(v==='0')return false;
    return !!(window.matchMedia&&matchMedia('(pointer:fine)').matches&&window.innerWidth>=900);}
  function Q(){return lj(k0()+':q',[]);}
  function putQ(q){ls(k0()+':q',JSON.stringify(q));}
  function MB(){return lj(k0()+':b',{});}                       // my batches: bid -> {t, ics, p}
  function putMB(m){ls(k0()+':b',JSON.stringify(m));}
  function MS(){return lj(k0()+':s',{});}                       // my sort scans: ic -> time
  function putMS(m){ls(k0()+':s',JSON.stringify(m));}
  function labOf(ic){if(LAB[ic])return LAB[ic];var m=MB();for(var b in m)if(m[b].ics.indexOf(ic)>=0)return b;return '';}
  function sorted(ic){return !!(MS()[ic]||SORTED[ic]);}
  // ---------------------------------------------------------------- HQ log (same Google Form + sheet as SEMAK / Sort Karton)
  var SHEET='https://docs.google.com/spreadsheets/d/1iDooagNQXRBkeoj5U0U9BcgvF-FuhSx79ovvsnqw-rs/gviz/tq?tqx=out:csv&tq='+encodeURIComponent("select A,B where B contains '#BM27 v1'");
  var FORM='https://docs.google.com/forms/d/e/1FAIpQLScYDGCsuTz5QLuMjONq_6gfQXFx0hUB3bVL_WbiRG6W3AalNg/formResponse',FIELD='entry.1287064873';
  function post(line){var o=lj('bm27s:out',[]);o.push('#BM27 v1\n'+line);ls('bm27s:out',JSON.stringify(o));flush();}
  var flushing=false;
  function flush(){if(flushing||window.__DOC)return;var o=lj('bm27s:out',[]);if(!o.length)return;flushing=true;
    var b=new URLSearchParams();b.append(FIELD,o[0]);
    fetch(FORM,{method:'POST',mode:'no-cors',body:b}).then(function(){var p=lj('bm27s:out',[]);if(p[0]===o[0]){p.shift();ls('bm27s:out',JSON.stringify(p));}flushing=false;if(p.length)flush();},function(){flushing=false;});}
  window.addEventListener('online',flush);
  function parseHQ(t){
    var re=/BM27 (LABEL|PRINTED|SORT|UNSORT) ([^\n"]*)/g,m,lab={},bat={},srt={};
    while((m=re.exec(t))){var a=m[2].trim().split(/\s+/);
      if(m[1]==='LABEL'&&a.length>=4){var ics=a[3].split(',').filter(function(x){return IDX[x];});bat[a[0]]={dev:a[1],hm:a[2],ics:ics,p:(bat[a[0]]||{}).p||0};ics.forEach(function(ic){lab[ic]=a[0];});}
      else if(m[1]==='PRINTED'){if(bat[a[0]])bat[a[0]].p=1;else bat[a[0]]={dev:a[1]||'',hm:'',ics:[],p:1};}
      else if(m[1]==='SORT'&&a.length>=3)srt[a[0]]=a[2];
      else if(m[1]==='UNSORT')delete srt[a[0]];}
    LAB=lab;BATCH=bat;SORTED=srt;hqAt=Date.now();
  }
  function fetchHQ(){if(window.__DOC&&!window.__HQTEST)return;flush();
    fetch(SHEET+'&t='+Date.now()).then(function(r){return r.text();}).then(function(t){parseHQ(t);refresh();}).catch(function(){});}
  function refresh(){if(view==='lab'){drawCand();drawQueue();drawBatches();}else if(view==='lot'){if(!document.querySelector('#ov.show'))draw();}stats();}
  // ---------------------------------------------------------------- start
  function start(){
    document.getElementById('ttl').textContent=D.title||'BM27 Label + Sort';
    Object.keys(D.cartons).forEach(function(ic){var c=D.cartons[ic];IDX[ic]=c;(OUT[c[0]]=OUT[c[0]]||[]).push(ic);});
    Object.keys(D.notsent||{}).forEach(function(ic){NS[ic]=D.notsent[ic];});
    fetchHQ();setInterval(function(){if(isPC()||!document.hidden)fetchHQ();},10000);
    document.getElementById('tLab').onclick=function(){go('lab');};
    document.getElementById('tSort').onclick=function(){go('sort');};
    document.getElementById('tLot').onclick=function(){go('lot');};
    view=ls('bm27s:view')||'lab';draw();
  }
  function go(v){if(scanner)stopCam();view=v;ls('bm27s:view',v);draw();}
  function O(ic){return D.outlets[D.order[IDX[ic][0]]];}       // [name, region, lane, N, P, pcs, zone]
  function oc(ic){return D.order[IDX[ic][0]];}
  function s6(ic){return ic.slice(3);}
  function pkl(p){return (D.pkl&&D.pkl[p])||p;}
  function beep(k){try{var a=window.__ac||(window.__ac=new(window.AudioContext||window.webkitAudioContext)()),o=a.createOscillator(),g=a.createGain();o.frequency.value=k==='ok'?1200:k==='dup'?700:300;o.connect(g);g.connect(a.destination);g.gain.value=.2;o.start();o.stop(a.currentTime+(k==='ok'?.08:.35));}catch(e){} if(k!=='ok'&&navigator.vibrate)navigator.vibrate(k==='bad'?400:150);}
  function stats(){var el=document.getElementById('stat');if(!el)return;var tot=Object.keys(IDX).length,a=0,b=0;
    for(var ic in IDX){if(labOf(ic))a++;if(sorted(ic))b++;}
    el.innerHTML='Label: <b>'+a+'</b> / '+tot+' &middot; Sort: <b>'+b+'</b> / '+tot+' karton<div class="prog"><i style="width:'+(100*b/tot).toFixed(1)+'%"></i></div>'+
      '<div class="mute" style="margin-top:4px">'+(hqAt?'HQ dikemas kini '+new Date(hqAt).toTimeString().slice(0,5):'HQ: belum disambung')+(lj('bm27s:out',[]).length?' &middot; '+lj('bm27s:out',[]).length+' belum dihantar':'')+'</div>';}
  // ---------------------------------------------------------------- draw
  function draw(){
    document.getElementById('tLab').className=view==='lab'?'on':'';document.getElementById('tSort').className=view==='sort'?'on':'';document.getElementById('tLot').className=view==='lot'?'on':'';
    if(view==='lab')return drawLab();
    if(view==='sort')return drawSort();
    drawLot();
  }
  // ================================================================ 1 LABEL
  function drawLab(){
    var pad='';['1','2','3','4','5','6','7','8','9','C','0','<'].forEach(function(k){pad+='<button data-k="'+k+'"'+(k==='C'||k==='<'?' class="x"':'')+'>'+(k==='<'?'&#9003;':k==='C'?'PADAM':k)+'</button>';});
    var pc=isPC(),ent='<div class="card"><h2>1. KENAL KARTON &rarr; '+(pc?'CETAK LABEL':'HANTAR KE KOMPUTER')+'</h2><div id="disp"></div><div class="pad" id="pad">'+pad+'</div><div id="cand"></div>'+
      '<div class="row"><button class="btn" id="pal">Pilih ikut PALET KIRAAN</button></div></div><div class="card" id="queue"></div>';
    var role='<div class="card"><div class="mute">Peranti ini: <b>'+(pc?'KOMPUTER PENCETAK':'TELEFON / TERMINAL')+'</b></div><div class="row"><button class="btn" id="role">Tukar kepada '+(pc?'TELEFON / TERMINAL':'KOMPUTER PENCETAK')+'</button></div></div>';
    app.innerHTML=(pc?'<div class="card" id="batches"></div>'+ent:ent+'<div class="card" id="batches"></div>')+'<div class="card" id="stat"></div>'+role+
      '<p class="mute">'+(pc?'Komputer ini mencetak. Label yang dihantar dari telefon keluar di BARISAN CETAK. Tekan CETAK, cetak PDF, tekan SUDAH CETAK.'
        :'Taip 6 nombor akhir IC pada karton (cth IC-260900108 = <b>900108</b>). Semak PALET / CTN / kod baju, tekan TAMBAH. Cukup satu palet, tekan HANTAR. Label keluar di komputer pencetak.')+'</p>';
    document.getElementById('role').onclick=function(){ls('bm27s:pc',pc?'0':'1');draw();};
    [].forEach.call(document.querySelectorAll('#pad button'),function(b){b.onclick=function(){key(b.getAttribute('data-k'));};});
    document.getElementById('pal').onclick=pallets;
    drawCand();drawQueue();drawBatches();stats();
  }
  function key(k){if(k==='C')buf='';else if(k==='<')buf=buf.slice(0,-1);else if(buf.length<9)buf+=k;picked=null;drawCand();}
  function cands(){if(buf.length<3)return [];var r=[];for(var ic in IDX)if(ic.slice(-buf.length)===buf)r.push(ic);for(var n in NS)if(n.slice(-buf.length)===buf)r.push(n);return r.sort();}
  function info(ic){var c=IDX[ic];return esc(pkl(c[4]))+(c[5]?' &middot; CTN '+esc(c[5]):'')+' &middot; '+c[3]+' pcs &middot; '+esc(c[6]);}
  function drawCand(){
    var d=document.getElementById('disp'),el=document.getElementById('cand');if(!d||!el)return;
    d.innerHTML=(buf||'&nbsp;')+'<small>6 nombor akhir IC</small>';
    var cs=cands(),h='';
    if(buf.length<3){el.innerHTML='';return;}
    if(!cs.length)h='<div class="cand"><div class="i"><b>?</b><div>Tiada IC berakhir '+esc(buf)+'. Semak nombor. Kalau betul, asingkan karton + tanya HQ.</div></div></div>';
    else if(cs.length>8)h='<div class="mute" style="margin-top:8px">'+cs.length+' karton berakhir '+esc(buf)+' - taip lagi.</div>';
    else cs.forEach(function(ic){
      if(NS[ic]){h+='<div class="cand"><div class="i"><b>IC-'+esc(ic)+'</b><div>BUKAN DALAM PLAN - simpan di WH, jangan label.</div></div></div>';return;}
      var lb=labOf(ic),q=Q().indexOf(ic)>=0;
      h+='<div class="cand'+(cs.length===1?' one':'')+'"><div class="i"><b>'+esc(ic.slice(0,3))+' '+esc(s6(ic))+'</b><div>'+info(ic)+'</div>'+
        (lb?'<div><span class="tag t1">SUDAH ADA LABEL '+esc(lb)+'</span></div>':'')+(sorted(ic)?'<div><span class="tag t2">SUDAH SORT</span></div>':'')+'</div>'+
        '<button class="btn '+(q?'':'g')+'" data-ic="'+ic+'"'+(q?' disabled':'')+'>'+(q?'DALAM SENARAI':'TAMBAH')+'</button></div>';});
    el.innerHTML=h;
    [].forEach.call(el.querySelectorAll('button[data-ic]'),function(b){b.onclick=function(){add(b.getAttribute('data-ic'));};});
  }
  function add(ic){var lb=labOf(ic);if(lb&&!confirm('IC-'+ic+' sudah ada label ('+lb+'). Cetak semula?'))return;
    var q=Q();if(q.indexOf(ic)<0)q.push(ic);putQ(q);buf='';beep('ok');drawCand();drawQueue();}
  function drawQueue(){
    var el=document.getElementById('queue');if(!el)return;var q=Q();
    var h='<h2>SENARAI CETAK: '+q.length+' karton</h2>';
    if(!q.length)h+='<div class="mute">Kosong. Tambah karton di atas.</div>';

      for(i=0;i<bars.length;i++){var wd=+bars[i]*mod;if(i%2===0)s.push(X(x)+' '+Y(141)+' '+n2(wd*MM)+' '+n2(16*MM)+' re f');x+=wd;}
      txt(50,145,'IC-'+ic,9,true,'c');
      txt(5,148.6,c[3]+' pcs  '+c[6],6.5,false);
      txt(95,148.6,bid+'  '+(idx+1)+'/'+ics.length+'  BM27 '+D.plan,6.5,false,'r');
      pages.push(s.join('\n'));
    });
    // ---- assemble
    var out='%PDF-1.4\n',off=[],np=pages.length;
    function obj(n,body){off[n]=out.length;out+=n+' 0 obj\n'+body+'\nendobj\n';}
    obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
    var kids=[];for(var p=0;p<np;p++)kids.push((5+p*2)+' 0 R');
    obj(2,'<< /Type /Pages /Count '+np+' /Kids ['+kids.join(' ')+'] >>');
    obj(3,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    obj(4,'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    for(p=0;p<np;p++){
      obj(5+p*2,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+n2(W)+' '+n2(H)+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+p*2)+' 0 R >>');
      obj(6+p*2,'<< /Length '+pages[p].length+' >>\nstream\n'+pages[p]+'\nendstream');}
    var xr=out.length,n=4+np*2;out+='xref\n0 '+(n+1)+'\n0000000000 65535 f \n';
    for(var k=1;k<=n;k++)out+=('0000000000'+off[k]).slice(-10)+' 00000 n \n';
    out+='trailer\n<< /Size '+(n+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n';
    return new Blob([out],{type:'application/pdf'});
  }
  window.__bm27={labelPDF:labelPDF,parseHQ:parseHQ,state:function(){return {LAB:LAB,BATCH:BATCH,SORTED:SORTED};},refresh:refresh};
  load();
})();
