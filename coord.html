<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coordinator Board</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #F7F5F0;
    --surface: #FFFFFF;
    --ink: #1E2A3A;
    --muted: #57636F;
    --line: #E7E2D8;
    --line-soft: #F0ECE4;
    --chrome: #3E4E62;
    --chrome-grad: linear-gradient(135deg, #384759 0%, #4B5B70 100%);
    --chrome-ink: #FFFFFF;
    --chrome-soft: rgba(255,255,255,0.2);
    --done: #2A7549;
    --done-bg: #DBEEE2;
    --pending: #B93A30;
    --pending-bg: #F8E2DE;
    --overdue: #8C2119;
    --overdue-bg: #F2CFC9;
    --upcoming: #67727D;
    --upcoming-bg: #EAECEE;
    --amber: #B8741A;
    --amber-bg: #F8EBD3;
    --skeleton: #EAE4D8;
    --focus: #2E4466;
    --shadow: 0 1px 2px rgba(60,50,30,0.06), 0 6px 18px rgba(60,50,30,0.08);
  }
  /* Light-only, same decision as the outlet board (2026-09-08). Desktop-first: the coordinators work on a laptop. */

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Barlow", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px;
    line-height: 1.35;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .display {
    font-family: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
    font-weight: 700;
    letter-spacing: 0.005em;
  }
  button { font-family: inherit; }
  .app {
    max-width: 1480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    padding: 0 16px;
  }
  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    padding: 8px 16px;
    margin: 12px 0 0;
    border-radius: 12px;
  }
  .banner small { display: block; font-weight: 400; letter-spacing: 0; text-transform: none; font-size: 14px; }

  /* ---------- Header band ---------- */
  .head {
    position: relative;
    background: var(--chrome);
    background: var(--chrome-grad);
    color: var(--chrome-ink);
    padding: 16px 22px 16px;
    margin: 12px 0 0;
    border-radius: 18px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .head-main { flex: 1 1 260px; min-width: 0; }
  .kicker { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.8; font-weight: 600; }
  .scope { font-size: 30px; line-height: 1; margin-top: 4px; overflow-wrap: anywhere; }
  .meta { display: flex; flex-wrap: wrap; gap: 6px 22px; font-size: 15px; opacity: 0.95; align-items: center; }
  .meta span { white-space: nowrap; }
  .meta .lbl { opacity: 0.7; margin-right: 5px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .meta strong { font-weight: 600; }
  .updated { font-size: 14px; display: inline-block; padding: 4px 12px; border-radius: 999px; background: var(--chrome-soft); white-space: nowrap; }
  .updated.stale { background: var(--amber); color: #FFFFFF; font-weight: 600; }

  /* ---------- Tiles (one per item) ---------- */
  .tiles {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    gap: 10px;
    padding: 14px 0 0;
  }
  .tile {
    all: unset;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 12px 14px 10px;
    border-radius: 14px;
    background: var(--surface);
    box-shadow: var(--shadow);
    cursor: pointer;
    border: 2px solid transparent;
    min-width: 0;
    -webkit-tap-highlight-color: transparent;
  }
  .tile:hover { border-color: var(--line); }
  .tile:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .tile.on, .tile.on:hover { border-color: var(--chrome); }
  .tile .n { font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--pending); }
  .tile.clear .n { color: var(--done); }
  .tile .t { font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .o { font-size: 12px; color: var(--overdue); font-weight: 700; white-space: nowrap; min-height: 15px; }
  .tile.all-tile { background: var(--chrome); color: var(--chrome-ink); }
  .tile.all-tile .n, .tile.all-tile .t { color: var(--chrome-ink); }
  .tile.all-tile .o { color: #FFD9D4; }
  .tile.all-tile.on { border-color: var(--ink); }

  /* ---------- Toolbar ---------- */
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 12px 0 0;
    align-items: center;
  }
  .bar .grow { flex: 1 1 auto; }
  .bar select, .bar input[type=search] {
    font: 500 14px "Barlow", sans-serif;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 7px 10px;
    min-height: 38px;
  }
  .bar input[type=search] { width: 240px; max-width: 100%; }
  .tbtn {
    all: unset;
    font: 600 14px "Barlow", sans-serif;
    padding: 0 12px;
    min-height: 38px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 10px;
    background: var(--surface);
    border: 1px solid var(--line);
    cursor: pointer;
    color: var(--ink);
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .tbtn:hover { border-color: var(--muted); }
  .tbtn:focus-visible { outline: 3px solid var(--focus); }
  .tbtn.on { background: var(--chrome); color: var(--chrome-ink); border-color: var(--chrome); }
  .tbtn.warn.on { background: var(--overdue); border-color: var(--overdue); }
  .legend { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--muted); flex-wrap: wrap; }
  .legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 4px; vertical-align: -1px; margin-right: 4px; }
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    background: var(--ink); color: #fff; font-weight: 600; font-size: 14px;
    padding: 10px 16px; border-radius: 999px; box-shadow: var(--shadow); z-index: 30;
    opacity: 0; transition: opacity 160ms ease; pointer-events: none;
  }
  .toast.show { opacity: 1; }

  /* ---------- Headline ---------- */
  .headline { padding: 14px 4px 8px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .headline .big { font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
  .headline .sub { font-size: 15px; font-weight: 500; color: var(--muted); }
  .headline.is-pending .big { color: var(--pending); }
  .headline.is-clear .big { color: var(--done); }
  .headline .overdue-note { font-weight: 600; color: var(--overdue); }
  .headline .hint { margin-left: auto; font-size: 14px; color: var(--muted); }

  /* ---------- Matrix table (desktop) ---------- */
  .wrap {
    background: var(--surface);
    border-radius: 16px;
    box-shadow: var(--shadow);
    overflow: auto;
    max-height: calc(100vh - 120px);
    margin-bottom: 20px;
  }
  table.mx { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1000px; font-size: 14px; table-layout: fixed; }
  .mx th, .mx td { padding: 0; vertical-align: top; border-bottom: 1px solid var(--line-soft); }
  .mx thead th {
    position: sticky; top: 0; z-index: 3;
    background: var(--surface);
    border-bottom: 2px solid var(--line);
    text-align: left;
    font-weight: 600;
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.02em;
  }
  .mx thead th .hb {
    all: unset; display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 10px 10px 8px; cursor: pointer; box-sizing: border-box;
  }
  .mx thead th .hb:hover { background: var(--ground); }
  .mx thead th .hb:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .mx thead th .hb .hn { color: var(--ink); font-size: 14px; }
  .mx thead th .hb .hc { font-size: 12px; font-weight: 500; }
  .mx thead th .hb .hc b { color: var(--pending); font-weight: 700; }
  .mx thead th .hb .hc i { color: var(--overdue); font-style: normal; font-weight: 700; }
  .mx thead th.sorted .hb .hn::after { content: " ▾"; color: var(--muted); }
  .mx thead th.sorted.asc .hb .hn::after { content: " ▴"; }
  .mx th.c-outlet, .mx td.c-outlet { position: sticky; left: 0; z-index: 2; background: var(--surface); min-width: 230px; max-width: 260px; }
  .mx thead th.c-outlet { z-index: 4; }
  .mx td.c-outlet { border-right: 1px solid var(--line); }
  .mx tr:hover td { background: #FBFAF7; }
  .mx tr.sel td { background: #F1EFE8; }
  .mx td.c-outlet .ob { display: flex; gap: 10px; align-items: center; padding: 8px 10px; }
  .brand-dot {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 9px;
    display: inline-flex; align-items: center; justify-content: center;
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 14px; color: #fff;
    background: #4F5761;
  }
  .brand-dot.BF { background: #2E4466; }
  .brand-dot.FE { background: #3D6450; }
  .code { font-weight: 700; font-size: 14px; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; letter-spacing: 0.02em; white-space: nowrap; }
  .oname { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
  .mx td.c-pic { padding: 12px 10px; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 0.05em; white-space: nowrap; }
  .mx td.c-cnt { padding: 10px 12px; text-align: center; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 20px; color: var(--pending); font-variant-numeric: tabular-nums; }
  .mx td.c-cnt.clear { color: var(--done); }
  .mx td.c-cnt.over { color: var(--overdue); }
  .mx td.cell { min-width: 138px; }
  .cb {
    all: unset; display: block; width: 100%; box-sizing: border-box; padding: 7px 10px 7px 9px; min-height: 50px; cursor: pointer;
    border-left: 3px solid transparent;
  }
  .cb:hover { background: var(--ground); }
  .cb:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; }
  .cb.sel { background: var(--ground); }
  .cb.overdue { border-left-color: var(--overdue); }
  .cb.pending { border-left-color: var(--pending); }
  .cb.chased { border-left-color: var(--amber); }
  .cb .st { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.3; }
  .cb .st.done { background: var(--done-bg); color: var(--done); }
  .cb .st.pending { background: var(--pending-bg); color: var(--pending); }
  .cb .st.upcoming { background: var(--upcoming-bg); color: var(--upcoming); }
  .cb .st.overdue { background: var(--overdue); color: #fff; }
  .cb .st.chased { background: var(--amber-bg); color: var(--amber); }
  .cb .sm { display: block; margin-top: 3px; font-size: 12.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cb.done .sm, .cb.upcoming .sm { color: var(--muted); }
  .cb .dd { display: block; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .cb.overdue .dd { color: var(--overdue); font-weight: 600; }
  .mx td.cell.na { color: var(--line); text-align: center; padding-top: 16px; font-size: 14px; }
  .mx td.cell.wide .cb .sm { max-width: none; white-space: normal; }
  .mx .empty-row td { padding: 22px; color: var(--muted); text-align: center; }

  /* ---------- Detail drawer ---------- */
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100vw;
    background: var(--surface); box-shadow: -8px 0 30px rgba(60,50,30,0.16); z-index: 20;
    transform: translateX(105%); transition: transform 180ms ease;
    display: flex; flex-direction: column;
  }
  .drawer.open { transform: none; }
  @media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
  .drawer .dh { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 12px; align-items: flex-start; }
  .drawer .dh .dm { flex: 1 1 auto; min-width: 0; }
  .drawer .dh .code { font-size: 20px; }
  .drawer .dh .oname { max-width: none; white-space: normal; font-size: 14px; }
  .drawer .dh .pic-tag { font-size: 12px; font-weight: 700; letter-spacing: 0.05em; color: var(--muted); }
  .xbtn { all: unset; width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; cursor: pointer; color: var(--muted); background: var(--ground); flex: 0 0 auto; }
  .xbtn:hover { color: var(--ink); }
  .xbtn:focus-visible { outline: 3px solid var(--focus); }
  .drawer .db { padding: 16px 20px 24px; overflow: auto; flex: 1 1 auto; }
  .drawer .item-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .drawer .item-title .lbl { font-weight: 600; font-size: 18px; }
  .ico { flex: 0 0 38px; width: 38px; height: 38px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; }
  .ico svg { width: 22px; height: 22px; display: block; }
  .ico.done { background: var(--done-bg); color: var(--done); }
  .ico.pending { background: var(--pending-bg); color: var(--pending); }
  .ico.overdue { background: var(--pending-bg); color: var(--overdue); }
  .ico.upcoming { background: var(--upcoming-bg); color: var(--upcoming); }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; white-space: nowrap; line-height: 1.2; }
  .pill.done { background: var(--done-bg); color: var(--done); }
  .pill.pending { background: var(--pending-bg); color: var(--pending); }
  .pill.upcoming { background: var(--upcoming-bg); color: var(--upcoming); }
  .pill.overdue { background: var(--overdue); color: #FFFFFF; }
  .pill.chased { background: var(--amber-bg); color: var(--amber); }
  .drawer .summary { margin: 8px 0 4px; font-size: 16px; }
  .drawer .duetxt { font-size: 14px; color: var(--muted); }
  .drawer .duetxt.overdue { color: var(--overdue); font-weight: 600; }
  .detail ul { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .detail li { padding: 9px 12px; background: var(--ground); border-radius: 10px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; font-size: 14px; }
  .detail .empty { color: var(--muted); margin-top: 12px; }
  .steps { margin: 12px 0 0; padding: 0; list-style: none; }
  .step { display: flex; align-items: center; gap: 10px; padding: 6px 0; color: var(--muted); font-size: 14px; }
  .step .n { flex: 0 0 24px; width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; border: 2px solid var(--line); }
  .step.done { color: var(--ink); }
  .step.done .n { background: var(--done); border-color: var(--done); color: #fff; }
  .step.current { color: var(--ink); font-weight: 600; }
  .step.current .n { border-color: var(--pending); color: var(--pending); }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  .abtn { all: unset; font: 600 14px "Barlow", sans-serif; padding: 9px 14px; border-radius: 999px; background: var(--ground); border: 1px solid var(--line); cursor: pointer; }
  .abtn:hover { border-color: var(--muted); }
  .abtn:focus-visible { outline: 3px solid var(--focus); }
  .abtn.on { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-bg); }
  .others { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 12px; }
  .others h3 { margin: 0 0 6px; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .others .ob-row { all: unset; display: flex; width: 100%; box-sizing: border-box; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 10px; cursor: pointer; }
  .others .ob-row:hover { background: var(--ground); }
  .others .ob-row:focus-visible { outline: 3px solid var(--focus); }
  .others .ob-row .l { flex: 1 1 auto; min-width: 0; font-weight: 600; font-size: 14px; }
  .others .ob-row .s { display: block; font-weight: 400; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .others .ob-row .d { flex: 0 0 auto; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .others .ob-row.overdue .d { color: var(--overdue); font-weight: 700; }

  /* ---------- Narrow-screen fallback: card lists ---------- */
  .list { margin: 0 0 24px; display: flex; flex-direction: column; gap: 8px; }
  .row { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow); overflow: hidden; }
  .row-btn { all: unset; display: flex; width: 100%; align-items: center; gap: 10px; padding: 11px 14px 11px 12px; min-height: 60px; cursor: pointer; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  .row-btn:focus-visible { outline: 3px solid var(--focus); outline-offset: -3px; border-radius: 16px; }
  .row-main { flex: 1 1 auto; min-width: 0; }
  .row-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .row .oname { max-width: none; white-space: normal; }
  .row .summary { margin-top: 3px; font-size: 14px; display: block; }
  .row.done .summary, .row.upcoming .summary { color: var(--muted); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .tag { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--pending-bg); color: var(--pending); white-space: nowrap; }
  .tag.overdue { background: var(--overdue); color: #fff; }
  .tag.upcoming { background: var(--upcoming-bg); color: var(--upcoming); }
  .tag.chased { background: var(--amber-bg); color: var(--amber); }
  .pic-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); background: var(--ground); padding: 2px 7px; border-radius: 999px; white-space: nowrap; }
  .due { flex: 0 0 auto; text-align: right; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; line-height: 1.25; }
  .due strong { display: block; font-weight: 700; color: var(--ink); font-size: 14px; }
  .row.overdue .due strong { color: var(--overdue); }
  .cnt { flex: 0 0 auto; font-size: 22px; line-height: 1; color: var(--pending); font-variant-numeric: tabular-nums; }
  .cnt.clear { color: var(--done); }
  .chev { flex: 0 0 auto; width: 11px; height: 11px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: 0 4px 4px 0; }
  .row.open .chev { transform: rotate(225deg); margin: 4px 4px 0 0; }
  .row .detail { padding: 0 14px 14px; font-size: 14px; }
  .sub-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .sub-row:first-child { border-top: 0; }
  .sub-row .l { font-weight: 600; flex: 1 1 auto; min-width: 0; }
  .sub-row .s { color: var(--muted); font-size: 13px; display: block; font-weight: 400; }
  .sub-row .d { flex: 0 0 auto; font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
  .sub-row.overdue .d { color: var(--overdue); font-weight: 700; }

  .foot { margin-top: auto; padding: 0 0 22px; font-size: 13px; color: var(--muted); text-align: center; }

  .sk { background: var(--skeleton); border-radius: 6px; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }

  .msg { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px 28px; gap: 14px; }
  .msg .icon { width: 64px; height: 64px; border-radius: 50%; background: var(--upcoming-bg); color: var(--muted); display: flex; align-items: center; justify-content: center; font-size: 34px; line-height: 1; }
  .msg h1 { margin: 0; font-size: 30px; line-height: 1.1; text-wrap: balance; }
  .msg p { margin: 0; font-size: 17px; color: var(--muted); max-width: 34ch; text-wrap: balance; }

  @media (max-width: 1100px) {
    .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (max-width: 760px) {
    .app { padding: 0 10px; }
    .tiles { display: flex; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
    .tiles::-webkit-scrollbar { display: none; }
    .tile { flex: 0 0 auto; min-width: 96px; }
    .bar input[type=search] { width: 100%; flex: 1 1 140px; }
    .legend { display: none; }
    .headline .hint { margin-left: 0; flex: 1 0 100%; }
    .scope { font-size: 26px; }
  }
</style>

<div class="app" id="app" aria-live="polite">

<script>
(function () {
  'use strict';

  var STALE_MS = 48 * 60 * 60 * 1000;
  var STATIC_DIR = 'c/';
  var POLL_MS = 5 * 60 * 1000;
  var CHASED_KEY = 'coord.chased';
  var CHASED_TTL_DAYS = 21;
  var NO_PUNCHCARD_CHAINS = { PG: true, SG: true };
  var NARROW = 760;

  /* The coordinator's weekly list, in chase order. `short` is the tile / column name. */
  var TASKS = [
    { id: 'it_in',        short: 'IT',            title: 'IT to outlet' },
    { id: 'timetable',    short: 'Timetable',     title: 'Timetable' },
    { id: 'ranking',      short: 'Ranking',       title: 'Ranking submission' },
    { id: 'ticket_week',  short: 'Weekly sales',  title: 'Weekly ticketing' },
    { id: 'stocktake',    short: 'Closing',       title: 'Month close / stocktake' },
    { id: 'ticket_month', short: 'Monthly sales', title: 'Monthly ticketing' },
    { id: 'punchcard',    short: 'Punchcard',     title: 'Punchcard' }
  ];
  var TASK_BY_ID = {};
  TASKS.forEach(function (t) { TASK_BY_ID[t.id] = t; });

  var DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  var app = document.getElementById('app');
  var drawer = document.getElementById('drawer');
  var toastEl = document.getElementById('toast');
  var rendered = false;
  var lastDoc = null, lastDemo = false;

  /* UI state, kept across re-renders and polls */
  function freshUi() { return { view: 'all', task: null, pic: '', brand: '', q: '', overdueOnly: false, showDone: false, sort: null, asc: false, sel: null, qFocus: false }; }
  var ui = freshUi();
  var openRows = {};
  var chased = loadChased();

  function isNarrow() { return window.innerWidth < NARROW; }

  /* ---------- Helpers ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function parseDate(s) {
    if (!s || typeof s !== 'string') return null;
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    var d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
  }
  function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fmtDay(d) { return DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()]; }
  function fmtShort(d) { return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
  function fmtStamp(d) {
    var h = d.getHours(), mi = d.getMinutes();
    var ap = h >= 12 ? 'pm' : 'am';
    var h12 = h % 12; if (h12 === 0) h12 = 12;
    return fmtDay(d) + ', ' + h12 + ':' + (mi < 10 ? '0' : '') + mi + ' ' + ap;
  }
  function startOfToday() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function pickText(v, fallback) { return (typeof v === 'string' && v.trim()) ? v : fallback; }
  function titleCase(s) {
    return String(s || '').toLowerCase().replace(/(^|[\s\-\/(])([a-z])/g, function (m, p, c) { return p + c.toUpperCase(); });
  }
  function toast(text) {
    toastEl.textContent = text;
    toastEl.classList.add('show');
    clearTimeout(toast.t);
    toast.t = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  /* ---------- "Chased" ticks: this browser only, never sent anywhere ---------- */
  function loadChased() {
    try {
      var raw = localStorage.getItem(CHASED_KEY);
      var obj = raw ? JSON.parse(raw) : {};
      var cutoff = Date.now() - CHASED_TTL_DAYS * 86400000;
      var out = {};
      Object.keys(obj).forEach(function (k) { var t = new Date(obj[k]).getTime(); if (t > cutoff) out[k] = obj[k]; });
      return out;
    } catch (e) { return {}; }
  }
  function saveChased() { try { localStorage.setItem(CHASED_KEY, JSON.stringify(chased)); } catch (e) {} }
  function chaseKey(row) { return row.outlet + '|' + row.id + '|' + (row.due ? iso(row.due) : '') + '|' + row.summary; }

  /* ---------- Row normalisation (same rules as the outlet page) ---------- */
  function normaliseOutlet(o, today) {
    var chain = String(o.chain || '').toUpperCase();
    var items = Array.isArray(o.items) ? o.items : [];
    var rows = [], byId = {};
    items.forEach(function (it) {
      if (!it || typeof it !== 'object' || !it.id) return;
      var status = String(it.status || '').toLowerCase();
      if (status === 'na') return;
      if (it.id === 'stocktake' && !(it.stocktake && typeof it.stocktake === 'object')) return;
      if (it.id === 'punchcard' && NO_PUNCHCARD_CHAINS[chain]) return;
      if (status !== 'done' && status !== 'pending' && status !== 'upcoming') status = 'pending';
      var due = parseDate(it.due);
      if (it.id === 'ranking' && status === 'upcoming' && due && today.getFullYear() === due.getFullYear() && today.getMonth() === due.getMonth() && today.getDate() >= 15) status = 'pending';
      var overdue = status === 'pending' && due && due < today;
      var row = {
        outlet: o.outlet, name: o.name || '', brand: String(o.brand || '').toUpperCase(), pic: o.pic || '',
        id: String(it.id), label: pickText(it.label, (TASK_BY_ID[it.id] || {}).title || String(it.id)),
        status: status, overdue: !!overdue, due: due,
        summary: pickText(it.summary, ''),
        detail: Array.isArray(it.detail) ? it.detail.filter(function (d) { return typeof d === 'string' && d.trim(); }) : [],
        stocktake: it.id === 'stocktake' ? it.stocktake : null,
        asOf: parseDate(it.asOf)
      };
      row.chasedAt = chased[chaseKey(row)] ? parseDate(chased[chaseKey(row)]) : null;
      rows.push(row); byId[row.id] = row;
    });
    return { outlet: o.outlet, name: o.name || '', brand: String(o.brand || '').toUpperCase(), chain: chain, pic: o.pic || '', region: o.region || '', rows: rows, byId: byId };
  }

  function filteredOutlets(doc) {
    var today = startOfToday();
    var q = ui.q.trim().toLowerCase();
    var out = [];
    (Array.isArray(doc.outlets) ? doc.outlets : []).forEach(function (o) {
      if (ui.pic && String(o.pic || '') !== ui.pic) return;
      if (ui.brand && String(o.brand || '').toUpperCase() !== ui.brand) return;
      if (q && (String(o.outlet || '') + ' ' + String(o.name || '') + ' ' + String(o.pic || '')).toLowerCase().indexOf(q) < 0) return;
      out.push(normaliseOutlet(o, today));
    });
    return out;
  }

  /* ---------- Icons ---------- */
  var SVG_OPEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">';
  var ICONS = {
    ticket_week: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
    ticket_month: '<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>',
    ranking: '<path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 3M16 6h3a3 3 0 0 1-3 3"/><path d="M12 13v4M8 21h8M9 17h6"/>',
    timetable: '<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M8 3v4M16 3v4"/><path d="M8 14h3M13 14h3M8 17h3"/>',
    it_in: '<path d="M4 8l8-4 8 4v8l-8 4-8-4z"/><path d="M4 8l8 4 8-4M12 12v8"/>',
    stocktake: '<rect x="5" y="4" width="14" height="17" rx="2.5"/><path d="M9 4V3h6v1M9 13l2 2 4-4"/>',
    punchcard: '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
    _default: '<circle cx="12" cy="12" r="8.5"/><path d="M12 8v5M12 16h.01"/>'
  };
  function iconFor(id) { return SVG_OPEN + (ICONS[id] || ICONS._default) + '</svg>'; }

  /* ---------- Sorting ---------- */
  function rank(r) { if (!r) return 5; return r.overdue ? 0 : (r.status === 'pending' ? 1 : (r.status === 'upcoming' ? 2 : 3)); }
  function rowSort(a, b) {
    var ra = rank(a), rb = rank(b);
    if (ra !== rb) return ra - rb;
    var da = a.due ? a.due.getTime() : Infinity, db = b.due ? b.due.getTime() : Infinity;
    if (da !== db) return da - db;
    return a.outlet < b.outlet ? -1 : (a.outlet > b.outlet ? 1 : 0);
  }
  function outletStats(o) {
    var pend = 0, over = 0;
    o.rows.forEach(function (r) { if (r.status === 'pending') { pend++; if (r.overdue) over++; } });
    return { pend: pend, over: over };
  }
  function outletSort(a, b) {
    var col = ui.sort, dir = ui.asc ? 1 : -1;
    if (col && TASK_BY_ID[col]) {
      var ra = rank(a.byId[col]), rb = rank(b.byId[col]);
      if (ra !== rb) return (ra - rb) * (ui.asc ? -1 : 1);
      var da = a.byId[col] && a.byId[col].due ? a.byId[col].due.getTime() : Infinity, db = b.byId[col] && b.byId[col].due ? b.byId[col].due.getTime() : Infinity;
      if (da !== db) return da - db;
      return a.outlet < b.outlet ? -1 : 1;
    }
    if (col === 'outlet') return (a.outlet < b.outlet ? -1 : 1) * dir;
    if (col === 'pic') { if (a.pic !== b.pic) return (a.pic < b.pic ? -1 : 1) * dir; return a.outlet < b.outlet ? -1 : 1; }
    var sa = outletStats(a), sb = outletStats(b);
    if (sa.over !== sb.over) return (sb.over - sa.over) * (ui.asc ? -1 : 1);
    if (sa.pend !== sb.pend) return (sb.pend - sa.pend) * (ui.asc ? -1 : 1);
    return a.outlet < b.outlet ? -1 : 1;
  }

  /* ---------- Counts, tiles, toolbar ---------- */
  function counts(outlets) {
    var c = { all: { pending: 0, overdue: 0, outlets: 0 } };
    TASKS.forEach(function (t) { c[t.id] = { pending: 0, overdue: 0, done: 0, upcoming: 0 }; });
    outlets.forEach(function (o) {
      var any = false;
      o.rows.forEach(function (r) {
        var k = c[r.id] || (c[r.id] = { pending: 0, overdue: 0, done: 0, upcoming: 0 });
        k[r.status]++;
        if (r.status === 'pending') { any = true; c.all.pending++; if (r.overdue) { k.overdue++; c.all.overdue++; } }
      });
      if (any) c.all.outlets++;
    });
    return c;
  }
  function tilesHtml(c) {
    var html = '<div class="tiles" role="tablist">';
    html += '<button class="tile all-tile' + (ui.view === 'all' ? ' on' : '') + '" type="button" data-view="all" role="tab" aria-selected="' + (ui.view === 'all') + '">' +
      '<span class="n display">' + c.all.outlets + '</span><span class="t">outlets to chase</span><span class="o">' + (c.all.overdue ? c.all.overdue + ' overdue' : '') + '</span></button>';
    TASKS.forEach(function (t) {
      var k = c[t.id];
      var on = ui.view === 'task' && ui.task === t.id;
      html += '<button class="tile' + (on ? ' on' : '') + (k.pending ? '' : ' clear') + '" type="button" data-task="' + esc(t.id) + '" role="tab" aria-selected="' + on + '" title="' + esc(t.title) + '">' +
        '<span class="n display">' + k.pending + '</span><span class="t">' + esc(t.short) + '</span><span class="o">' + (k.overdue ? k.overdue + ' overdue' : '') + '</span></button>';
    });
    return html + '</div>';
  }
  function barHtml(doc) {
    var pics = {};
    (doc.outlets || []).forEach(function (o) { if (o.pic) pics[o.pic] = 1; });
    var picList = Object.keys(pics).sort();
    var html = '<div class="bar">';
    if (doc.kind !== 'pic' && picList.length > 1) {
      html += '<select id="f-pic" aria-label="Supervisor"><option value="">All supervisors</option>' +
        picList.map(function (p) { return '<option value="' + esc(p) + '"' + (ui.pic === p ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '</select>';
    }
    html += '<select id="f-brand" aria-label="Brand"><option value="">All brands</option>' +
      ['AD', 'BF', 'FE'].map(function (b) { return '<option value="' + b + '"' + (ui.brand === b ? ' selected' : '') + '>' + b + '</option>'; }).join('') + '</select>';
    html += '<input id="f-q" type="search" placeholder="Search outlet code, name or supervisor" value="' + esc(ui.q) + '" aria-label="Search outlet">';
    html += '<button class="tbtn warn' + (ui.overdueOnly ? ' on' : '') + '" type="button" id="f-over">Overdue only</button>';
    html += '<button class="tbtn' + (ui.showDone ? ' on' : '') + '" type="button" id="f-done">' + (ui.view === 'all' && !isNarrow() ? 'Show all-clear outlets' : 'Show done') + '</button>';
    html += '<button class="tbtn" type="button" id="f-copy" title="Copy this list as text, ready to paste into WhatsApp or email">⎘ Copy list</button>';
    html += '<span class="grow"></span>';
    html += '<span class="legend"><span><span class="sw" style="background:var(--overdue)"></span>Overdue</span><span><span class="sw" style="background:var(--pending)"></span>Pending</span><span><span class="sw" style="background:var(--upcoming)"></span>Upcoming</span><span><span class="sw" style="background:var(--done)"></span>Done</span><span><span class="sw" style="background:var(--amber)"></span>Chased</span></span>';
    return html + '</div>';
  }

  /* ---------- Matrix (desktop) ---------- */
  function cellHtml(o, r, wide) {
    if (!r) return '<td class="cell na" title="Not applicable">–</td>';
    var sel = ui.sel && ui.sel.outlet === o.outlet && ui.sel.id === r.id;
    var cls = 'cb ' + r.status + (r.overdue ? ' overdue' : '') + (r.chasedAt && r.status === 'pending' ? ' chased' : '') + (sel ? ' sel' : '');
    var st = r.status === 'done' ? '<span class="st done">✓ Done</span>' : r.status === 'upcoming' ? '<span class="st upcoming">Upcoming</span>' : (r.overdue ? '<span class="st overdue">Overdue</span>' : '<span class="st pending">Pending</span>');
    if (r.chasedAt && r.status === 'pending') st += ' <span class="st chased">Chased ' + esc(fmtShort(r.chasedAt)) + '</span>';
    var due = r.due && r.status !== 'done' ? '<span class="dd">' + (r.overdue ? 'Was due ' : 'Due ') + esc(fmtShort(r.due)) + '</span>' : '';
    var title = r.label + (r.summary ? ' — ' + r.summary : '') + (r.due ? ' (' + (r.overdue ? 'was due ' : 'due ') + fmtDay(r.due) + ')' : '');
    return '<td class="cell' + (wide ? ' wide' : '') + '"><button class="' + cls + '" type="button" data-outlet="' + esc(o.outlet) + '" data-id="' + esc(r.id) + '" title="' + esc(title) + '">' +
      st + (r.summary ? '<span class="sm">' + esc(r.summary) + '</span>' : '') + due + '</button></td>';
  }
  function headCell(key, name, count, sortable) {
    var sorted = ui.sort === key;
    var hc = '';
    if (count) hc = '<span class="hc">' + (count.pending ? '<b>' + count.pending + ' pending</b>' : '<span style="color:var(--done)">all clear</span>') + (count.overdue ? ' · <i>' + count.overdue + ' overdue</i>' : '') + '</span>';
    return '<th class="' + (key === 'outlet' ? 'c-outlet' : '') + (sorted ? ' sorted' : '') + (sorted && ui.asc ? ' asc' : '') + '" scope="col">' +
      (sortable ? '<button class="hb" type="button" data-sort="' + esc(key) + '" title="Sort by ' + esc(name) + '">' : '<span class="hb" style="cursor:default">') +
      '<span class="hn">' + esc(name) + '</span>' + hc + (sortable ? '</button>' : '</span>') + '</th>';
  }
  function matrixHtml(outlets, c, taskId) {
    var cols = taskId ? [TASK_BY_ID[taskId]] : TASKS;
    var showPic = !ui.pic && lastDoc.kind !== 'pic';
    var vis = outlets.filter(function (o) {
      if (taskId) {
        var r = o.byId[taskId];
        if (!r) return false;
        if (ui.overdueOnly) return r.overdue;
        if (ui.showDone) return true;
        return r.status === 'pending';
      }
      var s = outletStats(o);
      if (ui.overdueOnly) return s.over > 0;
      if (ui.showDone) return true;
      return s.pend > 0;
    });
    if (taskId) {
      vis.sort(function (a, b) {
        if (ui.sort === 'outlet') return (a.outlet < b.outlet ? -1 : 1) * (ui.asc ? 1 : -1);
        if (ui.sort === 'pic') { if (a.pic !== b.pic) return (a.pic < b.pic ? -1 : 1) * (ui.asc ? 1 : -1); }
        return rowSort(a.byId[taskId], b.byId[taskId]);
      });
    } else vis.sort(outletSort);

    var html = '<div class="wrap"><table class="mx"><colgroup><col style="width:236px">' + (showPic ? '<col style="width:104px">' : '') +
      cols.map(function () { return '<col>'; }).join('') + (taskId ? '' : '<col style="width:76px">') + '</colgroup><thead><tr>' +
      headCell('outlet', 'Outlet', null, true) +
      (showPic ? headCell('pic', 'Supervisor', null, true) : '');
    cols.forEach(function (t) {
      var label = t.title;
      var lbls = {}; vis.forEach(function (o) { if (o.byId[t.id]) lbls[o.byId[t.id].label] = 1; });
      var ks = Object.keys(lbls); if (ks.length === 1) label = ks[0];
      html += headCell(t.id, taskId ? label : t.short, c[t.id], true);
    });
    if (!taskId) html += headCell('count', 'Pending', null, true);
    html += '</tr></thead><tbody>';
    if (!vis.length) {
      html += '<tr class="empty-row"><td colspan="' + (cols.length + 2 + (showPic ? 1 : 0)) + '">' + (ui.overdueOnly ? 'Nothing overdue in this view.' : 'Nothing to chase in this view.') + '</td></tr>';
    }
    vis.forEach(function (o) {
      var s = outletStats(o);
      var selRow = ui.sel && ui.sel.outlet === o.outlet;
      html += '<tr' + (selRow ? ' class="sel"' : '') + '><td class="c-outlet"><div class="ob"><span class="brand-dot ' + esc(o.brand) + '" aria-hidden="true">' + esc(o.brand) + '</span><span style="min-width:0"><span class="code">' + esc(o.outlet) + '</span><span class="oname" title="' + esc(titleCase(o.name)) + '" style="display:block">' + esc(titleCase(o.name)) + '</span></span></div></td>';
      if (showPic) html += '<td class="c-pic">' + esc(o.pic) + '</td>';
      cols.forEach(function (t) { html += cellHtml(o, o.byId[t.id], !!taskId); });
      if (!taskId) html += '<td class="c-cnt' + (s.pend ? (s.over ? ' over' : '') : ' clear') + '">' + (s.pend ? s.pend : '✓') + '</td>';
      html += '</tr>';
    });
    return html + '</tbody></table></div>';
  }

  /* ---------- Narrow-screen card lists ---------- */
  function pillFor(row) {
    if (row.status === 'done') return '<span class="pill done">✓ Done</span>';
    if (row.status === 'upcoming') return '<span class="pill upcoming">○ Upcoming</span>';
    return (row.overdue ? '<span class="pill overdue">Overdue</span>' : '<span class="pill pending">! Pending</span>') +
      (row.chasedAt ? ' <span class="pill chased">Chased ' + esc(fmtShort(row.chasedAt)) + '</span>' : '');
  }
  function dueFor(row) {
    if (!row.due) return '';
    var d = fmtDay(row.due);
    if (row.status === 'done') return '<div class="due">Was due<strong>' + esc(d) + '</strong></div>';
    return '<div class="due">' + (row.overdue ? 'Was due' : 'Due') + '<strong>' + esc(d) + '</strong></div>';
  }
  function taskRowHtml(row) {
    var key = 'T|' + row.outlet + '|' + row.id;
    var open = !!openRows[key];
    var cls = 'row ' + row.status + (row.overdue ? ' overdue' : '') + (open ? ' open' : '');
    return '<div class="' + cls + '" data-key="' + esc(key) + '">' +
      '<button class="row-btn" type="button" aria-expanded="' + (open ? 'true' : 'false') + '">' +
        '<span class="brand-dot ' + esc(row.brand) + '" aria-hidden="true">' + esc(row.brand) + '</span>' +
        '<span class="row-main">' +
          '<span class="row-top"><span class="code">' + esc(row.outlet) + '</span>' + (row.pic && !ui.pic ? '<span class="pic-tag">' + esc(row.pic) + '</span>' : '') + pillFor(row) + '</span>' +
          (row.name ? '<span class="oname">' + esc(titleCase(row.name)) + '</span>' : '') +
          (row.summary ? '<span class="summary">' + esc(row.summary) + '</span>' : '') +
        '</span>' + dueFor(row) + '<span class="chev" aria-hidden="true"></span>' +
      '</button>' +
      (open ? '<div class="detail">' + stepsHtml(row) + detailList(row) + chaseButton(row) + '</div>' : '') +
    '</div>';
  }
  function outletRowHtml(o) {
    var key = 'O|' + o.outlet;
    var open = !!openRows[key];
    var pend = o.rows.filter(function (r) { return r.status === 'pending'; }).sort(rowSort);
    var upc = o.rows.filter(function (r) { return r.status === 'upcoming'; });

  /* ---------- Crypto (same contract as the outlet page) ---------- */
  function readKey() {
    var h = (location.hash || '').replace(/^#/, '').trim();
    if (!h) return null;
    if (/^demo$/i.test(h)) return 'demo';
    if (/^[0-9a-fA-F]{64}$/.test(h)) return h.toLowerCase();
    return false;
  }
  function hexToBytes(hex) { var out = new Uint8Array(hex.length / 2); for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16); return out; }
  function b64ToBytes(b64) { var bin = atob(String(b64).replace(/-/g, '+').replace(/_/g, '/')); var out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  function docIdFor(keyHex) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(keyHex)).then(function (buf) {
      var b = new Uint8Array(buf), s = '';
      for (var i = 0; i < 8; i++) s += (b[i] < 16 ? '0' : '') + b[i].toString(16);
      return s;
    });
  }
  function importKey(keyHex) { return crypto.subtle.importKey('raw', hexToBytes(keyHex), { name: 'AES-GCM' }, false, ['decrypt']); }
  function decryptDoc(cryptoKey, doc) {
    if (!doc || typeof doc.iv !== 'string' || typeof doc.ct !== 'string') return Promise.reject(new Error('bad doc'));
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(doc.iv), tagLength: 128 }, cryptoKey, b64ToBytes(doc.ct)).then(function (buf) {
      return JSON.parse(new TextDecoder().decode(buf));
    });
  }

  /* ---------- Boot ---------- */
  var pollTimer = null;
