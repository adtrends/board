<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#9989;</text></svg>">
<style>[hidden]{display:none!important} img{max-width:100%}</style>
</head>
<body>
<title>Return Sort</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#16181d;--mute:#667085;--line:#e3e6ea;--ok:#127a3e;--okbg:#e5f5ec;--warn:#a85a00;--warnbg:#fff1dc;--bad:#b42318;--badbg:#fde8e6;--acc:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#111827;color:#fff;padding:10px 16px}
header h1{font-size:17px;margin:0}
header .mute{color:#cbd5e1}
main{max-width:720px;margin:0 auto;padding:12px 16px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.mute{color:var(--mute);font-size:13px}
#scanin{width:100%;font-size:20px;padding:12px;border:2px solid var(--acc);border-radius:10px}
#flash{margin-top:8px;border-radius:10px;padding:10px;font-weight:700;font-size:16px;display:none}
.tot{display:flex;gap:8px;text-align:center}
.tot div{flex:1;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 4px}
.tot b{display:block;font-size:22px}
.it{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:0}
.it .no{font-family:ui-monospace,Consolas,monospace;font-weight:700;font-size:15px}
.it .bd{flex:1;min-width:0}
.it .pc{font-weight:700;font-size:17px;min-width:44px;text-align:right}
.it button{border:0;background:#eef0f3;border-radius:8px;width:34px;height:34px;font-size:16px}
.tag{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap;display:inline-block;margin-top:2px}
.rej{background:#111;color:#fff}.done{background:var(--warnbg);color:var(--warn)}.unk{background:var(--badbg);color:var(--bad)}
.it.r .no{text-decoration:line-through}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 12px;font-size:15px;font-weight:600;color:var(--ink);flex:1}
.btn.p{background:var(--ok);color:#fff;border-color:var(--ok)}
h2{font-size:15px;margin:4px 0 6px}
.msg{padding:30px 16px;text-align:center;color:var(--mute)}
</style>
<!--DOC-->
<header><h1>Return Sort - scan label IT</h1><div class="mute" id="sub"></div></header>
<div style="max-width:720px;margin:0 auto;padding:12px 16px 0"><div id="cam"></div></div>
<main id="app"><div class="msg">Memuatkan...</div></main>
<script>
(function(){
  var D=null, KEY='', app=document.getElementById('app'), sub=document.getElementById('sub');
  var SK='retsort:list';
  var FORM='https://docs.google.com/forms/d/e/1FAIpQLScYDGCsuTz5QLuMjONq_6gfQXFx0hUB3bVL_WbiRG6W3AalNg/formResponse',FIELD='entry.1287064873';
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function hexToBytes(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
  function b64ToBytes(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
  function docIdFor(k){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(k)).then(function(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<8;i++)s+=(b[i]<16?'0':'')+b[i].toString(16);return s;});}
  function load(){
    if(window.__DOC){D=window.__DOC;return start();}
    KEY=(location.hash||'').slice(1).toLowerCase();
    if(!/^[0-9a-f]{64}$/.test(KEY)){app.innerHTML='<div class="msg">Link tidak lengkap. Buka semula link penuh dari WhatsApp.</div>';return;}
    var ck='retsort-doc:'+KEY.slice(0,12);
    Promise.all([docIdFor(KEY),crypto.subtle.importKey('raw',hexToBytes(KEY),{name:'AES-GCM'},false,['decrypt'])]).then(function(r){
      return fetch('r/'+r[0]+'.json',{cache:'no-store'}).then(function(res){if(!res.ok)throw 0;return res.json();}).then(function(doc){
        return crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(doc.iv),tagLength:128},r[1],b64ToBytes(doc.ct)).then(function(buf){D=JSON.parse(new TextDecoder().decode(buf));try{localStorage.setItem(ck,JSON.stringify(D));}catch(e){}start();});
      });
    }).catch(function(){try{var c=localStorage.getItem(ck);if(c){D=JSON.parse(c);return start();}}catch(e){}app.innerHTML='<div class="msg">Tidak dapat buka senarai. Semak internet dan cuba lagi.</div>';});
  }
  function getL(){try{return JSON.parse(localStorage.getItem(SK)||'[]');}catch(e){return[];}}
  function putL(l){try{localStorage.setItem(SK,JSON.stringify(l));}catch(e){}}
  function norm(c){c=String(c).toUpperCase().replace(/[^A-Z0-9]/g,'');var m=c.match(/IT?(\d{8})$/)||c.match(/^(\d{8})$/);return m?'IT'+m[1]:c;}
  function info(it){return D.its[it]||null;}   // [from, pcs, itDate, status, reject, to]
  function flash(t,bg,fg){var f=document.getElementById('flash');f.style.display='block';f.style.background=bg;f.style.color=fg;f.textContent=t;
    clearTimeout(flash.t);flash.t=setTimeout(function(){f.style.display='none';},4000);}
  function add(raw){
    var it=norm(raw); if(!it)return;
    var l=getL();
    if(l.indexOf(it)>=0){flash(it+' sudah discan','#eef0f3','#16181d');return;}
    l.unshift(it); putL(l); draw();
    var x=info(it);
    if(!x)flash(it+' TIADA dalam senarai - asingkan, HQ semak','#fde8e6','#b42318');
    else if(x[4])flash(it+' REJECT - JANGAN suap, asingkan','#111','#fff');
    else if(x[3]==='Completed')flash(it+' sudah diterima dlm iDCP - asingkan, HQ semak','#fff1dc','#a85a00');
    else flash(it+' OK - '+x[0]+' - '+x[1]+' pcs','#e5f5ec','#127a3e');
  }
  function feedable(it){var x=info(it);return x&&!x[4]&&x[3]!=='Completed';}
  function report(){
    var l=getL(),f=l.filter(feedable),o=l.filter(function(i){return !feedable(i);}),p=0;
    f.forEach(function(i){p+=info(i)[1];});
    var t='RETURN SORT '+f.length+' IT, '+p+' pcs\n'+f.join('\n');
    if(o.length)t+='\nASING (jangan suap): '+o.map(function(i){var x=info(i);return i+(x?(x[4]?' REJECT':' DITERIMA'):' TIADA');}).join(', ');
    return t;
  }
  function draw(){
    var l=getL(),f=l.filter(feedable),p=0,ctn=0;
    f.forEach(function(i){p+=info(i)[1];});
    var h='<div class="card"><input id="scanin" placeholder="Scan barcode label IT" autocomplete="off" inputmode="text" enterkeyhint="go">'+
      '<div id="flash"></div><div class="row"><button class="btn" id="cambtn">&#128247; '+(scanner?'Tutup kamera':'Kamera')+'</button><button class="btn" id="typ">&#9000; Taip no IT</button></div>'+
      '<div class="mute" style="margin-top:6px">Scan label setiap karton yang akan disuap (scanner, atau tekan Kamera untuk guna kamera telefon). Label REJECT atau tiada dalam senarai = asingkan.</div></div>'+
      '<div class="card tot"><div><b>'+f.length+'</b>IT untuk suap</div><div><b>'+p+'</b>pcs</div><div><b>'+(l.length-f.length)+'</b>asing</div></div>';
    if(l.length){
      h+='<div class="card"><h2>Senarai ('+l.length+')</h2>';
      l.forEach(function(it){var x=info(it),tg='';
        if(!x)tg='<span class="tag unk">TIADA DALAM SENARAI</span>';
        else{if(x[4])tg+='<span class="tag rej">REJECT - JANGAN SUAP</span> ';if(x[3]==='Completed')tg+='<span class="tag done">SUDAH DITERIMA</span>';}
        h+='<div class="it'+(feedable(it)?'':' r')+'"><div class="bd"><div class="no">'+esc(it)+'</div><div class="mute">'+(x?esc(x[0])+' &middot; '+esc(x[2])+' &rarr; '+esc(x[5]):'')+'</div>'+tg+'</div>'+
           '<div class="pc">'+(x?x[1]:'?')+'</div><button data-del="'+esc(it)+'" aria-label="Buang">&times;</button></div>';});
      h+='</div><div class="row"><button class="btn p" id="send">Hantar ke HQ</button></div>'+
         '<div class="row"><button class="btn" id="clr">Kosongkan senarai</button></div>';
    }
    app.innerHTML=h;
    var inp=document.getElementById('scanin');if(!scanner)inp.focus();
    document.getElementById('cambtn').onclick=toggleCam;
    document.getElementById('typ').onclick=function(){inp.setAttribute('inputmode','text');inp.placeholder='Taip no IT, contoh IT26101386, tekan Enter';inp.blur();setTimeout(function(){inp.focus();},50);};
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();var v=inp.value;inp.value='';add(v);}});
    inp.addEventListener('input',function(){var v=inp.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(/^IT\d{8}$/.test(v)){clearTimeout(inp.t);inp.t=setTimeout(function(){if(inp.value){var x=inp.value;inp.value='';add(x);}},300);}});
    app.querySelectorAll('[data-del]').forEach(function(b){b.onclick=function(){putL(getL().filter(function(i){return i!==b.getAttribute('data-del');}));draw();};});
    var s=document.getElementById('send');
    if(s)s.onclick=function(){var t=report(),b=new URLSearchParams();b.append(FIELD,'#RETSORT v1\n'+t);
      fetch(FORM,{method:'POST',mode:'no-cors',body:b}).catch(function(){});
      location.href='https://wa.me/?text='+encodeURIComponent(t);};
    var c=document.getElementById('clr');
    if(c)c.onclick=function(){if(confirm('Kosongkan senarai? (buat selepas wave return siap)')){putL([]);draw();}};
  }
  // Tze 5 Nov: "unable to scan the IT no" - staff use phones, page only took a USB/BT scanner. Camera like ctnscan.
  var scanner=null;
  function toggleCam(){
    if(scanner){stopCam();return;}
    function go(){
      scanner=new Html5Qrcode('cam');var last='',lt=0;
      scanner.start({facingMode:'environment'},{fps:12,qrbox:{width:300,height:130},formatsToSupport:[5,9,14,10,3,0],experimentalFeatures:{useBarCodeDetectorIfSupported:true}},
        function(txt){var n=Date.now();if(txt===last&&n-lt<2500)return;last=txt;lt=n;if(navigator.vibrate)navigator.vibrate(80);add(txt);},function(){})
        .then(function(){draw();}).catch(function(e){alert('Kamera tidak dapat dibuka: '+e);scanner=null;draw();});
    }
    if(window.Html5Qrcode)return go();
    var s=document.createElement('script');s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';s.onload=go;s.onerror=function(){alert('Kamera tidak tersedia - guna scanner.');};document.head.appendChild(s);
  }
  function stopCam(){if(scanner){var s=scanner;scanner=null;s.stop().then(function(){s.clear();draw();}).catch(function(){draw();});}}
  function start(){sub.textContent='Senarai IT dikemas kini '+D.updatedAt.replace('T',' ')+' · '+Object.keys(D.its).length+' IT return';draw();}
  load();
})();
</script>

</body>
</html>
