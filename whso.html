<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warehouse SO Board</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #F7F5F0;
    --surface: #FFFFFF;
    --ink: #1E2A3A;
    --muted: #57636F;
    --line: #E7E2D8;
    --line-soft: #F0ECE4;
    --chrome-grad: linear-gradient(135deg, #384759 0%, #4B5B70 100%);
    --chrome-ink: #FFFFFF;
    --chrome-soft: rgba(255,255,255,0.18);
    --wh21: #1F6F78;
    --wh21-bg: #D9EBEC;
    --ecom: #6A4A86;
    --ecom-bg: #E7DFF0;
    --fresh: #2A7549;      --fresh-bg: #DBEEE2;
    --watch: #8A6100;      --watch-bg: #F7EDD4;
    --late: #B8741A;       --late-bg: #F8E3CB;
    --overdue: #8C2119;    --overdue-bg: #F2CFC9;
    --chip: #EAECEE;
    --chip-ink: #3E4E62;
    --focus: #2E4466;
    --shadow: 0 1px 2px rgba(60,50,30,0.06), 0 6px 18px rgba(60,50,30,0.08);
  }
  /* Light-only, same decision as the outlet, coordinator and pending-SO boards. */

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: "Barlow", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; line-height: 1.35; overflow-x: hidden; -webkit-font-smoothing: antialiased;
  }
  .display { font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif; font-weight: 700; }
  .num { font-variant-numeric: tabular-nums; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .app { max-width: 1000px; margin: 0 auto; min-height: 100vh; }

  /* ---------- Chrome ---------- */
  .chrome { background: var(--chrome-grad); color: var(--chrome-ink); padding: 16px 18px 14px; }
  .chrome .eyebrow { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
  .chrome h1 { margin: 2px 0 0; font-size: 28px; line-height: 1.05; }
  .chrome .sub { margin: 5px 0 0; font-size: 13px; opacity: 0.85; }
  .totals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .tot { background: var(--chrome-soft); border-radius: 8px; padding: 7px 10px; }
  .tot .v { font-size: 22px; line-height: 1; }
  .tot .l { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0.85; margin-top: 3px; }
  .tot.bad .v { color: #F4C7C0; }

  /* ---------- Controls ---------- */
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    padding: 10px 14px; background: var(--surface); border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5;
  }
  .controls label { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: 3px; }
  .fld { flex: 1 1 220px; min-width: 0; }
  .fld.sm { flex: 0 1 150px; }
  select, input[type=search] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface); appearance: none;
  }
  select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%2357636F' stroke-width='2'/></svg>"); background-repeat: no-repeat; background-position: right 10px center; padding-right: 28px; }

  .wrap { padding: 12px 14px 40px; }

  /* ---------- Outlet list ---------- */
  .olist { display: grid; gap: 7px; }
  .orow {
    display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center;
    background: var(--surface); border: 1px solid var(--line); border-left-width: 4px;
    border-radius: 10px; padding: 9px 12px; cursor: pointer; text-align: left; width: 100%;
  }
  .orow:hover { box-shadow: var(--shadow); }
  .orow .nm { font-weight: 600; }
  .orow .cd { font-size: 12px; color: var(--muted); }
  .orow .rt { text-align: right; white-space: nowrap; }
  .orow .big { font-size: 19px; line-height: 1; }
  .orow .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

  /* ---------- Detail ---------- */
  .back { background: none; border: 0; color: var(--muted); padding: 4px 0 10px; cursor: pointer; font-size: 13px; }
  .head { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 13px 15px; margin-bottom: 12px; }
  .head h2 { margin: 0; font-size: 22px; }
  .head .meta { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .head .split { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-left-width: 4px; border-radius: 10px; padding: 10px 12px; margin-bottom: 7px; }
  .card .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .card .so { font-weight: 600; font-size: 16px; letter-spacing: 0.01em; }
  .card .when { font-size: 13px; color: var(--muted); }
  .card .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(88px, 1fr)); gap: 6px 12px; margin-top: 8px; }
  .card .k { font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .card .v { font-size: 15px; }
  .card .items { margin-top: 8px; font-size: 13px; color: var(--muted); }

  .chip { display: inline-block; font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 999px; letter-spacing: 0.02em; }
  .chip.wh21 { background: var(--wh21-bg); color: var(--wh21); }
  .chip.ecom { background: var(--ecom-bg); color: var(--ecom); }
  .chip.fresh { background: var(--fresh-bg); color: var(--fresh); }
  .chip.watch { background: var(--watch-bg); color: var(--watch); }
  .chip.late { background: var(--late-bg); color: var(--late); }
  .chip.overdue { background: var(--overdue-bg); color: var(--overdue); }
  .chip.no { background: var(--overdue-bg); color: var(--overdue); }
  .chip.yes { background: var(--fresh-bg); color: var(--fresh); }

  .b-fresh { border-left-color: #7FBF9B; }
  .b-watch { border-left-color: #DCC076; }
  .b-late  { border-left-color: #E0A362; }
  .b-overdue { border-left-color: #C4726A; }

  .empty { text-align: center; color: var(--muted); padding: 40px 20px; }
  .foot { color: var(--muted); font-size: 12px; padding: 14px 2px 0; line-height: 1.5; }
  .msg { text-align: center; padding: 60px 24px; }
  .msg .icon { font-size: 34px; }
  .msg h1 { font-size: 26px; margin: 8px 0 6px; }
  .msg p { color: var(--muted); margin: 0; }
</style>
</head>
<body>
<div class="app" id="app"><div class="msg"><p>Loading…</p></div></div>
<script>
(function () {
  var DOC = null, rendered = false, app = document.getElementById('app');
  var state = { outlet: '', wh: '', status: '', age: '', q: '' };

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]; }); }
  function n(v) { return Number(v || 0).toLocaleString('en-MY'); }
  function ago(d) { var t = new Date(d + 'T00:00:00+08:00'); return t.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: '2-digit' }); }

  /* ---------- Filtering ---------- */
  function soPasses(s) {
    if (state.wh && s.origin !== state.wh) return false;
    if (state.status === 'noit' && s.it) return false;
    if (state.status === 'it' && !s.it) return false;
    if (state.age && s.age < Number(state.age)) return false;
    return true;
  }
  function outletRows() {
    var q = state.q.trim().toLowerCase();
    return DOC.outlets.map(function (o) {
      var sos = o.sos.filter(soPasses);
      if (!sos.length) return null;
      if (q && (o.code + ' ' + o.name + ' ' + o.region).toLowerCase().indexOf(q) < 0) return null;
      var open = 0, noIt = 0, oldest = 0;
      sos.forEach(function (s) { open += s.open; if (!s.it) noIt++; if (s.age > oldest) oldest = s.age; });
      return { o: o, sos: sos, open: open, noIt: noIt, oldest: oldest, band: bandOf(oldest) };
    }).filter(Boolean);
  }
  function bandOf(age) {
    var bs = DOC.bands;
    for (var i = 0; i < bs.length; i++) { if (age >= bs[i].from && (bs[i].to === null || age < bs[i].to)) return bs[i].name; }
    return 'overdue';
  }

  /* ---------- Render ---------- */
  function renderAll() {
    rendered = true;
    var t = DOC.totals;
    var h = [];
    h.push('<div class="chrome">');
    h.push('<div class="eyebrow">A.D. Trends &middot; warehouse</div>');
    h.push('<h1 class="display">Open sales orders</h1>');
    h.push('<p class="sub">WH21 and e-comm only &mdash; SRA and Brisklink ship China-direct and are not on this board. Updated ' + esc(DOC.updatedAt.slice(0, 16).replace('T', ' ')) + '.</p>');
    h.push('<div class="totals">');
    h.push('<div class="tot"><div class="v num display">' + n(t.sos) + '</div><div class="l">orders open</div></div>');
    h.push('<div class="tot"><div class="v num display">' + n(t.open) + '</div><div class="l">pieces</div></div>');
    h.push('<div class="tot bad"><div class="v num display">' + n(t.noIt) + '</div><div class="l">no transfer yet</div></div>');
    h.push('<div class="tot bad"><div class="v num display">' + n(t.oldest) + 'd</div><div class="l">oldest</div></div>');
    h.push('</div></div>');

    h.push('<div class="controls">');
    h.push('<div class="fld"><label for="f-outlet">Outlet</label><select id="f-outlet"><option value="">All outlets &mdash; ' + DOC.outlets.length + '</option>' + outletOptions() + '</select></div>');
    h.push('<div class="fld sm"><label for="f-wh">Warehouse</label><select id="f-wh"><option value="">Both</option><option value="WH21">WH21</option><option value="E-comm">E-comm</option></select></div>');
    h.push('<div class="fld sm"><label for="f-status">Transfer</label><select id="f-status"><option value="">Any</option><option value="noit">Not raised yet</option><option value="it">Raised</option></select></div>');
    h.push('<div class="fld sm"><label for="f-age">Pending at least</label><select id="f-age"><option value="">Any age</option><option value="7">7 days</option><option value="14">14 days</option><option value="30">30 days</option><option value="60">60 days</option><option value="90">90 days</option></select></div>');
    h.push('</div>');

    h.push('<div class="wrap" id="wrap"></div>');
    app.innerHTML = h.join('');

    bind('f-outlet', 'outlet'); bind('f-wh', 'wh'); bind('f-status', 'status'); bind('f-age', 'age');
    document.getElementById('f-outlet').value = state.outlet;
    document.getElementById('f-wh').value = state.wh;
    document.getElementById('f-status').value = state.status;
    document.getElementById('f-age').value = state.age;
    renderBody();
  }
  function bind(id, key) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('change', function () { state[key] = el.value; renderBody(); });
  }
  function outletOptions() {
    return DOC.outlets.slice().sort(function (a, b) {
      return a.region === b.region ? a.name.localeCompare(b.name) : a.region.localeCompare(b.region);
    }).map(function (o) {
      return '<option value="' + esc(o.code) + '">' + esc(o.region + ' — ' + o.name + ' (' + o.code + ')') + '</option>';
    }).join('');
  }

  function renderBody() {
    var wrap = document.getElementById('wrap');
    if (state.outlet) { wrap.innerHTML = detailHtml(state.outlet); wireBack(); return; }
    var rows = outletRows();
    if (!rows.length) { wrap.innerHTML = '<div class="empty">Nothing matches those filters.</div>'; return; }
    var tot = rows.reduce(function (a, r) { return a + r.open; }, 0);
    var h = ['<div class="foot" style="padding-top:0;padding-bottom:8px">' + rows.length + ' outlet' + (rows.length === 1 ? '' : 's') + ' &middot; ' + n(tot) + ' pieces &middot; sorted by the oldest order waiting</div>'];
    h.push('<div class="olist">');
    rows.sort(function (a, b) { return b.oldest - a.oldest || b.open - a.open; }).forEach(function (r) {
      h.push('<button class="orow b-' + r.band + '" data-code="' + esc(r.o.code) + '">');
      h.push('<span><span class="nm">' + esc(r.o.name) + '</span><br><span class="cd">' + esc(r.o.code) + ' &middot; ' + esc(r.o.region) + ' &middot; ' + r.sos.length + ' order' + (r.sos.length === 1 ? '' : 's') + (r.noIt ? ' &middot; <b>' + r.noIt + ' with no transfer</b>' : '') + '</span></span>');
      h.push('<span class="rt"><span class="big num display">' + n(r.open) + '</span><br><span class="lbl">pcs &middot; ' + r.oldest + 'd</span></span>');
      h.push('</button>');
    });
    h.push('</div>');
    h.push(footHtml());
    wrap.innerHTML = h.join('');
    Array.prototype.forEach.call(wrap.querySelectorAll('.orow'), function (b) {
      b.addEventListener('click', function () {
        state.outlet = b.getAttribute('data-code');
        document.getElementById('f-outlet').value = state.outlet;
        renderBody(); window.scrollTo(0, 0);
      });
    });
  }

  function detailHtml(code) {
    var o = null;
    for (var i = 0; i < DOC.outlets.length; i++) { if (DOC.outlets[i].code === code) { o = DOC.outlets[i]; break; } }
    if (!o) return '<div class="empty">Outlet not found.</div>';
    var sos = o.sos.filter(soPasses);
    var open = 0, noIt = 0, wh21 = 0, ecom = 0;
    sos.forEach(function (s) { open += s.open; if (!s.it) noIt++; if (s.origin === 'WH21') wh21 += s.open; else ecom += s.open; });

    var h = ['<button class="back" id="back">&larr; All outlets</button>'];
    h.push('<div class="head">');
    h.push('<h2 class="display">' + esc(o.name) + '</h2>');
    h.push('<div class="meta">' + esc(o.code) + ' &middot; ' + esc(o.brand) + ' &middot; ' + esc(o.region) + '</div>');
    h.push('<div class="split">');
    h.push('<span class="chip wh21">WH21 &middot; ' + n(wh21) + ' pcs</span>');
    h.push('<span class="chip ecom">E-comm &middot; ' + n(ecom) + ' pcs</span>');
    h.push('<span class="chip ' + (noIt ? 'no' : 'yes') + '">' + (noIt ? noIt + ' with no transfer' : 'all transfers raised') + '</span>');
    h.push('</div></div>');

    if (!sos.length) { h.push('<div class="empty">No orders match those filters for this outlet.</div>'); return h.join(''); }
    h.push('<div class="foot" style="padding-top:0;padding-bottom:8px">' + sos.length + ' order' + (sos.length === 1 ? '' : 's') + ' &middot; ' + n(open) + ' pieces open &middot; newest first by age</div>');

    sos.forEach(function (s) {
      h.push('<div class="card b-' + s.band + '">');
      h.push('<div class="top"><span class="so num">' + esc(s.so) + '</span>');
      h.push('<span><span class="chip ' + (s.origin === 'WH21' ? 'wh21' : 'ecom') + '">' + esc(s.origin) + '</span> <span class="chip ' + s.band + '">' + s.age + ' days</span></span></div>');
      h.push('<div class="when">Raised ' + ago(s.date) + (s.by ? ' by ' + esc(s.by) : '') + '</div>');
      h.push('<div class="grid">');
      h.push('<div><div class="k">Ordered</div><div class="v num">' + n(s.ordered) + '</div></div>');
      h.push('<div><div class="k">Still open</div><div class="v num"><b>' + n(s.open) + '</b></div></div>');
      h.push('<div><div class="k">Transfer</div><div class="v">' + (s.it ? '<span class="num">' + esc(s.it) + '</span>' + (s.nIt > 1 ? ' <span class="cd">+' + (s.nIt - 1) + '</span>' : '') : '<span class="chip no">not raised</span>') + '</div></div>');
      h.push('</div>');
      if (s.groups && s.groups.length) {
        h.push('<div class="items">' + s.groups.map(function (g) { return esc(g.g) + ' <b class="num">' + n(g.q) + '</b>'; }).join(' &nbsp;&middot;&nbsp; ') + '</div>');
      }
      if (s.remark) h.push('<div class="items">Remark: ' + esc(s.remark) + '</div>');
      h.push('</div>');
    });
    h.push(footHtml());
    return h.join('');
  }
  function wireBack() {
    var b = document.getElementById('back');
    if (b) b.addEventListener('click', function () {
      state.outlet = ''; document.getElementById('f-outlet').value = '';
      renderBody(); window.scrollTo(0, 0);
    });
  }
  function footHtml() {
    return '<div class="foot">An order is listed while it still has outstanding quantity. '
      + '&ldquo;No transfer&rdquo; means no inter-transfer has been raised against it at all. '
      + 'Source: ' + esc(DOC.source.report) + ', pulled ' + esc(DOC.source.pulledAt.slice(0, 16).replace('T', ' ')) + '. '
      + 'SRA and Brisklink orders ship China-direct to the door and are excluded by design.</div>';
  }

  /* ---------- Messages ---------- */
  function showInvalid() { rendered = true; app.innerHTML = '<div class="msg"><div class="icon">?</div><h1 class="display">This link isn’t valid.</h1><p>Ask HQ for the warehouse SO link &mdash; it carries the key after the #.</p></div>'; }
  function showOffline() { rendered = true; app.innerHTML = '<div class="msg"><div class="icon">!</div><h1 class="display">Couldn’t load the board.</h1><p>Check the connection, then reopen the link.</p></div>'; }

  /* ---------- Crypto (same contract as push_board.py) ---------- */
  function readKey() { var h = (location.hash || '').replace(/^#/, '').trim(); if (!h) return null; if (/^[0-9a-fA-F]{64}$/.test(h)) return h.toLowerCase(); return false; }
  function hexToBytes(hex) { var out = new Uint8Array(hex.length / 2); for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16); return out; }
  function b64ToBytes(b64) { var bin = atob(String(b64).replace(/-/g, '+').replace(/_/g, '/')); var out = new Uint8Array(bin.length); for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
  function docIdFor(keyHex) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(keyHex)).then(function (buf) {
      var b = new Uint8Array(buf), s = ''; for (var i = 0; i < 8; i++) s += (b[i] < 16 ? '0' : '') + b[i].toString(16); return s;
    });
  }
  function importKey(keyHex) { return crypto.subtle.importKey('raw', hexToBytes(keyHex), { name: 'AES-GCM' }, false, ['decrypt']); }
  function decryptDoc(cryptoKey, doc) {
    if (!doc || typeof doc.iv !== 'string' || typeof doc.ct !== 'string') return Promise.reject(new Error('bad doc'));
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(doc.iv), tagLength: 128 }, cryptoKey, b64ToBytes(doc.ct)).then(function (buf) { return JSON.parse(new TextDecoder().decode(buf)); });
  }

  /* ---------- Boot ---------- */
  var STATIC_DIR = 'w/';
  var POLL_MS = 5 * 60 * 1000;
  function boot() {
    if (!window.crypto || !crypto.subtle) { showOffline(); return; }
    var key = readKey();
    if (key === null || key === false) { showInvalid(); return; }
    Promise.all([docIdFor(key), importKey(key)]).then(function (r) {
      var url = STATIC_DIR + r[0] + '.json', cryptoKey = r[1], lastText = null;
      function load(isPoll) {
        return fetch(url, { cache: 'no-store' }).then(function (res) {
          if (res.status === 404) { if (!isPoll) showInvalid(); return; }
          if (!res.ok) throw new Error('http ' + res.status);
          return res.text().then(function (text) {
            if (isPoll && text === lastText) return;
            lastText = text;
            var doc; try { doc = JSON.parse(text); } catch (e) { if (!isPoll) showInvalid(); return; }
            return decryptDoc(cryptoKey, doc).then(function (d) { DOC = d; renderAll(); }, function () { if (!isPoll) showInvalid(); });
          });
        }).catch(function () { if (!isPoll && !rendered) showOffline(); });
      }
      load(false);
      setInterval(function () { if (!document.hidden) load(true); }, POLL_MS);
    });
  }
  window.addEventListener('hashchange', function () { location.reload(); });
  boot();
})();
</script>
</body>
</html>
