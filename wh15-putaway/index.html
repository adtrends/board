<style>
[hidden]{display:none!important}
:root{--bg:#eef0f3;--card:#fff;--ink:#0f1115;--mute:#4b5563;--line:#cfd4db;--ok:#0d6b34;--okbg:#dff5e8;--warn:#8a4b00;--warnbg:#fff0d6;--bad:#b42318;--badbg:#fde4e1;--acc:#1d4ed8}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.35 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
header{background:#111827;color:#fff;padding:8px 12px 10px}
header h1{font-size:18px;margin:0 0 6px;font-weight:800;letter-spacing:.3px}
select,input,button{font:inherit}
#wave{width:100%;min-height:48px;font-size:18px;padding:8px;border-radius:10px;border:0;background:#fff;color:#111}
#waveinfo{font-size:16px;color:#e5e7eb;margin-top:6px;display:flex;flex-wrap:wrap;gap:6px 12px}
#waveinfo b{color:#fff}
.tabs{display:flex;gap:8px;margin-top:8px}
.tabs button{flex:1;min-height:52px;border:0;border-radius:10px;background:#374151;color:#fff;font-size:18px;font-weight:800}
.tabs button.on{background:#facc15;color:#111}
main{max-width:720px;margin:0 auto;padding:12px 12px 24px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.mute{color:var(--mute);font-size:16px}
.scanrow{display:flex;gap:8px}
.scanrow input{flex:1;min-width:0;min-height:60px;font-size:24px;padding:8px 12px;border:3px solid var(--acc);border-radius:12px;background:#fff;color:#111}
.btn{min-height:48px;min-width:48px;border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-size:17px;font-weight:800;color:var(--ink)}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.r{background:#fff;color:var(--bad);border-color:var(--bad)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 auto}
#res{border-radius:16px;padding:14px 12px;text-align:center;margin-top:12px;border:4px solid var(--line);background:#fff;min-height:220px}
#res.ok{border-color:var(--ok);background:var(--okbg)}
#res.over{border-color:var(--warn);background:var(--warnbg)}
#res.bad{border-color:var(--bad);background:var(--badbg)}
.flash-ok{animation:fo .5s}.flash-bad{animation:fb .6s}
@keyframes fo{0%{background:#22c55e}100%{}}@keyframes fb{0%,40%{background:#ef4444}100%{}}
.verdict{font-size:22px;font-weight:900;letter-spacing:.5px}
.ok .verdict{color:var(--ok)}.bad .verdict{color:var(--bad)}.over .verdict{color:var(--warn)}
.bincode{font-family:Arial,"Roboto Condensed",sans-serif;font-weight:900;font-size:40px;line-height:1.1;letter-spacing:-.5px;white-space:nowrap;margin:6px 0 4px}
#res .bincode{font-size:clamp(48px,14vw,72px)}
.bincode .pre{display:block;font-size:18px;font-weight:800;letter-spacing:1px;color:#374151;line-height:1.1}
.chips{display:flex;justify-content:center;gap:4px;margin:6px 0}
.chip{flex:1 1 0;min-width:0;border-radius:10px;padding:4px 2px;font-weight:800;font-size:17px;border:2px solid #111;background:#fff;color:#111}
.chip small{display:block;font-size:10px;font-weight:800;letter-spacing:0;opacity:.85}
.chip b{font-size:24px}
.f1F{background:#7c3aed;color:#fff;border-color:#7c3aed}.f2F{background:#0f766e;color:#fff;border-color:#0f766e}.f3F{background:#ea580c;color:#fff;border-color:#ea580c}.fBK{background:#7c4a1e;color:#fff;border-color:#7c4a1e}
.t1{background:#9ca3af}.t2{background:#86efac}.t3{background:#93c5fd}.t4{background:#fde047}
.spell{font-size:18px;color:#111;margin:4px 0}
.what{font-size:22px;font-weight:800;margin-top:8px}
.count{font-size:44px;font-weight:900;margin:4px 0;line-height:1}
.count small{font-size:20px;font-weight:700;color:var(--mute)}
.also{font-size:17px;margin-top:6px}
#progress{font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar{flex:1 1 140px;height:14px;background:#d1d5db;border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bcard{background:#fff;border:3px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.bcard.active{border-color:var(--acc);box-shadow:0 0 0 3px #93c5fd}
.bcard.done{background:#e8f5ec;border-color:var(--ok)}
.bhead{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;cursor:pointer;min-height:56px}
.bhead .main{flex:1;min-width:0}
.bhead .bincode{margin:0}
.bhead .meta{font-size:16px;color:var(--mute);display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.bstat{flex:none;text-align:center;font-weight:900;font-size:16px;border:2px solid var(--line);border-radius:10px;padding:6px 8px;min-width:64px;background:#fff}
.done .bstat{background:var(--ok);color:#fff;border-color:var(--ok)}
.lines{border-top:2px solid var(--line)}
.ln{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid #e5e7eb;min-height:56px}
.ln:last-child{border-bottom:0}
.ln input[type=checkbox]{width:32px;height:32px;flex:none;accent-color:var(--ok);margin:8px}
.ln label{display:flex;align-items:center;gap:6px;flex:none;min-height:48px;min-width:48px}
.ln .d{flex:1;min-width:0}
.ln .ac{font-weight:800;font-size:19px;word-break:break-word}
.ln .nm{font-size:15px;color:var(--mute)}
.ln .sz{flex:none;font-size:22px;font-weight:900;min-width:44px;text-align:center;border:2px solid #111;border-radius:8px;padding:2px 6px}
.ln .q{flex:none;font-size:18px;font-weight:800;min-width:56px;text-align:right}
.ln.tk{background:#e8f5ec}.ln.tk .ac{text-decoration:line-through;color:var(--mute)}
.ln.ov .q{color:var(--warn)}
.donebtn{display:block;width:calc(100% - 24px);margin:8px 12px 12px}
footer{text-align:center;color:var(--mute);font-size:15px;padding:16px 12px 32px}
#cam{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px}
#cam video{width:100%;max-width:480px;border-radius:12px;background:#000}
#cam .btn{margin-top:14px}
.kbd{font-size:15px}
</style>

var AC=null;
function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;
  var seq=ok===1?[[1320,.09]]:ok===2?[[700,.12],[700,.12]]:[[220,.18],[160,.25]];
  seq.forEach(function(s,i){var o=AC.createOscillator(),g=AC.createGain();o.type=ok===1?"sine":"square";o.frequency.value=s[0];g.gain.value=.25;o.connect(g);g.connect(AC.destination);var st=t+i*.2;o.start(st);o.stop(st+s[1]);});
  if(ok!==1&&navigator.vibrate)navigator.vibrate([120,60,120]);}catch(e){}}
function flash(el,good){el.classList.remove("flash-ok","flash-bad");void el.offsetWidth;el.classList.add(good?"flash-ok":"flash-bad")}
// ---------- lookup
function toSku(raw){
  var s=String(raw||"").trim().toUpperCase().replace(/\s+/g,""); if(!s)return null;
  if(/^\d+$/.test(s)){
    if(BC[s])return {sku:BC[s]};
    if(s.length===13&&BC[s.slice(0,12)])return {sku:BC[s.slice(0,12)]};
    if(s.length===13&&s.charAt(0)==="0"&&BC[s.slice(1)])return {sku:BC[s.slice(1)]};
    return {unknown:s};
  }
  if(BINIDX[s]!==undefined)return {bin:s};
  if(/^AD15-/.test(s))return {otherbin:s};
  if(SKUW[s])return {sku:s};
  return {text:s};
}
function otherWaves(sku){return (SKUW[sku]||[]).filter(function(x){return x!==W.id})}
function scanPiece(sku){
  var hits=SKUIDX[sku];
  if(!hits){var ow=otherWaves(sku);return {err:true,msg:ow.length?"BUKAN WAVE INI":"TIADA DALAM PUT-AWAY",
    sub:ow.length?("Helai ini milik <b>"+ow.map(function(x){return esc(x)+" ("+esc(WBYID[x].cl)+")"}).join(", ")+"</b>. Asingkan, jangan susun di wave ini."):"Bukan barang SHELVE RS2S (mungkin KEEP / karton). Asingkan dan tanya HQ."}}
  var pick=null;for(var i=0;i<hits.length;i++){var h=hits[i];if(lineCount(h[0],h[1])<W.bins[h[0]].l[h[1]][1]){pick=h;break}}
  var over=!pick; if(!pick)pick=hits[hits.length-1];
  var k=lineKey(pick[0],pick[1]); ST.c[k]=(ST.c[k]||0)+1; ST.h.push(k); if(ST.h.length>200)ST.h.shift(); save();
  return {bi:pick[0],li:pick[1],over:over,hits:hits};
}
// ---------- mode A
function showA(r,sku){
  var res=$("res");
  if(r.err){res.className="bad";res.innerHTML='<div class="verdict">&#10006; '+r.msg+'</div>'+(sku?'<div class="what">'+esc(sku)+'</div>':"")+'<div class="spell" style="margin-top:8px">'+r.sub+'</div>';flash(res,false);beep(0);return}
  var b=W.bins[r.bi],l=b.l[r.li],p=splitSku(l[0]),n=lineCount(r.bi,r.li);
  res.className=r.over?"over":"ok";
  var also=r.hits.filter(function(h){return h[0]!==r.bi}).map(function(h){return esc(W.bins[h[0]].b)+" ("+lineCount(h[0],h[1])+"/"+W.bins[h[0]].l[h[1]][1]+")"});
  res.innerHTML='<div class="verdict">'+(r.over?"&#9888; LEBIH DARI PLAN":"&#10004; SUSUN KE BIN")+'</div>'+
    binHtml(b.b)+chips(b.b)+'<div class="spell">'+esc(spell(b.b))+'</div>'+
    '<div class="what">'+esc(p.artcol)+' · saiz '+esc(p.size)+'</div><div class="mute">'+esc(names[p.art]||"")+'</div>'+
    '<div class="count">'+n+' <small>/ '+l[1]+' helai ini</small></div>'+
    '<div class="mute">Bin ini: '+binCount(r.bi)+' / '+binPlan(r.bi)+' helai'+(binDone(r.bi)?" · <b style=\"color:#0d6b34\">BIN SIAP</b>":"")+'</div>'+
    (also.length?'<div class="also">Juga di bin: '+also.join(", ")+'</div>':"")+
    (r.over?'<div class="spell"><b>Lebih dari plan.</b> Letak di bin ini dan beritahu HQ.</div>':"");
  flash(res,!r.over);beep(r.over?2:1);
}
function handleA(raw){
  var t=toSku(raw); if(!t)return;
  if(t.sku){var r=scanPiece(t.sku);showA(r,t.sku);renderB();fillWaves();}
  else if(t.bin){setMode("B");jumpBin(t.bin,true);}
  else {var res=$("res");res.className="bad";res.innerHTML='<div class="verdict">&#10006; BARKOD TIDAK DIKENALI</div><div class="what">'+esc(t.unknown||t.otherbin||t.text)+'</div><div class="spell">'+(t.otherbin?"Bin ini bukan dalam wave "+esc(W.id)+".":"Taip semula 12 digit di bawah barkod, atau asingkan helai ini.")+'</div>';flash(res,false);beep(0);}
}
function undo(){
  var k=ST.h.pop(); if(!k){return}
  if(ST.c[k]>0)ST.c[k]--; if(!ST.c[k])delete ST.c[k]; save();
  var res=$("res");res.className="";res.innerHTML='<div class="verdict">IMBAS TERAKHIR DIBATALKAN</div><div class="what">'+esc(k.replace("|"," · "))+'</div>';
  renderB();fillWaves();
}
// ---------- mode B
function renderB(){
  if(!W)return;
  var done=0;W.bins.forEach(function(_,i){if(binDone(i))done++});
  var pct=W.bins.length?Math.round(done*100/W.bins.length):0;
  $("progress").innerHTML='<span>'+done+' / '+W.bins.length+' bin siap</span><span class="bar"><i style="width:'+pct+'%"></i></span>';
  var hide=$("hideDone").checked, q=($("scanB").value||"").trim().toUpperCase();
  var html=[];
  W.bins.forEach(function(b,bi){
    var d=binDone(bi);
    if(hide&&d&&active!==bi)return;
    if(q&&!/^\d{12,13}$/.test(q)&&b.b.indexOf(q)<0&&!b.l.some(function(l){return l[0].indexOf(q)>=0}))return;
    var lines=b.l.map(function(l,li){var p=splitSku(l[0]),n=lineCount(bi,li),tk=lineDone(bi,li);
      return '<div class="ln'+(tk?" tk":"")+(n>l[1]?" ov":"")+'"><label><input type="checkbox" data-bi="'+bi+'" data-li="'+li+'"'+(tk?" checked":"")+' aria-label="Tanda siap"></label>'+
        '<div class="d"><div class="ac">'+esc(p.artcol)+'</div><div class="nm">'+esc(names[p.art]||"")+'</div></div>'+
        '<div class="sz">'+esc(p.size)+'</div><div class="q">'+(n?n+"/":"")+l[1]+'<span class="mute"> pcs</span></div></div>'}).join("");
    html.push('<div class="bcard'+(d?" done":"")+(active===bi?" active":"")+'" id="bin-'+bi+'"><div class="bhead" data-bi="'+bi+'"><div class="main">'+
      binHtml(b.b)+'<div class="spell">'+esc(spell(b.b))+'</div><div class="meta"><span class="bstat">'+(d?"SIAP":binCount(bi)+"/"+binPlan(bi))+'</span><span>'+esc(b.f)+' · '+esc(b.k)+' · '+binPlan(bi)+' helai</span></div></div></div><div class="lines">'+lines+'</div>'+
      '<button class="btn '+(d?"":"p")+' donebtn" data-done="'+bi+'">'+(d?"BUKA SEMULA BIN":"BIN SIAP")+'</button></div>');
  });
  $("list").innerHTML=html.join("")||'<div class="card mute">Tiada bin sepadan.</div>';
}
function toggleBin(bi){
  var b=W.bins[bi];
  if(binDone(bi)){delete ST.d[b.b];b.l.forEach(function(l){delete ST.t[b.b+"|"+l[0]]});}
  else ST.d[b.b]=1;
  save();renderB();fillWaves();
}
function jumpBin(code,fromScan){
  var bi=BINIDX[code]; if(bi===undefined)return false;
  active=bi; $("scanB").value=""; renderB();
  var el=$("bin-"+bi); if(el)el.scrollIntoView({block:"start",behavior:"smooth"});
  $("msgB").innerHTML="Bin aktif: <b>"+esc(code)+"</b>. Imbas helai untuk bin ini.";
  if(fromScan)beep(1);
  return true;
}
function handleB(raw){
  var t=toSku(raw); if(!t){renderB();return}
  if(t.bin){jumpBin(t.bin,true);return}
  if(t.sku){
    var hits=SKUIDX[t.sku];
    if(!hits){var ow=otherWaves(t.sku);$("msgB").innerHTML='<b style="color:#b42318">&#10006; '+esc(t.sku)+(ow.length?" milik "+esc(ow.join(", "))+" - bukan wave ini":" tiada dalam put-away")+'</b>';beep(0);$("scanB").value="";renderB();return}
    if(active!==null&&!hits.some(function(h){return h[0]===active})){
      $("msgB").innerHTML='<b style="color:#b42318">&#10006; '+esc(t.sku)+' BUKAN untuk bin '+esc(W.bins[active].b)+'</b> - ke bin '+hits.map(function(h){return esc(W.bins[h[0]].b)}).join(", ");beep(0);$("scanB").value="";renderB();return}
    var r=scanPiece(t.sku); active=r.bi; $("scanB").value="";
    $("msgB").innerHTML=(r.over?'<b style="color:#8a4b00">&#9888; LEBIH DARI PLAN</b> ':'<b style="color:#0d6b34">&#10004;</b> ')+esc(t.sku)+" &rarr; <b>"+esc(W.bins[r.bi].b)+"</b> ("+lineCount(r.bi,r.li)+"/"+W.bins[r.bi].l[r.li][1]+")";
    beep(r.over?2:1); renderB(); fillWaves();
    var el=$("bin-"+r.bi); if(el){el.scrollIntoView({block:"start"});flash(el,!r.over)}
    return;
  }
  if(t.unknown){$("msgB").innerHTML='<b style="color:#b42318">&#10006; Barkod tidak dikenali: '+esc(t.unknown)+'</b>';beep(0);$("scanB").value="";renderB();return}
  $("msgB").textContent=""; renderB(); // text filter
}
// ---------- modes / events
var mode="A";
function setMode(m){mode=m;$("modeA").hidden=m!=="A";$("modeB").hidden=m!=="B";$("tA").className=m==="A"?"on":"";$("tB").className=m==="B"?"on":"";sset("wh15pa:mode",m);
  if(m==="A")focusA(); else renderB();}
function focusA(){if(mode==="A"){var i=$("scanA");if(document.activeElement!==i)try{i.focus({preventScroll:true})}catch(e){i.focus()}}}
$("tA").onclick=function(){setMode("A")};$("tB").onclick=function(){setMode("B")};
$("wave").onchange=function(){selectWave(this.value);focusA()};
$("scanA").addEventListener("keydown",function(e){if(e.key==="Enter"||e.keyCode===13){e.preventDefault();var v=this.value;this.value="";handleA(v);focusA()}});
$("goA").onclick=function(){var v=$("scanA").value;$("scanA").value="";handleA(v);focusA()};
$("undoA").onclick=function(){undo();focusA()};
var kbdOn=sget("wh15pa:kbd",true);
function applyKbd(){$("scanA").setAttribute("inputmode",kbdOn?"numeric":"none");$("scanB").setAttribute("inputmode",kbdOn?"text":"none");$("kbdA").textContent="KEKUNCI: "+(kbdOn?"ON":"OFF")}
$("kbdA").onclick=function(){kbdOn=!kbdOn;sset("wh15pa:kbd",kbdOn);applyKbd();$("scanA").blur();setTimeout(focusA,50)};
$("scanA").addEventListener("blur",function(){setTimeout(function(){var a=document.activeElement;if(mode==="A"&&$("cam").hidden&&(!a||a===document.body))focusA()},250)});
document.addEventListener("click",function(e){if(mode==="A"&&!/^(SELECT|INPUT|OPTION)$/.test(e.target.tagName))setTimeout(focusA,0)});
$("scanB").addEventListener("keydown",function(e){if(e.key==="Enter"||e.keyCode===13){e.preventDefault();handleB(this.value)}});
var ft=null;$("scanB").addEventListener("input",function(){clearTimeout(ft);var v=this.value;if(/^\d+$/.test(v.trim())||/^AD15-/i.test(v.trim()))return;ft=setTimeout(renderB,250)});
$("goB").onclick=function(){handleB($("scanB").value)};
$("hideDone").onchange=function(){sset("wh15pa:hide",this.checked);renderB()};
$("list").addEventListener("click",function(e){
  var t=e.target;
  if(t.matches&&t.matches("input[type=checkbox]")){var bi=+t.dataset.bi,li=+t.dataset.li,k=lineKey(bi,li);
    if(t.checked)ST.t[k]=1;else{delete ST.t[k];if(lineCount(bi,li)>=W.bins[bi].l[li][1])ST.c[k]=W.bins[bi].l[li][1]-1;delete ST.d[W.bins[bi].b];}
    save();active=bi;renderB();fillWaves();return}
  var d=t.closest&&t.closest("[data-done]");if(d){toggleBin(+d.dataset.done);return}
  var h=t.closest&&t.closest(".bhead");if(h){toggleBin(+h.dataset.bi);return}
});
$("reset").onclick=function(){if(confirm("RESET semua tanda & imbasan untuk "+W.id+"?\nTidak boleh undur.")){try{localStorage.removeItem(stKey(W.id))}catch(e){}selectWave(W.id);focusA()}};
// ---------- camera
var stream=null,camTimer=null,camFor="A";
if("BarcodeDetector" in window){$("camA").hidden=false;$("camB").hidden=false}
function openCam(forMode){
  camFor=forMode;var det;
  try{det=new BarcodeDetector({formats:["ean_13","upc_a","code_128","qr_code","ean_8","code_39","itf"]})}catch(e){try{det=new BarcodeDetector()}catch(e2){alert("Kamera imbas tidak disokong");return}}
  navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false}).then(function(s){
    stream=s;var v=$("vid");v.srcObject=s;v.play();$("cam").hidden=false;
    var busy=false;camTimer=setInterval(function(){if(busy||v.readyState<2)return;busy=true;
      det.detect(v).then(function(r){busy=false;if(r&&r.length){var val=r[0].rawValue;closeCam();if(camFor==="A")handleA(val);else handleB(val)}}).catch(function(){busy=false})},250);
  }).catch(function(){alert("Tiada akses kamera")});
}
function closeCam(){clearInterval(camTimer);if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}$("cam").hidden=true;if(mode==="A")setTimeout(focusA,100)}
$("camA").onclick=function(){openCam("A")};$("camB").onclick=function(){openCam("B")};$("camClose").onclick=closeCam;
// ---------- init
applyKbd();
$("hideDone").checked=!!sget("wh15pa:hide",false);
var first=null;for(var i=0;i<waves.length;i++){if(!waveDone(waves[i])){first=waves[i].id;break}}
selectWave(first||waves[0].id);
setMode(sget("wh15pa:mode","A")==="B"?"B":"A");
})();
</script>
