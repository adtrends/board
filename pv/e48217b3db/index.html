<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Design Vote</title>
<style>
:root{--bg:#f6f4f1;--card:#fff;--ink:#1d1b19;--mute:#6f6a64;--line:#e4dfd8;--acc:#7a1f2b;--ok:#1f7a4a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;padding-bottom:110px}
header{padding:18px 16px 8px;max-width:640px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);font-size:14px}
.how{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0 0;font-size:14px}
.how b{color:var(--acc)}
main{max-width:640px;margin:0 auto;padding:0 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;margin:14px 0;overflow:hidden}
.card.p1,.card.p2{border-color:var(--acc)}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px}
.lt{font-size:26px;font-weight:800;width:38px;height:38px;border-radius:50%;background:#efe9e2;display:flex;align-items:center;justify-content:center}
.nm{flex:1;font-weight:600}
.tabs{display:flex;gap:6px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:13px;color:var(--mute)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
canvas{display:block;width:100%;height:auto;background:#eee;pointer-events:none}
.pick{display:block;width:100%;border:0;border-top:1px solid var(--line);background:#fff;padding:14px;font-size:17px;font-weight:700;color:var(--acc)}
.card.p1 .pick,.card.p2 .pick{background:var(--acc);color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .sel{flex:1;font-size:14px}
.bar button{border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:17px;font-weight:700;padding:13px 18px}
.bar button:disabled{background:#c9c2ba}
.msg{max-width:640px;margin:40px auto;padding:0 16px;text-align:center;font-size:18px}
.done{color:var(--ok);font-weight:700}
.load{color:var(--mute);text-align:center;padding:30px}
</style>
</head>
<body>
<div id="app"><div class="load">Loading… / Memuatkan…</div></div>
<script>
(function(){
var TOPIC="pv-e48217b3db5118df14a3e448", DEADLINE=new Date("2026-11-12T04:00:00Z");
var app=document.getElementById("app");
document.addEventListener("contextmenu",function(e){e.preventDefault();});
function msg(h){app.innerHTML='<div class="msg">'+h+'</div>';}
if(Date.now()>=DEADLINE.getTime()){msg("<b>Voting is closed.</b><br>Undian sudah ditutup.<br><br>Thank you / Terima kasih 🙏");return;}
var f=location.hash.slice(1).split(".");
if(f.length!==3||f[0].length!==64){msg("This link is not complete.<br>Pautan ini tidak lengkap.<br><br>Please open the link from your WhatsApp group.");return;}
var KEYHEX=f[0], TOKEN=f[1], CODE=decodeURIComponent(f[2]);
var LS="pv-"+TOKEN, picks=[];
try{picks=JSON.parse(localStorage.getItem(LS)||"[]")}catch(e){}
var sentPicks=null;try{sentPicks=localStorage.getItem(LS+"-sent")}catch(e){}

function hex(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
var keyP=crypto.subtle.importKey("raw",hex(KEYHEX),"AES-GCM",false,["decrypt"]);
function dec(path){return fetch(path,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.arrayBuffer()})
  .then(function(b){return keyP.then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(b,0,12)},k,new Uint8Array(b,12))})});}

function draw(cv,buf){
  return createImageBitmap(new Blob([buf],{type:"image/jpeg"})).then(function(bm){
    cv.width=bm.width;cv.height=bm.height;var c=cv.getContext("2d");c.drawImage(bm,0,0);
    c.save();c.translate(cv.width/2,cv.height/2);c.rotate(-0.42);
    c.font="bold "+Math.round(cv.width/30)+"px system-ui,sans-serif";c.textAlign="center";
    c.fillStyle="rgba(255,255,255,0.30)";c.strokeStyle="rgba(0,0,0,0.16)";c.lineWidth=1;
    var t=CODE+"  ·  CONFIDENTIAL  ·  "+CODE, step=cv.width/7;
    for(var y=-cv.height;y<=cv.height;y+=step){c.fillText(t,0,y);c.strokeText(t,0,y);}
    c.restore();
  });
}

function closeTxt(){return "Closes / Tutup: Thu 12 Nov, 12:00 noon";}

dec("d/m.bin").then(function(b){
  var D=JSON.parse(new TextDecoder().decode(b));
  var h='<header><h1>Batik design vote</h1><div class="sub">Undian rekaan batik · '+CODE+'</div>'+
    '<div class="how">Which design will <b>sell best at your counter</b>?<br>Tap <b>PICK</b> on your <b>1st</b> choice, then your <b>2nd</b> choice, then <b>SEND</b>.<br>'+
    '<span class="sub">Rekaan mana paling laku di kaunter anda? Tekan PICK untuk pilihan 1, kemudian pilihan 2, kemudian SEND.</span><br>'+
    '<span class="sub">'+closeTxt()+'. Please do not share / Jangan kongsi.</span></div></header><main>';
  D.forEach(function(d){
    h+='<div class="card" id="c'+d.l+'"><div class="top"><div class="lt">'+d.l+'</div><div class="nm">'+d.n+'</div>'+
       '<div class="tabs"><button class="on" data-l="'+d.l+'" data-v="m">Model</button><button data-l="'+d.l+'" data-v="f">Sketch</button></div></div>'+
       '<canvas id="m'+d.l+'"></canvas><canvas id="f'+d.l+'" style="display:none"></canvas>'+
       '<button class="pick" data-l="'+d.l+'">PICK '+d.l+'</button></div>';
  });
  h+='</main><div class="bar"><div class="in"><div class="sel" id="sel"></div><button id="send">SEND</button></div></div>';
  app.innerHTML=h;
  D.forEach(function(d){
    dec("d/"+d.i+"m.bin").then(function(b){return draw(document.getElementById("m"+d.l),b)});
    dec("d/"+d.i+"f.bin").then(function(b){return draw(document.getElementById("f"+d.l),b)});
  });
  app.addEventListener("click",function(e){
    var t=e.target;
    if(t.dataset.v){var l=t.dataset.l;document.getElementById("m"+l).style.display=t.dataset.v==="m"?"":"none";
      document.getElementById("f"+l).style.display=t.dataset.v==="f"?"":"none";
      t.parentNode.querySelectorAll("button").forEach(function(x){x.classList.toggle("on",x===t)});}
    if(t.classList.contains("pick")){var l=t.dataset.l,i=picks.indexOf(l);
      if(i>=0)picks.splice(i,1);else{if(picks.length>=2)picks.shift();picks.push(l);}
      try{localStorage.setItem(LS,JSON.stringify(picks))}catch(e){} render();}
  });
  document.getElementById("send").addEventListener("click",send);
  render();
}).catch(function(){msg("Could not open the designs.<br>Tidak dapat dibuka.<br><br>Please open the link from your WhatsApp group again.");});

function render(){
  document.querySelectorAll(".card").forEach(function(c){var l=c.id.slice(1),i=picks.indexOf(l);
    c.classList.toggle("p1",i===0);c.classList.toggle("p2",i===1);
    c.querySelector(".pick").textContent=i===0?"① 1st choice "+l+" ✓":i===1?"② 2nd choice "+l+" ✓":"PICK "+l;});
  var s=document.getElementById("sel"),b=document.getElementById("send");
  var now=JSON.stringify(picks);
  if(sentPicks&&sentPicks===now){s.innerHTML='<span class="done">✓ Vote received / Diterima</span><br><span class="sub">You can change it until 12:00 noon</span>';b.disabled=true;b.textContent="SENT";}
  else{s.innerHTML=picks.length?("1st: <b>"+picks[0]+"</b>"+(picks[1]?" &nbsp; 2nd: <b>"+picks[1]+"</b>":"")):'<span class="sub">Tap PICK on a design</span>';
    b.disabled=!picks.length;b.textContent=sentPicks?"UPDATE":"SEND";}
}

function send(){
  var b=document.getElementById("send");b.disabled=true;b.textContent="…";
  var body=JSON.stringify({t:TOKEN,o:CODE,p:picks,ts:new Date().toISOString()});
  fetch("https://ntfy.sh/"+TOPIC,{method:"POST",body:body}).then(function(r){if(!r.ok)throw 0;
    sentPicks=JSON.stringify(picks);try{localStorage.setItem(LS+"-sent",sentPicks)}catch(e){} render();})
  .catch(function(){b.disabled=false;b.textContent="RETRY";alert("Not sent - check your internet and tap again.\nTidak dihantar - semak internet dan tekan sekali lagi.");});
}
})();
</script>
</body>
</html>
