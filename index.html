<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To Do List</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
  :root {
    color-scheme: light;
    --ground: #F7F5F0;
    --surface: #FFFFFF;
    --ink: #1E2A3A;
    --muted: #57636F;
    --line: #E7E2D8;
    --chrome: #3E4E62;
    --chrome-grad: linear-gradient(135deg, #384759 0%, #4B5B70 100%);
    --chrome-ink: #FFFFFF;
    --chrome-soft: rgba(255,255,255,0.2);
    --done: #2A7549;
    --done-bg: #DBEEE2;
    --pending: #B93A30;
    --pending-bg: #F8E2DE;
    --overdue: #8C2119;
    --upcoming: #67727D;
    --upcoming-bg: #EAECEE;
    --amber: #B8741A;
    --amber-bg: #F8EBD3;
    --skeleton: #EAE4D8;
    --focus: #2E4466;
    --shadow: 0 1px 2px rgba(60,50,30,0.06), 0 6px 18px rgba(60,50,30,0.08);
  }
  /* Light-only by decision (2026-09-08): the board shows the same palette on phones set to dark mode. */

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: "Barlow", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.35;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .display {
    font-family: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
    font-weight: 700;
    letter-spacing: 0.005em;
  }
  .app {
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--ground);
  }
  .banner {
    background: var(--amber-bg);
    color: var(--amber);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-align: center;
    padding: 8px 16px;
  }
  .banner small {
    display: block;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    font-size: 14px;
    opacity: 0.95;
  }

  /* Header band */
  /* Brand colours for the header card: AD brushed titanium, BF navy, FE forest green. Unknown brand keeps the slate base. */
  .head.brand-AD {
    --chrome: #4F5761;
    --chrome-grad: linear-gradient(120deg, #454C55 0%, #5C646E 45%, #4A525B 70%, #5F6771 100%);
  }
  .head.brand-BF {
    --chrome: #2E4466;
    --chrome-grad: linear-gradient(135deg, #293D5C 0%, #3A5478 100%);
  }
  .head.brand-FE {
    --chrome: #3D6450;
    --chrome-grad: linear-gradient(135deg, #365A48 0%, #497560 100%);
  }
  .head {
    background: var(--chrome);
    background: var(--chrome-grad);
    color: var(--chrome-ink);
    padding: 20px 20px 22px;
    margin: 12px 12px 0;
    border-radius: 22px;
    box-shadow: var(--shadow);
  }
  .head-row {
    display: flex;
    align-items: flex-start;
    gap: 12px;
  }
  .head-main { flex: 1 1 auto; min-width: 0; }
  .code {
    font-size: 26px;
    line-height: 1;
    overflow-wrap: anywhere;
  }
  .name {
    margin-top: 6px;
    font-size: 16px;
    font-weight: 500;
    opacity: 0.92;
    overflow-wrap: anywhere;
  }
  .badge-brand {
    flex: 0 0 auto;
    background: var(--chrome-ink);
    color: var(--chrome);
    font-family: "Barlow Condensed", "Arial Narrow", sans-serif;
    font-weight: 700;
    font-size: 22px;
    line-height: 1;
    padding: 9px 10px 8px;
    border-radius: 14px;
    min-width: 50px;
    text-align: center;
  }
  .meta {
    margin-top: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px 16px;
    font-size: 16px;
    opacity: 0.92;
  }
  .meta span { white-space: nowrap; }
  .meta .lbl { opacity: 0.75; margin-right: 4px; }
  .updated {
    margin-top: 10px;
    font-size: 15px;
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    background: var(--chrome-soft);
  }
  .updated.stale {
    background: var(--amber);
    color: #FFFFFF;
    font-weight: 600;
  }

  /* Headline */
  .headline {
    padding: 20px 20px 12px;
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .hint {
    flex: 1 0 100%;
    font-size: 16px;
    color: var(--muted);
  }
  .headline .big {
    font-size: 44px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .headline .sub {
    font-size: 17px;
    font-weight: 500;
    color: var(--muted);
  }
  .headline.is-pending .big { color: var(--pending); }
  .headline.is-clear .big { color: var(--done); }
  .headline .overdue-note {
    font-weight: 600;
    color: var(--overdue);
  }

  /* Rows */
  .list {
    margin: 0 12px 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row {
    background: var(--surface);
    border-radius: 20px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .row-btn {
    all: unset;
    display: flex;
    width: 100%;
    align-items: center;
    gap: 12px;
    padding: 12px 16px 12px 12px;
    min-height: 70px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    box-sizing: border-box;
  }
  .row-btn:focus-visible {
    outline: 3px solid var(--focus);
    outline-offset: -3px;
    border-radius: 20px;
  }
  .row-btn:active { background: var(--ground); }
  .ico {
    flex: 0 0 46px;
    width: 46px;
    height: 46px;
    border-radius: 16px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .ico svg { width: 26px; height: 26px; display: block; }
  .row.done .ico { background: var(--done-bg); color: var(--done); }
  .row.pending .ico { background: var(--pending-bg); color: var(--pending); }
  .row.overdue .ico { background: var(--pending-bg); color: var(--overdue); }
  .row.upcoming .ico { background: var(--upcoming-bg); color: var(--upcoming); }
  .row-main { flex: 1 1 auto; min-width: 0; }
  .row-top {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .label {
    font-weight: 600;
    font-size: 19px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    white-space: nowrap;
    line-height: 1.2;
  }
  .pill.done { background: var(--done-bg); color: var(--done); }
  .pill.pending { background: var(--pending-bg); color: var(--pending); }
  .pill.upcoming { background: var(--upcoming-bg); color: var(--upcoming); }
  .pill.overdue { background: var(--overdue); color: #FFFFFF; }
  .summary {
    margin-top: 4px;
    font-size: 16px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .row.pending .summary,
  .row.overdue .summary { color: var(--ink); }
  .due {
    flex: 0 0 auto;
    text-align: right;
    font-size: 15px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
  }
  .due strong {
    display: block;
    font-weight: 700;
    color: var(--ink);
    font-size: 16px;
  }
  .row.overdue .due strong { color: var(--overdue); }
  .chev {
    flex: 0 0 auto;
    width: 12px;
    height: 12px;
    border-right: 2px solid var(--muted);
    border-bottom: 2px solid var(--muted);
    transform: rotate(45deg);
    margin: 0 4px 4px 0;
    transition: transform 160ms ease;
  }
  .row.open .chev { transform: rotate(225deg); margin: 4px 4px 0 0; }
  .detail {
    padding: 0 16px 16px 16px;
    font-size: 16px;
  }
  .detail ul {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .detail li {
    padding: 10px 14px;
    background: var(--ground);
    border-radius: 12px;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .detail .empty { color: var(--muted); }

  /* Stocktake tracker */
  .steps {
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0;
  }
  .step {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    color: var(--muted);
  }
  .step .n {
    flex: 0 0 28px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 14px;
    border: 2px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .step.done { color: var(--ink); }
  .step.done .n { background: var(--done); border-color: var(--done); color: #FFFFFF; }
  .step.current { color: var(--ink); font-weight: 600; }
  .step.current .n { border-color: var(--pending); color: var(--pending); }
  .step .tag {
    margin-left: auto;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--pending);
    font-weight: 700;
    white-space: nowrap;
  }
  .gate {
    margin-top: 10px;
    font-size: 14px;
    color: var(--muted);
  }
  .gate strong { color: var(--ink); font-weight: 600; }

  /* Foot */
  /* ---- game layer: streak, stamp card, badges (2026-09-08) ---- */
  .game { margin: 0 16px 14px; display: grid; gap: 10px; }
  .streak { display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); }
  .streak .flame { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--amber-bg); color: var(--amber); font-size: 24px; flex: 0 0 auto; }
  .streak.hot .flame { background: #FBE3C4; color: #C2410C; }
  .streak.cold .flame { background: var(--upcoming-bg); color: var(--upcoming); }
  .streak .big { font-size: 22px; line-height: 1.1; }
  .streak .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .streak .risk { color: var(--amber); font-weight: 600; font-size: 14px; margin-top: 2px; }
  .card { background: var(--surface); border-radius: 14px; padding: 12px 14px 14px; box-shadow: var(--shadow); }
  .card .ttl { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .card .ttl .display { font-size: 19px; }
  .card .ttl .cnt { font-size: 14px; color: var(--muted); }
  .stamps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 6px; }
  .stamp { text-align: center; font-size: 12px; color: var(--muted); line-height: 1.2; }
  .stamp .c { width: 54px; height: 54px; margin: 0 auto 5px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-size: 22px; color: var(--upcoming); background: var(--ground); }
  .stamp.done .c { border: 2px solid var(--done); background: var(--done-bg); color: var(--done); transform: rotate(-6deg); }
  .stamp.done.late .c { border-color: var(--amber); background: var(--amber-bg); color: var(--amber); }
  .stamp .d { display: block; color: var(--ink); font-weight: 600; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--done-bg); color: var(--done); font-weight: 600; font-size: 14px; }
  .badge.gold { background: #F6E7B4; color: #7A5A00; }
  .badges .none { color: var(--muted); font-size: 14px; }
  .level { background: var(--surface); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .level .lv-row { display: flex; gap: 12px; align-items: center; }
  .level .lv-badge { width: 44px; height: 44px; border-radius: 12px; background: var(--chrome-grad); color: var(--chrome-ink); display: grid; place-items: center; font-size: 22px; flex: 0 0 auto; }
  .level .lv-main { flex: 1; min-width: 0; }
  .level .big { font-size: 20px; line-height: 1.1; }
  .level .bar { height: 10px; border-radius: 999px; background: var(--upcoming-bg); margin: 6px 0 4px; overflow: hidden; }
  .level .bar span { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, var(--done), #6CC28A); transition: width 1.2s cubic-bezier(.2,.8,.2,1); }
  .level .sub { color: var(--muted); font-size: 14px; }
  .level .rank { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .level .rank .display { font-size: 18px; }
  .level .rank small { color: var(--muted); font-size: 12px; text-align: right; }
  .level .levelup { text-align: center; background: #F6E7B4; color: #7A5A00; border-radius: 10px; padding: 8px; margin-bottom: 10px; font-size: 18px; animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
  .level.up { animation: glow 1.6s ease-out 1; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0; } 60% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes glow { 0% { box-shadow: 0 0 0 0 rgba(184,116,26,.55); } 100% { box-shadow: 0 0 0 24px rgba(184,116,26,0); } }
  .streak.hot .flame { animation: flicker 1.6s ease-in-out infinite; }
  @keyframes flicker { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12) rotate(-4deg); } }
  .stamp .c { position: relative; transition: transform .3s; }
  .stamp.new .c { animation: stampin .7s cubic-bezier(.2,1.4,.4,1) both; }
  .stamp.new .c::after { content: '✦'; position: absolute; top: -8px; right: -6px; color: var(--amber); font-size: 16px; animation: twinkle 1.2s ease-in-out 3; }
  .stamp .tag { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: var(--amber); color: #fff; font-size: 10px; padding: 1px 6px; border-radius: 999px; font-weight: 700; }
  @keyframes stampin { 0% { transform: scale(2.2) rotate(-20deg); opacity: 0; } 70% { transform: scale(.92) rotate(-6deg); opacity: 1; } 100% { transform: scale(1) rotate(-6deg); } }
  @keyframes twinkle { 0%,100% { opacity: 0; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.2); } }
  .row.done.cheer .ico { animation: pop .6s cubic-bezier(.2,1.4,.4,1) both; }
  .row .pop { position: absolute; right: 16px; top: 8px; background: var(--done); color: #fff; font-weight: 700; padding: 4px 10px; border-radius: 999px; font-size: 14px; animation: rise 1.4s ease-out both; pointer-events: none; }
  .row { position: relative; }
  @keyframes rise { 0% { transform: translateY(6px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-22px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .streak.hot .flame, .stamp.new .c, .level.up, .row.done.cheer .ico, .row .pop, .level .levelup { animation: none; } }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
  .confetti i { position: absolute; top: -12px; width: 9px; height: 14px; border-radius: 2px; animation: fall 2.6s ease-in forwards; }
  @keyframes fall { to { transform: translateY(105vh) rotate(540deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .confetti { display: none; } .stamp.done .c { transform: none; } }
  .foot {
    margin-top: auto;
    padding: 0 20px 28px;
    font-size: 15px;
    color: var(--muted);
    text-align: center;
  }

  /* Skeleton */
  .sk {
    background: var(--skeleton);
    border-radius: 6px;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  @media (prefers-reduced-motion: reduce) {
    .sk { animation: none; }
    .chev { transition: none; }
  }

  /* Full-screen message */
  .msg {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 28px;
    gap: 14px;
  }
  .msg .icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--upcoming-bg);
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    line-height: 1;
  }
  .msg h1 {
    margin: 0;
    font-size: 30px;
    line-height: 1.1;
    text-wrap: balance;
  }
  .msg p {
    margin: 0;
    font-size: 17px;
    color: var(--muted);
    max-width: 30ch;
    text-wrap: balance;
  }
</style>

    if (mm) monthLabel = MONTHS[+mm[2] - 1] + ' ' + mm[1];

    var html = '';
    if (demo) html += '<div class="banner">' + T.demo + '<small>' + T.demoSub + '</small></div>';
    html += '<div class="head' + (brand ? ' brand-' + esc(brand) : '') + '">' +
      '<div class="head-row"><div class="head-main">' +
        '<div class="code display">' + esc(pickText(board.outlet, 'Outlet')) + '</div>' +
        (board.name ? '<div class="name">' + esc(board.name) + '</div>' : '') +
      '</div>' + (brand ? '<div class="badge-brand">' + esc(brand) + '</div>' : '') + '</div>' +
      '<div class="meta">' +
        (board.pic ? '<span><span class="lbl">' + T.supervisor + '</span>' + esc(board.pic) + '</span>' : '') +
        (monthLabel ? '<span><span class="lbl">' + T.month + '</span>' + esc(monthLabel) + '</span>' : '') +
      '</div>' +
      (updated
        ? '<div class="updated' + (stale ? ' stale' : '') + '">' + T.updated + esc(fmtStamp(updated)) + (stale ? T.stale : '') + '</div>'
        : '<div class="updated stale">' + T.unknown + '</div>') +
    '</div>';
    html += headlineHtml(rows);
    html += gameHtml(board.game, rows, board);
    if (rows.length) html += '<div class="list">' + rows.map(rowHtml).join('') + '</div>';
    else html += '<div class="list"><div class="row"><div class="row-btn" style="cursor:default"><span class="row-main"><span class="summary">' + T.nothing + '</span></span></div></div></div>';
    html += '<div class="foot">' + T.foot + '</div>';
    app.innerHTML = html;
    rendered = true;
    lastBoard = board; lastDemo = demo;
  }
  var lastBoard = null, lastDemo = false;

  app.addEventListener('click', function (e) {
    var btn = e.target.closest('.row-btn');
    if (!btn || !lastBoard) return;
    var rowEl = btn.closest('.row');
    var id = rowEl && rowEl.getAttribute('data-id');
    if (!id) return;
    openRows[id] = !openRows[id];
    renderBoard(lastBoard, lastDemo);
    if (openRows[id]) {
      var el = app.querySelector('.row[data-id="' + id + '"]');
      if (el && el.classList.contains('done')) {
        el.classList.add('cheer');
        var pop = document.createElement('div'); pop.className = 'pop'; pop.textContent = T.doneTap;
        el.appendChild(pop);
        setTimeout(function () { el.classList.remove('cheer'); if (pop.parentNode) pop.parentNode.removeChild(pop); }, 1400);
      }
    }
  });

  function showInvalid() {
    rendered = true;
    app.innerHTML = '<div class="msg">' +
      '<div class="icon" aria-hidden="true">?</div>' +
      '<h1 class="display">This link isn’t valid for any outlet.</h1>' +
      '<p>Ask your supervisor for your outlet’s link.</p>' +
    '</div>';
  }
  function showDemo(brand) { renderBoard(demoBoard(brand), true); }

  /* ---------- Crypto ---------- */
  function readKey() {
    var h = (location.hash || '').replace(/^#/, '').trim();
    if (!h) return null;
    if (/^demo(-[a-z]{2,3})?$/i.test(h)) return 'demo:' + (h.split('-')[1] || 'BF').toUpperCase();
    if (/^[0-9a-fA-F]{64}$/.test(h)) return h.toLowerCase();
    return false;
  }
  function hexToBytes(hex) {
    var out = new Uint8Array(hex.length / 2);
    for (var i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
    return out;
  }
  function b64ToBytes(b64) {
    var bin = atob(String(b64).replace(/-/g, '+').replace(/_/g, '/'));
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function docIdFor(keyHex) {
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(keyHex)).then(function (buf) {
      var b = new Uint8Array(buf), s = '';
      for (var i = 0; i < 8; i++) s += (b[i] < 16 ? '0' : '') + b[i].toString(16);
      return s;
    });
  }
  function importKey(keyHex) {
    return crypto.subtle.importKey('raw', hexToBytes(keyHex), { name: 'AES-GCM' }, false, ['decrypt']);
  }
  function decryptDoc(cryptoKey, doc) {
    if (!doc || typeof doc.iv !== 'string' || typeof doc.ct !== 'string') return Promise.reject(new Error('bad doc'));
    var iv = b64ToBytes(doc.iv), ct = b64ToBytes(doc.ct);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv, tagLength: 128 }, cryptoKey, ct).then(function (buf) {
      return JSON.parse(new TextDecoder().decode(buf));
    });
  }

  /* ---------- Boot ---------- */
  /* Two data sources, same document format:
     1. Static host (GitHub Pages etc.): fetch ./b/<docId>.json next to this page. No login.
     2. Claude artifact with the db capability: read boards/<docId> live.               */
  var unsub = null;
  var pollTimer = null;
  var STATIC_DIR = 'b/';
  var POLL_MS = 5 * 60 * 1000;

  function showOffline() {
    rendered = true;
    app.innerHTML = '<div class="msg">' +
      '<div class="icon" aria-hidden="true">!</div>' +
      '<h1 class="display">Couldn’t load your To Do List.</h1>' +
      '<p>Check your connection, then pull down to refresh or reopen the link.</p>' +
    '</div>';
  }

  function bootStatic(key) {
    Promise.all([docIdFor(key), importKey(key)]).then(function (r) {
      var id = r[0], cryptoKey = r[1];
      var url = STATIC_DIR + id + '.json';
      var lastText = null;
      function load(isPoll) {
        return fetch(url, { cache: 'no-store' }).then(function (res) {
          if (res.status === 404) { if (!isPoll) showInvalid(); return; }
          if (!res.ok) throw new Error('http ' + res.status);
          return res.text().then(function (text) {
            if (isPoll && text === lastText) return;
            lastText = text;
            var doc; try { doc = JSON.parse(text); } catch (e) { if (!isPoll) showInvalid(); return; }
            return decryptDoc(cryptoKey, doc).then(function (board) { renderBoard(board, false); },
              function () { if (!isPoll) showInvalid(); });
          });
        }).catch(function () { if (!isPoll && !rendered) showOffline(); });
      }
      load(false);
      pollTimer = setInterval(function () { if (!document.hidden) load(true); }, POLL_MS);
      document.addEventListener('visibilitychange', function () { if (!document.hidden && rendered) load(true); });
    }).catch(function () { showInvalid(); });
  }

  function boot() {
    if (unsub) { try { unsub(); } catch (e) {} unsub = null; }
    if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
    rendered = false;
    var key = readKey();
    var hasRuntime = !!(window.claude && typeof window.claude.use === 'function');
    if (typeof key === 'string' && key.indexOf('demo:') === 0) { showDemo(key.slice(5)); return; }
    if (!window.crypto || !crypto.subtle) { showDemo(); return; }
    if (!hasRuntime) {
      if (key === null) { showDemo(); return; }
      if (key === false) { showInvalid(); return; }
      bootStatic(key);
      return;
    }

    var settled = false;
    window.claude.use('db').then(function (db) {
      if (!db) { showDemo(); return; }
      if (key === null) { showDemo(); return; }
      if (key === false) { showInvalid(); return; }
      return Promise.all([docIdFor(key), importKey(key)]).then(function (r) {
        var id = r[0], cryptoKey = r[1];
        var timer = setTimeout(function () { if (!settled) { settled = true; showInvalid(); } }, 12000);
        unsub = db.doc(COLLECTION + '/' + id).onSnapshot(function (snap) {
          if (!snap.exists) {
            if (snap.metadata && snap.metadata.fromCache && !settled) return;
            settled = true; clearTimeout(timer); showInvalid(); return;
          }
          decryptDoc(cryptoKey, snap.data()).then(function (board) {
            settled = true; clearTimeout(timer);
            renderBoard(board, false);
          }, function () {
            settled = true; clearTimeout(timer);
            showInvalid();
          });
        }, function () {
          if (!settled) { settled = true; clearTimeout(timer); showInvalid(); }
        });
      });
    }).catch(function () { if (!rendered) showInvalid(); });
  }

  window.addEventListener('hashchange', function () { openRows = {}; boot(); });
  boot();
})();
</script>
