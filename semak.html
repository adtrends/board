<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Semak Kad Perakam Waktu</title>
<style>
  :root{
    --bg:#f6f3ee; --card:#ffffff; --ink:#1d2430; --muted:#5b6472; --line:#d7ccbd;
    --head:#2b4a6f; --headln:#8aa0bd; --flag:#fff2cc; --flagln:#e4c96b;
    --ok:#1f7a4d; --okbg:#e7f4ec; --warn:#9a5b00;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:14px 12px 40px}
  h1{font-size:21px;margin:2px 0 1px;letter-spacing:.3px}
  .mon{font-weight:700;color:var(--head);margin:0 0 10px}
  .ocard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin:0 0 12px}
  .ocard .o{font-weight:700;font-size:18px}
  .ocard .nm{font-size:17px}
  .ocard .emp{color:var(--muted);font-size:14px;margin-top:2px}
  .intro{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin:0 0 14px;font-size:15.5px}
  .intro b{color:var(--head)}
  .legend{font-size:14px;color:var(--muted);margin:6px 0 2px}
  .legend .sw{display:inline-block;width:14px;height:14px;border:1px solid var(--flagln);background:var(--flag);border-radius:3px;vertical-align:-2px;margin-right:4px}
  table{border-collapse:collapse;width:100%;background:var(--card);
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th,td{border:1px solid #cdd6e2;padding:4px 2px;text-align:center;font-size:14px}
  thead th{background:var(--head);color:#fff;font-size:12.5px;padding:6px 2px;position:sticky;top:0;z-index:2}
  thead th.day{width:34px}
  col.sess-sep{border-left:2px solid var(--headln)}
  td.day{font-weight:700;background:#f1ece3}
  tr.flag td{background:var(--flag)}
  td.marker{text-align:left;font-style:italic;color:var(--muted);padding-left:8px}
  td.none{text-align:left;font-style:italic;color:var(--muted);padding-left:8px}
  input.t{width:100%;min-width:44px;border:1.5px solid #b9c6d6;border-radius:6px;
    padding:6px 2px;text-align:center;font-size:15px;background:#fff;color:var(--ink)}
  input.t.unsure{border-color:#d99a00;background:#fffbee;font-weight:600}
  input.t:focus{outline:2px solid var(--head);border-color:var(--head)}
  input.mk{width:100%;border:1.5px solid #d99a00;border-radius:6px;padding:7px 8px;font-size:15px}
  .tilde{color:#9a5b00;font-weight:700}
  .catat{margin:16px 0 6px;font-weight:700}
  textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;font-family:inherit}
  .hantar{width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;background:var(--head);color:#fff;
    font-size:19px;font-weight:700;letter-spacing:.3px}
  .hantar:active{transform:translateY(1px)}
  .note{font-size:13.5px;color:var(--muted);margin-top:10px;text-align:center}
  .msg{display:none;margin-top:16px;padding:14px;border-radius:12px;font-size:16px}
  .msg.ok{display:block;background:var(--okbg);border:1px solid #9ed3b4;color:var(--ok)}
  .msg.err{display:block;background:#fdecec;border:1px solid #e9a9a9;color:#a12121}
  .copybtn{display:inline-block;margin-top:10px;padding:10px 14px;border:1px solid var(--head);
    border-radius:10px;background:#fff;color:var(--head);font-size:15px;font-weight:600}
  .center{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .center h2{color:var(--head)}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="center"><div><h2>Memuatkan…</h2></div></div>
</div>

<script>
/* ---------- Crypto (same contract as push_board.py / index.html / topup.html) ---------- */
function readKey(){var h=(location.hash||'').replace(/^#/,'').trim();if(!h)return null;if(/^[0-9a-fA-F]{64}$/.test(h))return h.toLowerCase();return false;}
function hexToBytes(hex){var out=new Uint8Array(hex.length/2);for(var i=0;i<out.length;i++)out[i]=parseInt(hex.substr(i*2,2),16);return out;}
function b64ToBytes(b64){var bin=atob(String(b64).replace(/-/g,'+').replace(/_/g,'/'));var out=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
function docIdFor(keyHex){return crypto.subtle.digest('SHA-256',new TextEncoder().encode(keyHex)).then(function(buf){var b=new Uint8Array(buf),s='';for(var i=0;i<8;i++)s+=(b[i]<16?'0':'')+b[i].toString(16);return s;});}
function importKey(keyHex){return crypto.subtle.importKey('raw',hexToBytes(keyHex),{name:'AES-GCM'},false,['decrypt']);}
function decryptDoc(ck,doc){if(!doc||typeof doc.iv!=='string'||typeof doc.ct!=='string')return Promise.reject(new Error('bad doc'));return crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(doc.iv),tagLength:128},ck,b64ToBytes(doc.ct)).then(function(buf){return JSON.parse(new TextDecoder().decode(buf));});}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function showCenter(h){document.getElementById('wrap').innerHTML='<div class="center"><div>'+h+'</div></div>';}
function showInvalid(){showCenter('<h2>Link tidak sah</h2><p>Sila buka link penuh yang dihantar dalam group anda (termasuk bahagian selepas #).</p>');}
function showOffline(){showCenter('<h2>Tiada sambungan</h2><p>Semak internet, kemudian buka semula link.</p>');}

var SESS=['Pagi','Petang','Malam'];
var DOC=null;

function cellId(d,i){return 'c_'+d+'_'+i;}

function render(doc){
  DOC=doc;
  var h='';
  h+='<h1>SEMAK KAD PERAKAM WAKTU</h1>';
  h+='<div class="mon">'+esc(doc.month||'')+'</div>';
  h+='<div class="ocard"><div class="o">'+esc(doc.outlet||'')+'</div>'+
     '<div class="nm">'+esc(doc.name||'')+'</div>'+
     (doc.empno?'<div class="emp">No. Pekerja: '+esc(doc.empno)+'</div>':'')+'</div>';
  h+='<div class="intro">Ini bacaan kad perakam waktu encik/puan oleh sistem kami, disusun '+
     '<b>macam kad asal</b> — jam Masuk &amp; Keluar setiap sesi. '+
     '<b>Sila banding dengan kad encik/puan</b>. Baris berlorek = kami tak pasti '+
     '(<span class="tilde">~</span>) — betulkan jam yang salah, kemudian tekan <b>Hantar</b>. '+
     '<b>Bacaan sahaja</b> — pengiraan OT/cuti/potongan masih disemak oleh HR.'+
     '<div class="legend"><span class="sw"></span> baris perlu disemak</div></div>';

  h+='<table><colgroup><col class="day">';
  for(var s=0;s<3;s++){h+='<col'+(s>0?' class="sess-sep"':'')+'><col>';}
  h+='</colgroup><thead><tr><th class="day">Hari</th>';
  for(var s=0;s<3;s++){h+='<th>Masuk</th><th>Keluar</th>';}
  h+='</tr></thead><tbody>';

  doc.days.forEach(function(day){
    var fl=day.flagged?' class="flag"':'';
    h+='<tr'+fl+' data-d="'+day.d+'">';
    h+='<td class="day">'+day.d+'</td>';
    if(day.marker){
      if(day.flagged){
        h+='<td class="marker" colspan="6"><input class="mk" id="mk_'+day.d+'" '+
           'value="'+esc(day.markerRaw||'')+'" aria-label="Cuti/catatan hari '+day.d+'"></td>';
      }else{
        h+='<td class="marker" colspan="6">'+esc(day.marker)+'</td>';
      }
    }else{
      var cells=day.cells||[], uns=day.unsure||[];
      var any=cells.some(function(c){return c;});
      if(!any && !day.flagged){
        h+='<td class="none" colspan="6">(tiada rakaman)</td>';
      }else{
        for(var i=0;i<6;i++){
          var v=cells[i]||'';
          if(day.flagged){
            var u=uns.indexOf(i)>=0?' unsure':'';
            h+='<td><input class="t'+u+'" id="'+cellId(day.d,i)+'" value="'+esc(v)+'" '+
               'inputmode="numeric" autocomplete="off" placeholder="--" '+
               'aria-label="Hari '+day.d+' '+(i%2?'Keluar':'Masuk')+' '+SESS[Math.floor(i/2)]+'"></td>';
          }else{
            h+='<td>'+(v?esc(v):'')+'</td>';
          }
        }
      }
    }
    h+='</tr>';
  });
  h+='</tbody></table>';

  h+='<div class="catat">Catatan lain (jika ada)</div>';
  h+='<textarea id="catat" placeholder="Cth: hari 5 saya masuk 9:53, bukan apa yang tertera"></textarea>';
  h+='<button class="hantar" id="hantar">Hantar ke HR</button>';
  h+='<div class="note">Bacaan sahaja — HR masih semak pengiraan cuti/OT. Tiada data disimpan di telefon.</div>';
  h+='<div class="msg" id="msg"></div>';

  document.getElementById('wrap').innerHTML=h;
  document.getElementById('hantar').addEventListener('click',submit);
}

function collect(){
  var changes=[];
  DOC.days.forEach(function(day){
    if(!day.flagged) return;
    if(day.marker){
      var el=document.getElementById('mk_'+day.d);
      var nv=(el?el.value:'').trim();
      if(nv!==(day.markerRaw||'').trim()) changes.push({d:day.d,field:'cuti',old:day.markerRaw||'',new:nv});
      return;
    }
    var cells=day.cells||[];
    for(var i=0;i<6;i++){
      var el=document.getElementById(cellId(day.d,i));
      if(!el) continue;
      var nv=el.value.trim(), ov=(cells[i]||'').trim();
      if(nv!==ov){
        changes.push({d:day.d,sess:SESS[Math.floor(i/2)],io:(i%2?'Keluar':'Masuk'),old:ov,new:nv});
      }
    }
  });
  var catat=(document.getElementById('catat')||{}).value||'';
  return {changes:changes,catat:catat.trim()};
}

function waText(c){
  var L=['Semak kad '+DOC.month+' — '+DOC.outlet+' '+DOC.name];
  if(c.changes.length){
    c.changes.forEach(function(x){
      if(x.field==='cuti') L.push('Hari '+x.d+': '+(x.new||'(kosong)'));
      else L.push('Hari '+x.d+' '+x.io+' '+x.sess+': '+(x.old||'--')+' → '+(x.new||'(kosong)'));
    });
  }else{
    L.push('Semua bacaan betul.');
  }
  if(c.catat) L.push('Catatan: '+c.catat);
  return L.join('\n');
}

function submit(){
  var btn=document.getElementById('hantar'), msg=document.getElementById('msg');
  var c=collect();
  var payload={scope:DOC.scope,outlet:DOC.outlet,name:DOC.name,empno:DOC.empno,
    month:DOC.month,submittedAt:new Date().toISOString(),
    allCorrect:c.changes.length===0,changes:c.changes,catat:c.catat};
  btn.disabled=true; btn.textContent='Menghantar…';
  var url=(DOC.submit&&DOC.submit.ntfy)||'';
  fetch(url,{method:'POST',headers:{'Title':'PC semak '+DOC.scope,'Tags':'memo'},
    body:JSON.stringify(payload)})
    .then(function(r){if(!r.ok)throw new Error('http '+r.status);return r;})
    .then(function(){
      msg.className='msg ok';
      msg.innerHTML='<b>Terima kasih!</b> Bacaan encik/puan sudah dihantar kepada HR'+
        (c.changes.length?(' ('+c.changes.length+' pembetulan).'):'.')+
        ' Tak perlu buat apa-apa lagi.';
      btn.textContent='Sudah dihantar ✓';
    })
    .catch(function(){
      msg.className='msg err';
      msg.innerHTML='Gagal hantar automatik. Sila <b>salin</b> di bawah dan hantar dalam group anda:'+
        '<br><br><span id="wt" style="white-space:pre-wrap;display:block;background:#fff;border:1px solid #e9a9a9;border-radius:8px;padding:10px">'+
        esc(waText(c))+'</span>'+
        '<button class="copybtn" id="cp">Salin teks</button>';
      btn.disabled=false; btn.textContent='Cuba Hantar semula';
      var cp=document.getElementById('cp');
      if(cp) cp.addEventListener('click',function(){
        var t=waText(c);
        if(navigator.clipboard) navigator.clipboard.writeText(t);
        cp.textContent='Disalin ✓';
      });
    });
}

function boot(){
  if(!window.crypto||!crypto.subtle){showOffline();return;}
  var k=readKey();
  if(k===null||k===false){showInvalid();return;}
  Promise.all([docIdFor(k),importKey(k)]).then(function(r){
    return fetch(SUBDIR_P+'/'+r[0]+'.json',{cache:'no-store'}).then(function(res){
      if(res.status===404){showInvalid();return;}
      if(!res.ok)throw new Error('http '+res.status);
      return res.json().then(function(doc){return decryptDoc(r[1],doc).then(render);});
    });
  }).catch(function(e){console.error(e);showInvalid();});
}
var SUBDIR_P='p';
boot();
</script>
</body>
</html>
