<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Conso Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#f5f7f8;--card:#fff;--soft:#eef2f4;--line:#e0e6ea;--ink:#16202b;--muted:#66737f;
 --accent:#0f6d7d;--accent-s:#dcecef;--good:#1c7a4c;--good-s:#e2f2e9;--warn:#8f6200;--warn-s:#fbf1da;
 --bad:#ad2e22;--bad-s:#fae4e1;--shadow:0 1px 2px rgba(17,28,39,.06),0 8px 24px rgba(17,28,39,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1317;--card:#151e25;
 --soft:#1b262e;--line:#27343d;--ink:#e4eaee;--muted:#93a1ac;--accent:#57c3d2;--accent-s:#12333b;
 --good:#5cc38d;--good-s:#12301f;--warn:#e2b45c;--warn-s:#332715;--bad:#f0897c;--bad-s:#38201d;
 --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#0d1317;--card:#151e25;--soft:#1b262e;--line:#27343d;--ink:#e4eaee;
 --muted:#93a1ac;--accent:#57c3d2;--accent-s:#12333b;--good:#5cc38d;--good-s:#12301f;--warn:#e2b45c;
 --warn-s:#332715;--bad:#f0897c;--bad-s:#38201d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 110px}
h1{font-size:22px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.mono{font-family:"IBM Plex Mono",monospace}
.tabs{display:flex;gap:6px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;font:inherit;font-weight:600;color:var(--muted);padding:9px 12px;
 border-bottom:2px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font-size:11px;background:var(--soft);border-radius:999px;padding:1px 7px;margin-left:4px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.fact{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-family:"IBM Plex Mono",monospace;font-size:18px;font-weight:600}
.fact span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.seg{display:flex;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
 padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
input[type=search],input[type=month],select{border:1px solid var(--line);background:var(--card);color:var(--ink);
 border-radius:10px;padding:7px 10px;font:inherit;font-size:13px}
input[type=search]{flex:1;min-width:180px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 10px;
 background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.filters label{display:flex;flex-direction:column;gap:3px}
.filters .row2{display:flex;gap:6px}
.filters .row2 input{flex:1;min-width:0}
.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:6px;font-size:13px}
button.act{border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;font-weight:600;
 font-size:13px;padding:7px 14px;border-radius:9px;cursor:pointer}
button.ghost{border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:12.5px;
 font-weight:600;padding:6px 11px;border-radius:9px;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
:is(button,input,select,summary):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scroll{overflow:auto;border-radius:12px;border:1px solid var(--line);background:var(--card)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);font-size:12.5px;text-align:right;white-space:nowrap}
th{font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;
 position:sticky;top:0;background:var(--card);z-index:1;user-select:none}
th.s{cursor:pointer}
th.sorted{color:var(--accent)}
.l{text-align:left}
td.o b{font-family:"IBM Plex Mono",monospace}
td.o span{display:block;color:var(--muted);font-size:10.5px;white-space:normal;max-width:300px}
tr:last-child td{border-bottom:none}
tr.on{background:var(--accent-s)}
.chip{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--soft);
 color:var(--muted);margin:3px 4px 0 0}
.kind{font-size:10px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--muted)}
.k-move{background:var(--good-s);color:var(--good)}
.k-conc{background:var(--warn-s);color:var(--warn)}
.k-clear{background:var(--bad-s);color:var(--bad)}
.k-new{background:var(--accent-s);color:var(--accent)}
.disc{color:var(--bad);font-weight:600}
.muted{color:var(--muted)}
.tick{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.more{margin:10px 0;text-align:center}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:min(1208px,calc(100% - 24px));
 background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;display:flex;gap:12px;
 align-items:center;justify-content:space-between;box-shadow:var(--shadow);z-index:5}
.note{font-size:12px;color:var(--muted);line-height:1.55}
.legend{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12.5px;
 line-height:1.6;margin-bottom:12px}
/* desk */
details.item{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
details.item>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;justify-content:space-between;
 gap:10px;align-items:center;flex-wrap:wrap}
details.item>summary::-webkit-details-marker{display:none}
.code{font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:15px}
.nm{color:var(--muted);font-size:12px}
.tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);margin-left:4px}
.tag.rec{background:var(--good-s);color:var(--good)}
.panel{padding:0 14px 14px}
.colhead{font-weight:600;margin:12px 0 6px;font-size:13px}
.colhead span{font-weight:400;color:var(--muted);font-size:12px}
td.sz{min-width:34px;text-align:center}
td.sz.gap{color:var(--muted)}
td.sz.fill{background:var(--good-s);color:var(--good);font-weight:700}
td.sz.take{color:var(--bad);font-weight:600}
th.sz{text-align:center}
th.dead{opacity:.5}
tr.get{background:var(--good-s)}
tr.give{background:var(--warn-s)}
.pick{display:flex;gap:4px;justify-content:flex-end}
.pick button{border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:11px;
 font-weight:700;padding:4px 8px;border-radius:7px;cursor:pointer}
.pick button[data-role="r"][aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.pick button[data-role="g"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.pick button[data-role="x"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
td.left.chg{font-weight:700}
td.left.zero{color:var(--bad);font-weight:700}
.warn{background:var(--bad-s);color:var(--bad);border-radius:8px;padding:6px 10px;font-size:12px;margin:0 0 6px}
.plan{margin-top:10px}
.fresh{font-size:12px;color:var(--muted);margin:-8px 0 12px}
.fresh.warn{margin-top:-6px}
.colcap{margin:4px 0 8px}
.colcap .seg button{min-width:38px}
.plan h4{margin:6px 0;font-size:13px}
.empty{color:var(--muted);padding:14px}
.status{font-size:12px;color:var(--muted)}
.olist h2{font-size:18px;margin:18px 0 2px}
table.grid th,table.grid td{padding:4px 5px;font-size:11.5px;text-align:center}
table.grid th{font-size:9px;line-height:1.2;text-transform:none;letter-spacing:0}
table.grid td.l,table.grid th.l{text-align:left}
table.grid tr.sub td{background:var(--soft);font-weight:600}
table.grid tr.gt td{border-top:2px solid var(--ink);font-weight:700}
table.grid .tk{width:22px}
.ao{font-size:9px;font-weight:700;color:var(--bad)}
details.recvd{margin-top:10px}
details.recvd summary{cursor:pointer;font-weight:600;font-size:13px;margin-bottom:6px}
.olist h3{font-size:14px;margin:14px 0 6px}
.olist h3.recv{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
.olist h4{font-size:13px;margin:10px 0 6px}
.olist h4.sgrp{margin:14px 0 4px;font-size:13px}
.sumt tr.ohead td{background:var(--soft);font-size:13px}
.sumt .up{color:var(--good);font-size:10px}
.sumt .down{color:var(--bad);font-size:10px}
.swatch{padding:0 5px;border-radius:4px}
.swatch.bad{background:color-mix(in srgb,var(--bad) 40%,transparent)}
.swatch.acc{background:color-mix(in srgb,var(--accent) 40%,transparent)}
@media print{
  body{background:#fff;color:#000}
  .noprint,.dock,.facts,.legend,.sub,h1,#winNote,.bar,.tabs,#choose,#desk,#summary{display:none!important}
  .wrap{padding:0;max-width:none}
  .scroll{overflow:visible;border:0}
  .olist{break-after:page}
  .olist:last-child{break-after:auto}
  th{position:static}
  td,th{font-size:11px;padding:4px 6px}
  @page{size:A4 portrait;margin:10mm}
  table.grid th,table.grid td{font-size:8.5px;padding:2px 3px;border-bottom:1px solid #999}
  table.grid th{font-size:7.5px}
  details.recvd{display:none}
  .olist h2{font-size:14px;margin:0 0 2px}
  .olist .note{font-size:9px;margin:0 0 4px}
  .olist h4.sgrp{font-size:10px;margin:6px 0 2px;break-after:avoid}
  table.grid{break-inside:auto}
}
.msg{max-width:520px;margin:18vh auto;text-align:center;padding:0 16px}
@media (max-width:760px){
  .wrap{padding:14px 12px 150px}
  .dock{flex-direction:column;align-items:stretch;gap:8px}
  #choose table,#choose thead,#choose tbody,#choose tr,#choose td{display:block}
  #choose thead{display:none}
  #choose .scroll{border:0;background:transparent;overflow:visible}
  #choose tr{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;position:relative}
  #choose tr.on{border-color:var(--accent)}
  #choose td{border:0;padding:0;text-align:left;white-space:normal}
  #choose td.o{margin-bottom:6px;padding-right:34px}
  #choose td.tk{position:absolute;top:10px;right:10px}
  #choose td[data-h]{display:inline-block;min-width:31%;margin:0 2% 6px 0}
  #choose td[data-h]::before{content:attr(data-h);display:block;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
}
</style>
</head>
<body>
<div id="app" class="wrap"><div class="msg"><h1>加载中…</h1></div></div>
<script>
(function(){
"use strict";
var D=null, W="6", CAP=3, VIEW="choose", SORT={k:"stuck",d:-1}, LIMIT=150;
var TICK=new Set(), ROLES={}, CAPS={}, KEYHEX=null, STORE=null;
/* Tze, 2026-09-22: "can you do it for every article color and also a global switch ... a default switch
   so they can ... adjust individually for every article color, because the demand changes for every color".
   CAP is the page default; CAPS["art|col"] overrides it for one colour. */
function capOf(a,c){var v=CAPS[a+"|"+c];return v?v:CAP;}
var TARGET_WK=12, MAX_COVER=26, TOO_NEW=120;
var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var LET={"XS":-2,"S":-1,"M":0,"L":1,"XL":2,"XXL":3,"2XL":3,"XXXL":4,"3XL":4};
function sizeCmp(a,b){var na=parseFloat(a),nb=parseFloat(b),ia=!isNaN(na)&&/^[\d.]+$/.test(a),ib=!isNaN(nb)&&/^[\d.]+$/.test(b);
  if(ia&&ib)return na-nb; if(ia!==ib)return ia?1:-1; var la=LET[a]!=null?LET[a]:9, lb=LET[b]!=null?LET[b]:9; return la-lb||(a<b?-1:a>b?1:0);}
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(iso){if(!iso)return "–";var p=iso.split("-");return p[0]+"年"+(+p[1])+"月"+(+p[2])+"日";}
function monYr(iso){if(!iso)return "–";var p=iso.split("-");return p[0]+"年"+(+p[1])+"月";}
function daysSince(iso){if(!iso)return null;return Math.round((new Date(D.built)-new Date(iso))/864e5);}
function ageTxt(d){if(d==null)return "";if(d<60)return d+"天";var m=Math.round(d/30.44);return m<24?m+"个月":(Math.floor(m/12)+"年"+(m%12)+"个月");}
function rm(v){return v?"RM"+(Math.round(v*100)/100).toLocaleString("en-MY"):"–";}

/* ---------- derived figures (all follow the chosen window W) ---------- */
function rowSold(r){return (r.s&&r.s[W])||0;}
function rowHeld(r){var n=0;for(var k in r.q)n+=r.q[k];return n;}
function priceNow(a){return a.nett&&a.nett<a.p?a.nett:a.p;}
var CACHE={}, SGART=null;
function sgArt(code){
  if(!SGART){SGART={};var ss=(D.sg&&D.sg.s)||{};for(var k in ss){var a=k.split("|")[0],v=ss[k];
    var x=SGART[a]=SGART[a]||[0,0];x[0]+=v[0];x[1]+=v[1];}}
  return SGART[code]||[0,0];
}
function sgCol(a,c){return ((D.sg&&D.sg.s)||{})[a+"|"+c]||null;}
function stats(a){
  var ck=a.a+"|"+W; if(CACHE[ck])return CACHE[ck];
  var held=0,sold=0,stuck=0,room=0,doors=new Set(),sell=new Set(),dead=new Set();
  a.cols.forEach(function(c){c.rows.forEach(function(r){
    var h=rowHeld(r),s=rowSold(r);held+=h;sold+=s;if(h)doors.add(r.o);
    if(s){sell.add(r.o);room+=Math.max(0,Math.round(s/(+W*4.35)*TARGET_WK)-h);}
    else if(h){stuck+=h;dead.add(r.o);}
  });});
  var age=daysSince(a.start), rehome=Math.min(room,stuck), per=doors.size?held/doors.size:0, kind;
  if(age!=null&&age<TOO_NEW)kind="new";
  else if(!stuck)kind="ok";
  else if(rehome>=4&&rehome>=stuck*0.15)kind="move";
  else if(sold>=8&&per<4)kind="conc";
  else if(sold<Math.max(3,doors.size*0.5))kind="clear";
  else kind=rehome>=4?"move":"conc";
  return CACHE[ck]={sg:sgArt(a.a)[0],held:held,sold:sold,stuck:stuck,room:room,rehome:rehome,doors:doors.size,sell:sell.size,
    dead:dead.size,age:age,kind:kind,price:priceNow(a)};
}
var KIND={move:["可调货","k-move","同区有分店在卖而且还有空间，调货可以解决。"],
  conc:["集中","k-conc","有在卖，但分得太散。集中到较少的分店。"],
  clear:["清货","k-clear","这区几乎卖不动，调货没用：减价、配套或收回。"],
  new:["太新","k-new","到货不到 "+TOO_NEW+" 天，先让它卖一段时间。"],
  ok:["正常","","所有有货的分店都有在卖。"]};
var BANDS=[["","所有价格"],["0-99","RM100 以下"],["100-149","RM100–149"],["150-199","RM150–199"],["200-299","RM200–299"],["300-99999","RM300 以上"]];

/* ---------- state: this browser + shareable in the link ---------- */
function saveState(){try{localStorage.setItem(STORE,JSON.stringify({t:[...TICK],r:ROLES,cap:CAP,caps:CAPS,w:W}));}catch(e){}}
function loadState(){
  var s=null; var m=(location.hash||"").match(/[&]s=([A-Za-z0-9_\-]+)/);
  if(m){try{s=JSON.parse(decodeURIComponent(escape(atob(m[1].replace(/-/g,"+").replace(/_/g,"/")))));}catch(e){}}
  if(!s){try{s=JSON.parse(localStorage.getItem(STORE)||"null");}catch(e){}}
  if(s){TICK=new Set(s.t||[]);ROLES=s.r||{};CAP=s.cap||3;CAPS=s.caps||{};if(s.w&&D.windows.indexOf(s.w)>=0)W=s.w;}
}
function shareLink(){
  var raw=JSON.stringify({t:[...TICK],r:ROLES,cap:CAP,caps:CAPS,w:W});
  var b=btoa(unescape(encodeURIComponent(raw))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return location.origin+location.pathname+"#"+KEYHEX+"&s="+b;
}

/* ---------- desk: roles, suggestion, allocation ---------- */
function rk(a,c,o){return a+"|"+c+"|"+o;}
function sizesOf(a,c){var set={};c.rows.forEach(function(r){for(var k in r.q)set[k]=1;});
  var ss=D.ss[a.a+"|"+c.c]||{};for(var k in ss)set[k]=1;return Object.keys(set).sort(sizeCmp);}
function liveSizes(a,c){var ss=D.ss[a.a+"|"+c.c]||{};var l=sizesOf(a,c).filter(function(s){return ss[s]&&ss[s][W];});
  return l.length?l:sizesOf(a,c).filter(function(s){return c.rows.some(function(r){return r.q[s];});});}
function cover(r){var s=rowSold(r);if(!s)return null;return Math.round(rowHeld(r)/(s/(+W*4.35)));}
function suggest(a,c,r){
  var st=stats(a), s=rowSold(r), h=rowHeld(r);
  if(!s&&h&&st.kind!=="new")return "g";
  if(s&&sameBrand(a,r)){var cv=cover(r);var short=liveSizes(a,c).some(function(z){return (r.q[z]||0)<capOf(a.a,c.c);});
    if(short&&(cv===null||cv<=MAX_COVER))return "r";}
  return "";
}
function sameBrand(a,r){return r.o.slice(0,2)===a.b;}
function roleOf(a,c,r){var k=rk(a.a,c.c,r.o),v=ROLES[k]!==undefined?ROLES[k]:suggest(a,c,r);return v==="r"&&!sameBrand(a,r)?"":v;}
/* Roles: r = GET, g = GIVE (only what receivers need, up to CAP a size), x = ALL OUT (the door
   sends every piece of the art-colour - promoters often want nothing left behind). */
var UNPLACED={};                                 // "art|col" -> pcs an ALL OUT door could not place
function allocate(a){
  var moves=[];
  function add(from,to,c,z){var m=moves.find(function(x){return x.from===from&&x.to===to&&x.c===c&&x.z===z;});
    if(m)m.q++;else moves.push({a:a.a,c:c,from:from,to:to,z:z,q:1});}
  a.cols.forEach(function(c){
    var role={};c.rows.forEach(function(r){role[r.o]=roleOf(a,c,r);});
    var give=c.rows.filter(function(r){return role[r.o]==="g"||role[r.o]==="x";});
    var allOut=c.rows.filter(function(r){return role[r.o]==="x";});
    var get=c.rows.filter(function(r){return role[r.o]==="r";}).sort(function(x,y){return rowSold(y)-rowSold(x);});
    var key=a.a+"|"+c.c, cap=capOf(a.a,c.c); delete UNPLACED[key];
    if(!give.length)return;
    if(!get.length){var left=allOut.reduce(function(n,r){return n+rowHeld(r);},0);if(left)UNPLACED[key]=left;return;}
    var pool={};give.forEach(function(g){pool[g.o]=Object.assign({},g.q);});
    var got={};                                  // size -> outlet -> pcs received
    function have(r,z){return (r.q[z]||0)+((got[z]||{})[r.o]||0);}
    function take(from,r,z){pool[from][z]--;got[z]=got[z]||{};got[z][r.o]=(got[z][r.o]||0)+1;add(from,r.o,c.c,z);}
    // pass 1: fill each receiver up to CAP per selling size; ALL OUT doors are emptied first
    liveSizes(a,c).forEach(function(z){
      for(var guard=0;guard<60;guard++){
        var moved=false;
        for(var i=0;i<get.length;i++){
          var r=get[i]; if(have(r,z)>=cap)continue;
          var best=null;give.forEach(function(g){var n=pool[g.o][z]||0;if(g.o===r.o||!n)return;
            var pri=role[g.o]==="x"?1:0;if(!best||pri>best.pri||(pri===best.pri&&n>best.n))best={o:g.o,pri:pri,n:n};});

    // holding the least of that size (best seller first on a tie) - the cap no longer applies

      var tg=get.filter(function(r){return r.o!==g.o;});

   read as confusing. Rows are now GROUPED BY SIZE SYSTEM - shirts (collar), tops (S-XXXL), pants

    if(t.dataset.win){W=t.dataset.win;saveState();render();return;}
    if(t.dataset.sort){var k=t.dataset.sort;SORT=SORT.k===k?{k:k,d:-SORT.d}:{k:k,d:(k==="a"||k==="g"||k==="kind")?1:-1};renderChoose();return;}
    if(t.dataset.tick!==undefined){if(t.checked)TICK.add(t.dataset.tick);else TICK.delete(t.dataset.tick);
      t.closest("tr").className=t.checked?"on":"";saveState();render();return;}
    if(t.dataset.cap){CAP=+t.dataset.cap;saveState();render();return;}
    if(t.dataset.cn!==undefined){var ck=t.dataset.ca+"|"+t.dataset.cc;if(+t.dataset.cn)CAPS[ck]=+t.dataset.cn;else delete CAPS[ck];
      OPEN.add(t.dataset.ca);saveState();render();return;}
    if(t.dataset.role){var k2=rk(t.dataset.a,t.dataset.c,t.dataset.o);
      var a=D.arts.find(function(x){return x.a===t.dataset.a;}),c=a.cols.find(function(x){return x.c===t.dataset.c;}),r=c.rows.find(function(x){return x.o===t.dataset.o;});
      ROLES[k2]=roleOf(a,c,r)===t.dataset.role?"":t.dataset.role;OPEN.add(a.a);saveState();render();return;}
    switch(t.id){
      case "printList":window.print();break;
      case "copyList":var mv=allMoves(),os=LIST_OUTLET==="ALL"?D.outlets.map(function(x){return x.o;}).filter(function(o){return mv.some(function(m){return m.from===o;});}):[LIST_OUTLET];
        copy(os.map(function(o){return listText(o,mv);}).join("\n\n"),"#listStatus");break;
      case "csvList":var rows2=[["From","FromName","To","ToName","Article","Description","Colour","Size","Qty"]].concat(allMoves().map(function(m){
          return [m.from,outletName(m.from),m.to,outletName(m.to),m.a,(artOf(m.a)||{}).n||"",m.c,m.z,m.q];}));
        var blob2=new Blob([rows2.map(function(r){return r.map(function(v){v=String(v);return /[",]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",");}).join("\n")],{type:"text/csv"});
        var a2=document.createElement("a");a2.href=URL.createObjectURL(blob2);a2.download=D.title.replace(/\W+/g,"_")+"_transfer_lists_"+D.built+".csv";a2.click();break;
      case "goDesk":VIEW=VIEW==="desk"?"choose":"desk";render();window.scrollTo(0,0);break;
      case "moreBtn":LIMIT+=150;renderChoose();break;
      case "tickAll":CUR_LIST.slice(0,LIMIT).forEach(function(a){TICK.add(a.a);});saveState();render();break;
      case "untick":TICK.clear();saveState();render();break;
      case "allOut":D.arts.forEach(function(a){if(!TICK.has(a.a))return;a.cols.forEach(function(c){c.rows.forEach(function(r){
          if(roleOf(a,c,r)==="g")ROLES[rk(a.a,c.c,r.o)]="x";});});});saveState();render();break;
      case "resetCaps":CAPS={};saveState();render();break;
      case "resetRoles":if(confirm("放弃你对收货 / 调出的更改，恢复建议？")){ROLES={};saveState();render();}break;
      case "copyWa":copy(waText(),"#copyStatus");break;
      case "share":copy(shareLink(),"#dockTxt");break;
      case "csv":var rows=[["From","To","Article","Colour","Size","Qty"]].concat(allMoves().map(function(m){return [m.from,m.to,m.a,m.c,m.z,m.q];}));
        var blob=new Blob([rows.map(function(r){return r.join(",");}).join("\n")],{type:"text/csv"});
        var aEl=document.createElement("a");aEl.href=URL.createObjectURL(blob);aEl.download=D.title.replace(/\W+/g,"_")+"_conso_plan_"+D.built+".csv";aEl.click();break;
    }
  });
  document.addEventListener("toggle",function(e){var d=e.target;if(d.dataset&&d.dataset.art){if(d.open)OPEN.add(d.dataset.art);else OPEN.delete(d.dataset.art);}},true);
  document.addEventListener("change",function(e){
    if(e.target.id==="listSel"){LIST_OUTLET=e.target.value;renderLists();}
    if(e.target.id==="hideSea"){HIDE_SEA=e.target.checked;renderSummary();}

    if(e.target.dataset&&e.target.dataset.pick!==undefined){PICKED[e.target.dataset.pick]=e.target.checked;try{localStorage.setItem(STORE+":picked",JSON.stringify(PICKED));}catch(x){}}
  });
  document.addEventListener("input",function(e){if(e.target.closest("#choose .filters")){LIMIT=150;renderChoose();}});
}

/* ---------- crypto (same contract as push_board.py) ---------- */
function readKey(){var h=(location.hash||"").replace(/^#/,"").split("&")[0].trim();return /^[0-9a-fA-F]{64}$/.test(h)?h.toLowerCase():null;}
function hexToBytes(h){var o=new Uint8Array(h.length/2);for(var i=0;i<o.length;i++)o[i]=parseInt(h.substr(i*2,2),16);return o;}
function b64(s){var b=atob(s),o=new Uint8Array(b.length);for(var i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o;}
function fail(t){$("#app").innerHTML='<div class="msg"><h1>'+esc(t)+"</h1><p class=\"muted\">请按原样打开链接，必须包含 # 后面的全部内容。</p></div>";}
KEYHEX=readKey();
if(!KEYHEX||!window.crypto||!crypto.subtle){fail("链接不完整。");return;}
crypto.subtle.digest("SHA-256",new TextEncoder().encode(KEYHEX)).then(function(buf){
  var b=new Uint8Array(buf),id="";for(var i=0;i<8;i++)id+=(b[i]<16?"0":"")+b[i].toString(16);
  return Promise.all([fetch("k/"+id+".json",{cache:"no-store"}),crypto.subtle.importKey("raw",hexToBytes(KEYHEX),{name:"AES-GCM"},false,["decrypt"])]);
}).then(function(r){if(!r[0].ok)throw new Error("missing");return r[0].json().then(function(doc){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(doc.iv),tagLength:128},r[1],b64(doc.ct));});
}).then(function(buf){D=JSON.parse(new TextDecoder().decode(buf));boot();},function(){fail("无法打开此页面。");});
window.addEventListener("hashchange",function(){location.reload();});
})();
</script>
