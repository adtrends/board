<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>EM Pooling - 三佳 #426 / #427 / #442</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* layout: one table of this order's EM outlets; sticky total bar at the bottom */
:root{--bg:#f5f6f4;--card:#fff;--fg:#1d2321;--mute:#5d6863;--line:#d9dfdb;--accent:#0f6b5c;--ok:#1f7a3f;--okbg:#e4f3e8;--bad:#a3261d;--badbg:#fbe6e3;--sel:#e8f1ee;
--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#141917;--card:#1c2320;--fg:#e7ece9;--mute:#9aa6a0;--line:#2f3934;--accent:#4fc2ab;--ok:#7fd59b;--okbg:#1d3226;--bad:#f08a80;--badbg:#3b1f1c;--sel:#22302b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) 120px max(14px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:14px 0 2px;text-wrap:balance}.sub{color:var(--mute);margin:0 0 12px;font-size:13.5px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-weight:600}
td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td b{font-family:var(--mono);font-weight:500}td small{display:block;color:var(--mute);font-size:12px}
tr.city td{background:var(--bg);font-weight:600;font-size:13px}
tr.on td{background:var(--sel)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.pill{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}.ok{background:var(--okbg);color:var(--ok)}.bad{background:var(--badbg);color:var(--bad)}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}
.fi{max-width:720px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.tot{font-family:var(--mono);font-size:17px;font-weight:500}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:7px;padding:6px 11px;cursor:pointer}button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style></head><body><div class="wrap">
<h1>EM pooling - 三佳 #426 / #427 / #442</h1>
<p class="sub">m³ per East Malaysia outlet for this order. Outlets at 0.3 m³ or more can go SRA on their own. Tick the outlets to send together in one drop; the bar at the bottom adds them up.</p>
<div class="tw"><table><thead><tr><th></th><th>Outlet</th><th style="text-align:right">Ctns</th><th style="text-align:right">m³</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<div class="foot"><div class="fi"><span>Ticked: <span id="cnt">0</span> outlets · <span class="tot" id="tot">0.000 m³</span> <span class="pill" id="st"></span></span>
<span><button class="pri" id="copy">Copy ticked</button> <button id="clr">Clear</button></span></div></div>
<script>
const ROWS=[{"c": "ADEMPGIK-C", "n": "PARKSON - IMAGO SHOPPING MALL", "s": "SB-ADT-KK01", "city": "Kota Kinabalu", "k": 1.0, "m": 0.0839}, {"c": "BFEMPGIK-C", "n": "PARKSON - IMAGO SHOPPING MALL BF", "s": "SB-ADT-KK01", "city": "Kota Kinabalu", "k": 8.0, "m": 0.5545}, {"c": "ADEMTDKK-C", "n": "TONG'S DEPARTMENTAL STORE KK", "s": "SB-ADT-KK02", "city": "Kota Kinabalu", "k": 1.0, "m": 0.0839}, {"c": "BFEMPGOB-C", "n": "PARKSON - ONE BORNEO BF", "s": "SB-ADT-KK03", "city": "Kota Kinabalu", "k": 5.0, "m": 0.3466}, {"c": "ADEMPGVC-C", "n": "PARKSON - VIVACITY MEGAMALL", "s": "SW-ADT-KC01", "city": "Kuching", "k": 1.0, "m": 0.0839}, {"c": "BFEMPGVC-C", "n": "PARKSON - VIVACITY MEGAMALL BF", "s": "SW-ADT-KC01", "city": "Kuching", "k": 6.0, "m": 0.4159}, {"c": "ADEMPGPM-C", "n": "PARKSON - PLAZA MERDEKA", "s": "SW-ADT-KC02", "city": "Kuching", "k": 1.0, "m": 0.0839}, {"c": "ADEMPRSB-C", "n": "PREMIER DEPARTMENT STORE SIBU", "s": "SW-ADT-SB01", "city": "Sibu", "k": 1.0, "m": 0.0839}, {"c": "BFEMPGSB-C", "n": "PARKSON - RIA SIBU BF", "s": "SW-ADT-SB04", "city": "Sibu", "k": 4.0, "m": 0.2772}], MIN=0.3;
const $=id=>document.getElementById(id);let T=new Set();
try{(JSON.parse(localStorage.getItem("empool_sj426")||"[]")).forEach(c=>T.add(c))}catch(e){}
function render(){let h="",city="";
for(const r of ROWS){if(r.city!==city){city=r.city;h+='<tr class="city"><td colspan="5">'+city+'</td></tr>'}
const on=T.has(r.c);h+='<tr class="'+(on?"on":"")+'"><td><input type="checkbox" data-c="'+r.c+'"'+(on?" checked":"")+' aria-label="pool '+r.c+'"></td><td><b>'+r.c+'</b><small>'+r.n+' · '+r.s+'</small></td><td class="n">'+r.k+'</td><td class="n">'+r.m.toFixed(3)+'</td><td>'+(r.m>=MIN-1e-9?'<span class="pill ok">alone</span>':'')+'</td></tr>'}
$("tb").innerHTML=h;document.querySelectorAll("input[data-c]").forEach(i=>i.onchange=()=>{i.checked?T.add(i.dataset.c):T.delete(i.dataset.c);try{localStorage.setItem("empool_sj426",JSON.stringify([...T]))}catch(e){}render()});sum()}
function sum(){const sel=ROWS.filter(r=>T.has(r.c)),m=sel.reduce((a,r)=>a+r.m,0);$("cnt").textContent=sel.length;$("tot").textContent=m.toFixed(3)+" m³";
const st=$("st");if(!sel.length){st.textContent="";st.className="pill"}else if(m>=MIN-1e-9){st.textContent="reaches 0.3";st.className="pill ok"}else{st.textContent="under 0.3";st.className="pill bad"}}
$("clr").onclick=()=>{T.clear();try{localStorage.removeItem("empool_sj426")}catch(e){}render()};
$("copy").onclick=async()=>{const sel=ROWS.filter(r=>T.has(r.c));const m=sel.reduce((a,r)=>a+r.m,0);
const t="三佳 #426 / #427 / #442 - send together ("+m.toFixed(2)+" m3):\n"+sel.map(r=>r.c+" "+r.m.toFixed(2)+" m3").join("\n");
try{await navigator.clipboard.writeText(t);$("copy").textContent="Copied"}catch(e){$("copy").textContent="Copy failed"}setTimeout(()=>{$("copy").textContent="Copy ticked"},1600)};
render();
</script></body></html>
